name: Lint Charts

on:
  pull_request:
    paths:
      - 'blueprints/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: latest

      - name: Lint all charts
        run: make lint
