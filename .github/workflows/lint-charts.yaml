name: Lint Charts

on:
  pull_request:
    paths:
      - 'blueprints/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v4.2.0'

      - name: Lint all charts
        run: make lint

      - name: Template dry-run all charts
        run: make validate
