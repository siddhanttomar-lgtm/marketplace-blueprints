name: Release Charts

on:
  push:
    tags:
      - '*-v*'    # e.g. n8n-v2.0.8, apisix-v3.3.0

permissions:
  contents: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v4.2.0'

      - name: Validate charts before release
        run: make validate

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: blueprints
          config: .charts-releaser.yaml
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
