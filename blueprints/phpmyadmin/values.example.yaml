# phpMyAdmin — example configuration
# Copy this file, fill in required values, and pass to helm install:
#   helm install phpmyadmin blueprints/phpmyadmin -f my-values.yaml

# ── Database ──────────────────────────────────────────────────────────────────

db:
  # Set to true to deploy a bundled MariaDB instance
  bundleTestDB: true
  # Or point to an external DB:
  # bundleTestDB: false
  # host: "your-db-host"
  # port: 3306

# Bundled MariaDB credentials (used when db.bundleTestDB=true)
mariadb:
  auth:
    rootPassword: "YOUR-ROOT-PASSWORD-HERE"
  primary:
    persistence:
      size: 8Gi
      storageClass: ""    # leave empty for cluster default

# ── Networking ────────────────────────────────────────────────────────────────

service:
  type: NodePort    # set NodePort for external access
