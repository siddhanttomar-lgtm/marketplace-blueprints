# Redis — example configuration
# Copy this file, fill in required values, and pass to helm install:
#   helm install redis blueprints/redis -f my-values.yaml

# ── Required ──────────────────────────────────────────────────────────────────

auth:
  password: "YOUR-STRONG-PASSWORD-HERE"

# ── Storage ───────────────────────────────────────────────────────────────────

persistence:
  enabled: true
  size: 8Gi
  storageClass: ""   # leave empty to use cluster default

# ── Networking ────────────────────────────────────────────────────────────────

service:
  type: NodePort
  port: 6379
  nodePort: ""       # leave empty for auto-assignment

# ── Resources ─────────────────────────────────────────────────────────────────

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
