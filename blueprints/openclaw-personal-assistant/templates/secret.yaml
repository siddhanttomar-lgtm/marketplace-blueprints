apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: openclaw-tir
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: {{ .Values.gateway.token | quote }}
  E2E_MODEL_NAME: {{ .Values.e2e.modelName | default "gpt_oss_120b" | quote }}
  E2E_BEARER_TOKEN: {{ .Values.e2e.bearerToken | default "" | quote }}
  E2E_PROJECT_NAMESPACE: {{ .Values.global.platform.tirProjectId | default "" | quote }}
