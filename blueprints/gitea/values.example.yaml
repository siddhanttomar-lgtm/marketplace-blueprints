# Gitea — example values
# helm install gitea blueprints/gitea -f my-values.yaml

gitea:
  admin:
    username: gitea_admin
    password: "YOUR-ADMIN-PASSWORD"
    email: "admin@example.com"

service:
  type: NodePort

persistence:
  size: 10Gi
  storageClass: ""

postgresql:
  auth:
    password: "YOUR-DB-PASSWORD"
  primary:
    persistence:
      size: 8Gi
      storageClass: ""

resources:
  requests:
    cpu: 250m
    memory: 256Mi
