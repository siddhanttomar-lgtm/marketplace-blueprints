global:
  platform:
    tirProjectId: ""

openclaw:
  image:
    repository: registry.e2enetworks.net/marketplace-blueprint/openclaw
    tag: "slim"
    pullPolicy: IfNotPresent
  storage:
    size: "5Gi"
  gatewayToken: "PMAgent@12345"
  pmName: "Alex"
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

zoho:
  clientId: ""
  clientSecret: ""
  refreshToken: ""
  workspaceId: ""

telegram:
  botToken: ""
  # SECURITY: comma-separated Telegram numeric user IDs allowed to use the bot
  # (get yours from @userinfobot). Without this, unknown DMs are HELD for approval.
  allowedUserIds: ""
  # Optional explicit chat ID for proactive pushes (e.g. a group).
  chatId: ""

slack:
  botToken: ""
  teamId: ""
  standupChannel: ""

standup:
  # All cron times in UTC. IST = UTC+5:30.
  morningCron:  "30 3 * * 1-5"    # 09:00 IST weekdays
  eodCron:      "30 15 * * 1-5"   # 21:00 IST weekdays
  alertCron:    "0 */2 * * *"     # every 2 hours
  snapshotCron: "30 17 * * *"     # 23:00 IST daily
  weeklyCron:   "30 11 * * 5"     # 17:00 IST Friday
  enabled: ""

stakeholder:
  # Comma-separated emails for the weekly report
  emails: ""

persistence:
  accessMode: ReadWriteOnce

nodeSelector: {}

e2e:
  projectNamespace: ""
  modelName: "gpt_oss_120b"
  bearerToken: ""
