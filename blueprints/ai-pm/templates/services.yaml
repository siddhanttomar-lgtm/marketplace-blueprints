apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aipm.labels" . | nindent 4 }}
    app.kubernetes.io/component: openclaw
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 18789
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: openclaw
