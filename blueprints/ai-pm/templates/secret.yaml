{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-credentials" .Release.Name) }}
{{- $gatewayToken := "" }}
{{- if and $existing (not .Values.openclaw.gatewayToken) }}
{{- $gatewayToken = index $existing.data "OPENCLAW_GATEWAY_TOKEN" | b64dec }}
{{- else }}
{{- $gatewayToken = .Values.openclaw.gatewayToken | default (randAlphaNum 24) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aipm.labels" . | nindent 4 }}
type: Opaque
stringData:
  # OpenClaw Gateway
  OPENCLAW_GATEWAY_TOKEN: {{ $gatewayToken | quote }}
  # Zoho Sprints
  ZOHO_CLIENT_ID: {{ .Values.zoho.clientId | default "" | quote }}
  ZOHO_CLIENT_SECRET: {{ .Values.zoho.clientSecret | default "" | quote }}
  ZOHO_REFRESH_TOKEN: {{ .Values.zoho.refreshToken | default "" | quote }}
  ZOHO_WORKSPACE_ID: {{ .Values.zoho.workspaceId | default "" | quote }}
  # Messaging (optional)
  SLACK_BOT_TOKEN: {{ .Values.slack.botToken | default "" | quote }}
  SLACK_TEAM_ID: {{ .Values.slack.teamId | default "" | quote }}
  SLACK_STANDUP_CHANNEL: {{ .Values.slack.standupChannel | default "" | quote }}
  TELEGRAM_BOT_TOKEN: {{ regexReplaceAll "\\s+" (.Values.telegram.botToken | default "") "" | quote }}
  TELEGRAM_ALLOWED_USER_IDS: {{ .Values.telegram.allowedUserIds | default "" | quote }}
  TELEGRAM_CHAT_ID: {{ .Values.telegram.chatId | default "" | quote }}
  # Stakeholder reporting (optional)
  STAKEHOLDER_EMAILS: {{ .Values.stakeholder.emails | default "" | quote }}
  # E2E TIR — namespace injected by platform at deploy time via global.platform.tirProjectId;
  # e2e.projectNamespace is a manual override fallback for deploys outside the platform.
  E2E_PROJECT_NAMESPACE: {{ .Values.global.platform.tirProjectId | default (.Values.e2e.projectNamespace | default "") | quote }}
  E2E_MODEL_NAME: {{ .Values.e2e.modelName | default "gpt_oss_120b" | quote }}
  E2E_BEARER_TOKEN: {{ .Values.e2e.bearerToken | default "" | quote }}
