{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-credentials" .Release.Name) }}
{{- $gatewayToken := "" }}
{{- $agentToken := "" }}
{{- $secretKey := "" }}
{{- if $existing }}
{{- $gatewayToken = index $existing.data "OPENCLAW_GATEWAY_TOKEN" | b64dec }}
{{- $agentToken   = index $existing.data "PLANE_AGENT_TOKEN"       | b64dec }}
{{- $secretKey    = index $existing.data "PLANE_SECRET_KEY"        | b64dec }}
{{- else }}
{{- $gatewayToken = .Values.openclaw.gatewayToken | default (randAlphaNum 24) }}
{{- $agentToken   = .Values.plane.agentApiToken   | default (randAlphaNum 50) }}
{{- $secretKey    = .Values.plane.secretKey        | default (randAlphaNum 50) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aipm.labels" . | nindent 4 }}
type: Opaque
stringData:
  # OpenClaw
  OPENCLAW_GATEWAY_TOKEN: {{ $gatewayToken | quote }}
  ANTHROPIC_API_KEY: {{ .Values.openclaw.anthropicApiKey | default "" | quote }}
  OPENAI_API_KEY: {{ .Values.openclaw.openaiApiKey | default "" | quote }}
  GOOGLE_API_KEY: {{ .Values.openclaw.googleApiKey | default "" | quote }}
  GROQ_API_KEY: {{ .Values.openclaw.groqApiKey | default "" | quote }}
  FIREWORKS_API_KEY: {{ .Values.openclaw.fireworksApiKey | default "" | quote }}
  # Slack + Telegram
  SLACK_BOT_TOKEN: {{ .Values.slack.botToken | default "" | quote }}
  TELEGRAM_BOT_TOKEN: {{ .Values.telegram.botToken | default "" | quote }}
  # Plane
  PLANE_ADMIN_EMAIL: {{ .Values.plane.adminEmail | required "plane.adminEmail is required" | quote }}
  PLANE_ADMIN_PASSWORD: {{ .Values.plane.adminPassword | required "plane.adminPassword is required" | quote }}
  PLANE_SECRET_KEY: {{ $secretKey | quote }}
  PLANE_AGENT_TOKEN: {{ $agentToken | quote }}
  PLANE_WORKSPACE_SLUG: {{ .Values.plane.workspaceSlug | default "my-team" | quote }}
  # PostgreSQL
  POSTGRES_USER: {{ .Values.postgres.username | default "plane" | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | required "postgres.password is required" | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | default "plane" | quote }}
  # Redis
  REDIS_PASSWORD: {{ .Values.redis.password | default "" | quote }}
