apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-ingress-patcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aipm.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-ingress-patcher
  labels:
    {{- include "aipm.labels" . | nindent 4 }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-ingress-patcher
  labels:
    {{- include "aipm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-ingress-patcher
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-ingress-patcher
    namespace: {{ .Release.Namespace }}
