kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-openclaw-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aipm.labels" . | nindent 4 }}
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": { "mode": "token" },
