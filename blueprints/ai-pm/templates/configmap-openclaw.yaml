  HEARTBEAT.md: |
    # Heartbeat

    Cron is enabled on this deployment.

    ## Active Schedules

    - **Morning standup** (weekdays 9am IST): `node zoho-sprints.js standup --project {activeProject} --mode morning --post-slack`
      Posts to SLACK_STANDUP_CHANNEL: 🌅 Sprint status · In Progress · Up Next · Overdue
    - **End-of-day update** (weekdays 9pm IST): `node zoho-sprints.js standup --project {activeProject} --mode eod --post-slack`
      Posts to SLACK_STANDUP_CHANNEL: 📊 Completed today · In Progress · Still To Do · Overdue
    - **Weekly summary** (Friday 5pm IST): sprint velocity, closures, blockers

    ## Adding a New Schedule

    Ask {{ .Values.openclaw.pmName | default "Alex" }} to set up a cron job.
    Example: "remind me every Monday to run a sprint review"

  zoho-sprints.js: |
    #!/usr/bin/env node
    'use strict';
    const https = require('https');
    const fs = require('fs');

    // ── Config ────────────────────────────────────────────────────────────────
    const ZOHO_CREDS_FILE = '/home/node/.openclaw/zoho-credentials.json';
    function loadZohoCreds() {
      try {
        const c = JSON.parse(fs.readFileSync(ZOHO_CREDS_FILE,'utf8'));
        return {
          clientId:     c.clientId     || process.env.ZOHO_CLIENT_ID     || '',
          clientSecret: c.clientSecret || process.env.ZOHO_CLIENT_SECRET || '',
          refreshToken: c.refreshToken || process.env.ZOHO_REFRESH_TOKEN || '',
          workspaceId:  c.workspaceId  || process.env.ZOHO_WORKSPACE_ID  || '',
        };
      } catch(e) {
        return {
          clientId:     process.env.ZOHO_CLIENT_ID     || '',
          clientSecret: process.env.ZOHO_CLIENT_SECRET || '',
          refreshToken: process.env.ZOHO_REFRESH_TOKEN || '',
          workspaceId:  process.env.ZOHO_WORKSPACE_ID  || '',
        };
      }
    }
    const { clientId: CLIENT_ID, clientSecret: CLIENT_SECRET, refreshToken: REFRESH_TOKEN, workspaceId: WORKSPACE_ID } = loadZohoCreds();
    const TOKEN_CACHE   = '/tmp/zoho_token.json';
    const CACHE_FILE    = '/tmp/zoho_cache.json';
    // Persistent Slack state: sprint→channelId, day→threadTs. Lives on PVC so survives restarts.
    const SLACK_STATE_FILE = '/home/node/.openclaw/workspace/slack-state.json';

    // ── Slack state helpers ───────────────────────────────────────────────────
    // Safe channel display: always includes # prefix, never doubles it
    const chDisplay = c => (c&&c.name?(c.name.startsWith('#')?c.name:'#'+c.name):'-');
    function loadSlackState() { try { return JSON.parse(fs.readFileSync(SLACK_STATE_FILE,'utf8')); } catch(e) { return {channels:{},threads:{}}; } }
    function saveSlackState(s) { try { fs.writeFileSync(SLACK_STATE_FILE, JSON.stringify(s,null,2)); } catch(e) {} }

    // Channel naming: one stable channel per PROJECT — #{project}-standup
    // e.g. TIR → #tir-standup, "My Project" → #my-project-standup
    function slackChannelName(projName) {
      const clean = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
      return (clean(projName)+'-standup').substring(0,79);
    }

    // Raw Slack API call (POST JSON)
    function slackCall(tok, endpoint, body) {
      return new Promise((res,rej) => {
        const data = JSON.stringify(body);
        const req = https.request({ hostname:'slack.com', path:'/api/'+endpoint, method:'POST',
          headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json; charset=utf-8','Content-Length':Buffer.byteLength(data)} },
          r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>{ try{res(JSON.parse(d))}catch(e){res({ok:false,error:d})} }); });
        req.on('error',rej); req.write(data); req.end();
      });
    }

    // Get or create the project's standup channel. Returns {id, name, existed, manual} or null.
    // Priority: (1) auto-create #proj-standup → (2) user-saved channel → (3) SLACK_STANDUP_CHANNEL env
    async function getOrCreateProjectChannel(projName) {
      const tok = process.env.SLACK_BOT_TOKEN; if (!tok) return null;
      const autoName = slackChannelName(projName);
      const state = loadSlackState();
      const cacheKey   = 'ch:'+projName.toLowerCase();
      const manualKey  = 'manual:'+projName.toLowerCase();

      // 1. Return cached auto-created channel
      if (state.channels[cacheKey]) return { id: state.channels[cacheKey], name: autoName, existed: true, manual: false };

      // 2. Return user-saved manual channel (set via "slack set-channel --project X --channel #Y")
      if (state.channels[manualKey]) return { id: state.channels[manualKey], name: state.channels[manualKey], existed: true, manual: true };

      // 3. Search existing Slack channels for the auto-name (handles re-deploys after manual channel creation)
      const list = await slackCall(tok, 'conversations.list', { exclude_archived: true, types: 'public_channel', limit: 200 });
      const existing = (list.channels||[]).find(c=>c.name===autoName);
      if (existing) {
        state.channels[cacheKey] = existing.id; saveSlackState(state);
        return { id: existing.id, name: autoName, existed: true, manual: false };
      }

      // 4. Try to create the channel (requires channels:write scope)
      const r = await slackCall(tok, 'conversations.create', { name: autoName, is_private: false });
      if (r.ok && r.channel) {
        state.channels[cacheKey] = r.channel.id; saveSlackState(state);
        return { id: r.channel.id, name: autoName, existed: false, manual: false };
      }

      // 5. Creation failed (missing channels:write scope) — fall back to SLACK_STANDUP_CHANNEL env
      const fallback = process.env.SLACK_STANDUP_CHANNEL;
      if (fallback) return { id: fallback, name: fallback, existed: true, manual: true, fallback: true };

      // 6. No channel available — caller must ask the user
      return null;
    }

    // Save a user-chosen channel for a project. Called when user tells agent "use #general for TIR".
    function saveManualChannel(projName, channelNameOrId) {
      const state = loadSlackState();
      state.channels['manual:'+projName.toLowerCase()] = channelNameOrId;
      saveSlackState(state);
    }

    // Get or create today's parent thread in the project channel.
    // Morning posts as the parent; EOD (and any extra) reply to that parent.
    async function getOrCreateDayThread(channelId, projName, sprintName, dateStr) {
      const tok = process.env.SLACK_BOT_TOKEN; if (!tok) return null;
      const state = loadSlackState();
      const key = 'th:'+projName.toLowerCase()+'/'+dateStr;
      if (state.threads[key]) return state.threads[key];
      // Post the day-header as the parent message (sprint name shown here, not in channel name)
      const headerText = '*📅 '+projName+(sprintName?' · '+sprintName:'')+' · '+dateStr+'*';
      const body = JSON.stringify({ channel: channelId, text: headerText, mrkdwn: true });
      const ts = await new Promise((res) => {
        const req = https.request({ hostname:'slack.com', path:'/api/chat.postMessage', method:'POST',
          headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json; charset=utf-8','Content-Length':Buffer.byteLength(body)} },
          r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>{ try{ const j=JSON.parse(d); res(j.ok?j.ts:null); }catch(e){res(null);} }); });
        req.on('error',()=>res(null)); req.write(body); req.end();
      });
      if (ts) { state.threads[key]=ts; saveSlackState(state); }
      return ts;
    }

    // Post a message to a Slack channel, as a thread reply when threadTs is provided.
    async function postToSlack(channelId, text, threadTs) {
      const tok = process.env.SLACK_BOT_TOKEN; if (!tok) return false;
      const body = JSON.stringify({ channel: channelId, text, mrkdwn: true, ...(threadTs?{thread_ts:threadTs}:{}) });
      return new Promise((res) => {
        const req = https.request({ hostname:'slack.com', path:'/api/chat.postMessage', method:'POST',
          headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json; charset=utf-8','Content-Length':Buffer.byteLength(body)} },
          r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>{ try{ const j=JSON.parse(d); res(j.ok); }catch(e){res(false);} }); });
        req.on('error',()=>res(false)); req.write(body); req.end();
      });
    }

    // ── Telegram (proactive push) ──────────────────────────────────────────────
    // Slack mrkdwn uses *bold*; Telegram needs HTML. Convert *x* → <b>x</b> and
    // escape &<> in the rest so item titles with special chars never break parsing.
    function toTelegramHTML(text) {
      const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      // Split on *bold* spans, escape the non-bold parts, wrap the bold parts in <b>.
      return text.split(/(\*[^*]+\*)/).map(part => {
        const m = part.match(/^\*([^*]+)\*$/);
        return m ? '<b>'+esc(m[1])+'</b>' : esc(part);
      }).join('');
    }
    async function postToTelegram(text) {
      const tok = process.env.TELEGRAM_BOT_TOKEN;
      // Send target: explicit chat id, else the first allowed user id (private chat_id == user id)
      const chat = process.env.TELEGRAM_CHAT_ID || (process.env.TELEGRAM_ALLOWED_USER_IDS||'').split(',').map(s=>s.trim()).filter(Boolean)[0];
      if (!tok || !chat) return false;
      const body = JSON.stringify({ chat_id: chat, text: toTelegramHTML(text), parse_mode: 'HTML', disable_web_page_preview: true });
      return new Promise((res) => {
        const r = https.request({ hostname:'api.telegram.org', path:'/bot'+tok+'/sendMessage', method:'POST',
          headers:{'Content-Type':'application/json','Content-Length':Buffer.byteLength(body)} },
          resp => { let d=''; resp.on('data',c=>d+=c); resp.on('end',()=>{ try{ res(JSON.parse(d).ok); }catch(e){res(false);} }); });
        r.on('error',()=>res(false)); r.write(body); r.end();
      });
    }

    // ── Unified notification ────────────────────────────────────────────────────
    // Routes a message to EVERY configured channel: Slack (per-project channel,
    // day-threaded) AND/OR Telegram. If both are configured, sends to both.
    // Returns an array of "channel:status" strings for logging.
    async function notify(projName, sprintName, text) {
      const out = [];
      // Slack — per-project channel + day-thread
      if (process.env.SLACK_BOT_TOKEN) {
        const ch = await getOrCreateProjectChannel(projName);
        if (ch) {
          const threadTs = await getOrCreateDayThread(ch.id, projName, sprintName||'', todayIST());
          const ok = await postToSlack(ch.id, text, threadTs);
          out.push('slack '+chDisplay(ch)+':'+(ok?'ok':'fail'));
        } else if (process.env.SLACK_STANDUP_CHANNEL) {
          const threadTs = await getOrCreateDayThread(process.env.SLACK_STANDUP_CHANNEL, projName, sprintName||'', todayIST());
          const ok = await postToSlack(process.env.SLACK_STANDUP_CHANNEL, text, threadTs);
          out.push('slack '+process.env.SLACK_STANDUP_CHANNEL+':'+(ok?'ok':'fail'));
        } else {
          out.push('slack:no-channel (add channels:write scope or set a channel via "slack set-channel")');
        }
      }
      // Telegram — send target is TELEGRAM_CHAT_ID or the first allowed user id
      const tgChat = process.env.TELEGRAM_CHAT_ID || (process.env.TELEGRAM_ALLOWED_USER_IDS||'').split(',').map(s=>s.trim()).filter(Boolean)[0];
      if (process.env.TELEGRAM_BOT_TOKEN && tgChat) {
        const ok = await postToTelegram(text);
        out.push('telegram:'+(ok?'ok':'fail'));
      }
      if (!out.length) out.push('no messaging channel configured (set Slack bot token and/or Telegram bot token + chat id)');
      return out;
    }

    // ── Event journal (append-only JSONL on PVC) ────────────────────────────────
    const JOURNAL_FILE = '/home/node/.openclaw/workspace/pm-journal.jsonl';
    function appendJournal(entry) {
      try {
        const line = JSON.stringify({ ts: new Date(Date.now()+5.5*3600*1000).toISOString().replace('Z','+05:30'), ...entry }) + '\n';
        fs.appendFileSync(JOURNAL_FILE, line);
      } catch(e) { /* journal is best-effort, never block the operation */ }
    }
    function readJournalSince(sinceISODate) {
      // Returns journal entries with ts >= sinceISODate (string compare on ISO works)
      try {
        return fs.readFileSync(JOURNAL_FILE,'utf8').trim().split('\n')
          .filter(Boolean).map(l=>{ try{return JSON.parse(l)}catch(e){return null} }).filter(Boolean)
          .filter(e => (e.ts||'') >= sinceISODate);
      } catch(e) { return []; }
    }

    // ── Daily snapshot store ─────────────────────────────────────────────────────
    const SNAPSHOT_DIR = '/home/node/.openclaw/workspace/pm-snapshots';
    function saveSnapshot(dateStr, data) {
      try { fs.mkdirSync(SNAPSHOT_DIR,{recursive:true}); fs.writeFileSync(SNAPSHOT_DIR+'/'+dateStr+'.json', JSON.stringify(data)); } catch(e) {}
    }
    function loadSnapshot(dateStr) {
      try { return JSON.parse(fs.readFileSync(SNAPSHOT_DIR+'/'+dateStr+'.json','utf8')); } catch(e) { return null; }
    }

    // ── Email (weekly report to stakeholders) ───────────────────────────────────
    // Uses nodemailer installed to the PVC at init (same pattern as B2B SDR).
    // Gmail App Password required (smtp.gmail.com:587). Recipients comma-separated.
    async function sendReportEmail(subject, body) {
      const user = process.env.GMAIL_USER, pass = process.env.GMAIL_APP_PASSWORD;
      const to = (process.env.STAKEHOLDER_EMAILS||'').split(',').map(s=>s.trim()).filter(Boolean);
      if (!user || !pass) return { ok:false, reason:'GMAIL_USER/GMAIL_APP_PASSWORD not set' };
      if (!to.length)     return { ok:false, reason:'STAKEHOLDER_EMAILS not set' };
      let nodemailer;
      try { nodemailer = require('/home/node/.openclaw/npm-report/node_modules/nodemailer'); }
      catch(e) { return { ok:false, reason:'nodemailer not installed (redeploy with Gmail creds to install it)' }; }
      try {
        const t = nodemailer.createTransport({ host:'smtp.gmail.com', port:587, secure:false, auth:{ user, pass } });
        const info = await t.sendMail({ from:user, to: to.join(','), subject, text: body });
        return { ok:true, to, messageId: info.messageId };
      } catch(e) { return { ok:false, reason:e.message }; }
    }

    // ── Auth ──────────────────────────────────────────────────────────────────
    let _tokenRefreshInFlight = null; // concurrency guard — prevents parallel refresh storms
    async function getAccessToken() {
      if (fs.existsSync(TOKEN_CACHE)) {
        try { const c = JSON.parse(fs.readFileSync(TOKEN_CACHE,'utf8')); if (c.expiry && Date.now() < c.expiry - 120000) return c.access_token; } catch(e) {}
      }
      if (_tokenRefreshInFlight) return _tokenRefreshInFlight; // queue behind in-flight refresh
      if (!CLIENT_ID||!CLIENT_SECRET||!REFRESH_TOKEN) throw new Error('ZOHO_CLIENT_ID, ZOHO_CLIENT_SECRET, ZOHO_REFRESH_TOKEN must be set.');
      _tokenRefreshInFlight = (async () => {
        const body = `client_id=${encodeURIComponent(CLIENT_ID)}&client_secret=${encodeURIComponent(CLIENT_SECRET)}&refresh_token=${encodeURIComponent(REFRESH_TOKEN)}&grant_type=refresh_token`;
        const r = await httpReq('POST','accounts.zoho.in','/oauth/v2/token',body,'application/x-www-form-urlencoded');
        if (r.error) throw new Error('Zoho OAuth token refresh failed: '+r.error+'. Check ZOHO_CLIENT_ID, ZOHO_CLIENT_SECRET, ZOHO_REFRESH_TOKEN are correct and the token has not been revoked.');
        fs.writeFileSync(TOKEN_CACHE, JSON.stringify({access_token:r.access_token, expiry:Date.now()+(r.expires_in||3600)*1000}));
        return r.access_token;
      })();
      try { return await _tokenRefreshInFlight; } finally { _tokenRefreshInFlight = null; }
    }

    // ── Zoho error check — call after every api/apiForm response ─────────────
    function checkZohoResponse(r, context) {
      if (!r || typeof r !== 'object') return;
      const code = r.code || r.errorCode;
      const msg  = r.message || r.error || '';
      if (r.status === 'failed' || (code && code !== 200 && code !== 201)) {
        const low = (msg||'').toLowerCase();
        // 1. Validation / mandatory-field errors — these are the USER's to fix, not retryable.
        //    Detect by message content (Zoho's wording varies) regardless of code.
        const isMissingField =
          low.includes('mandatory') || low.includes('parameter missing') ||
          low.includes('enter valid') || low.includes('choose the') ||
          low.includes('required') || low.includes('cannot be empty') ||
          low.includes('should not be empty');
        if (isMissingField) {
          // Translate the most common cases into a precise instruction.
          let hint = msg;
          if (low.includes('start') && low.includes('end') && low.includes('date'))
            hint = 'This Zoho workspace requires BOTH a start date and an end date. Re-run the command with --start YYYY-MM-DD and --end YYYY-MM-DD (e.g. starting 2026-06-15 ending 2026-06-28).';
          else if (low.includes('date'))
            hint = 'A valid date is required. Provide it in YYYY-MM-DD form.';
          else if (low.includes('release stage') || low.includes('choose the'))
            hint = 'A release stage must be selected. This workspace has no default stage configured.';
          throw new Error('USER ACTION REQUIRED — do NOT retry. '+hint+' (Zoho said: "'+msg+'")');
        }
        // 2. Hard, non-retryable infrastructure/auth errors.
        const FATAL = {
          7421: 'Zoho API rate limit exceeded — wait a few minutes before retrying. Do NOT retry now.',
          7700: 'Zoho authentication failed — the OAuth token may be revoked. Tell the user to regenerate ZOHO_REFRESH_TOKEN. Do NOT retry.',
          7401: 'Zoho access denied — your token lacks the required scope for this operation. Tell the user. Do NOT retry.',
          7404: 'Zoho API URL is wrong — this is a bug in the skill, not something to retry. Report the exact command to the user.',
        };
        if (FATAL[code]) throw new Error(FATAL[code]);
        // 3. Anything else — surface verbatim, no auto-retry.
        throw new Error('Zoho API error'+(context?' ('+context+')':'')+': code='+code+' — '+msg+'. Do NOT retry automatically; report this to the user.');
      }
    }

    function httpReq(method, host, path, body, ctype) {
      return new Promise((resolve,reject) => {
        const data = body ? (typeof body==='string'?body:JSON.stringify(body)) : null;
        const req = https.request({hostname:host,path,method,headers:{'Content-Type':ctype||'application/json',...(data?{'Content-Length':Buffer.byteLength(data)}:{})}}, res => {
          let d=''; res.on('data',c=>d+=c); res.on('end',()=>{ try{resolve(JSON.parse(d))}catch(e){resolve({raw:d})} });
        });
        req.on('error',reject); if(data)req.write(data); req.end();
      });
    }

    async function api(method, path, body) {
      const token = await getAccessToken();
      const data = body ? JSON.stringify(body) : null;
      const r = await new Promise((resolve,reject) => {
        const opts = {hostname:'sprintsapi.zoho.in',path:'/zsapi'+path,method,headers:{'Authorization':'Zoho-oauthtoken '+token,'x-convert-response':'true','Content-Type':'application/json',...(data?{'Content-Length':Buffer.byteLength(data)}:{})}};
        const req = https.request(opts, res => { let d=''; res.on('data',c=>d+=c); res.on('end',()=>{ try{resolve(JSON.parse(d))}catch(e){resolve({raw:d})} }); });
        req.on('error',reject); if(data)req.write(data); req.end();
      });
      checkZohoResponse(r, method+' '+path);
      return r;
    }

    async function apiForm(method, path, params) {
      const token = await getAccessToken();
      const data = Object.entries(params).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
      const r = await new Promise((resolve,reject) => {
        const opts = {hostname:'sprintsapi.zoho.in',path:'/zsapi'+path,method,headers:{'Authorization':'Zoho-oauthtoken '+token,'x-convert-response':'true','Content-Type':'application/x-www-form-urlencoded','Content-Length':Buffer.byteLength(data)}};
        const req = https.request(opts, res => { let d=''; res.on('data',c=>d+=c); res.on('end',()=>{ try{resolve(JSON.parse(d))}catch(e){resolve({raw:d})} }); });
        req.on('error',reject); req.write(data); req.end();
      });
      checkZohoResponse(r, method+' '+path);
      return r;
    }

    // ── Name-to-ID resolution helpers ────────────────────────────────────────
    function loadCache() { try { return JSON.parse(fs.readFileSync(CACHE_FILE,'utf8')); } catch(e) { return {}; } }
    function saveCache(c) { fs.writeFileSync(CACHE_FILE, JSON.stringify(c)); }

    async function getTeamId() {
      const cache = loadCache();
      if (cache.teamId) return cache.teamId;
      const r = await api('GET','/teams/');
      const portal = (r.portals||[]).find(p=>p.teamName===WORKSPACE_ID||p.zsoid===WORKSPACE_ID);
      if (!portal) err("Workspace '"+WORKSPACE_ID+"' not found. Check ZOHO_WORKSPACE_ID.");
      const tid = portal.zsoid||r.myTeamId;
      cache.teamId = tid; saveCache(cache);
      return tid;
    }

    async function resolveProject(tid, nameOrId) {
      if (!nameOrId) err('--project <name or ID> required');
      const r = await api('GET','/team/'+tid+'/projects/?action=data&index=1&range=100');
      let projects = (r.projects||[]).map(p=>({...p, projId: p.projId||p.projectId}));
      const match = list => list.find(x=>x.projId===nameOrId)
        || list.find(x=>x.projName.toLowerCase()===nameOrId.toLowerCase())
        || list.find(x=>x.projName.toLowerCase().includes(nameOrId.toLowerCase()));
      let p = match(projects);
      // Default list returns only active projects — also search archived/template for unarchive/delete
      if (!p) {
        try {
          const ar = await api('GET','/team/'+tid+'/projects/?action=data&index=1&range=100&projectstatus=2');
          const arch = (ar.projects||[]).map(x=>({...x, projId: x.projId||x.projectId}));
          p = match(arch);
        } catch(e) {}
      }
      if (!p) err("Project '"+nameOrId+"' not found. Use 'projects list' to see available projects.");
      return p;
    }

    async function resolveSprint(tid, projId, nameOrId) {
      if (!nameOrId) err('--sprint <name or ID> required');
      const r = await api('GET','/team/'+tid+'/projects/'+projId+'/sprints/?action=data&index=1&range=100');
      const SPTYPE = {1:'Upcoming',2:'Active',3:'Completed',4:'Cancelled'};
      const sprints = r.sprints||[];
      let s = sprints.find(x=>x.sprintId===nameOrId);
      if (s) return s;
      let exact = sprints.filter(x=>x.sprintName.toLowerCase()===nameOrId.toLowerCase());
      if (exact.length===1) return exact[0];
      if (exact.length>1) {
        console.log('Multiple sprints match "'+nameOrId+'":');
        exact.forEach((x,i)=>console.log((i+1)+'. '+x.sprintName+' ['+(SPTYPE[x.sprintType]||'?')+']'));
        err('Please be more specific.');
      }
      let partial = sprints.filter(x=>x.sprintName.toLowerCase().includes(nameOrId.toLowerCase()));
      if (partial.length===1) return partial[0];
      if (partial.length>1) {
        console.log('Multiple sprints match "'+nameOrId+'":');
        partial.forEach((x,i)=>console.log((i+1)+'. '+x.sprintName+' ['+(SPTYPE[x.sprintType]||'?')+']'));
        err('Please use the full sprint name.');
      }
      err("Sprint '"+nameOrId+"' not found. Use 'sprints list --project <name>' to see sprints.");
    }

    async function resolveItem(tid, projId, sprintId, nameOrId) {
      if (!nameOrId) err('--item <name or ID> required');
      const r = await api('GET','/team/'+tid+'/projects/'+projId+'/sprints/'+sprintId+'/item/?action=data&index=1&range=100');
      // Normalize: itemName is the real field; expose .title alias for callers
      const items = (r.items||[]).map(x=>({...x, title: x.itemName||x.title}));
      let byId = items.find(x=>x.itemId===nameOrId||String(x.itemId)===String(nameOrId));
      if (byId) return byId;
      let exact = items.filter(x=>(x.title||'').toLowerCase()===nameOrId.toLowerCase());
      if (exact.length===1) return exact[0];
      if (exact.length>1) {
        console.log('Multiple items match "'+nameOrId+'":');
        exact.forEach((x,i)=>console.log((i+1)+'. ['+x.itemId+'] '+x.title));
        err('Please use the item ID to be specific.');
      }
      let partial = items.filter(x=>(x.title||'').toLowerCase().includes(nameOrId.toLowerCase()));
      if (partial.length===1) return partial[0];
      if (partial.length>1) {
        console.log('Multiple items match "'+nameOrId+'":');
        partial.forEach((x,i)=>console.log((i+1)+'. ['+x.itemId+'] '+x.title));
        err('Please use the full title or item ID.');
      }
      err("Item '"+nameOrId+"' not found.");
    }

    async function resolveSubitem(tid, projId, sprintId, parentItemId, nameOrId) {
      if (!nameOrId) err('--subtask <name or ID> required');
      const r = await api('GET','/team/'+tid+'/projects/'+projId+'/sprints/'+sprintId+'/item/?action=data&index=1&range=200&subitem=true');
      const subs = (r.items||[]).filter(x=>String(x.immediateParentId)===String(parentItemId)).map(x=>({...x, title: x.itemName||x.title}));
      let s = subs.find(x=>x.itemId===nameOrId||String(x.itemId)===String(nameOrId));
      if (s) return s;
      let exact = subs.filter(x=>(x.title||'').toLowerCase()===nameOrId.toLowerCase());
      if (exact.length===1) return exact[0];
      let partial = subs.filter(x=>(x.title||'').toLowerCase().includes(nameOrId.toLowerCase()));
      if (partial.length===1) return partial[0];
      if (partial.length>1) { console.log('Multiple subtasks match:'); partial.forEach(x=>console.log('  ['+x.itemId+'] '+x.title)); err('Be more specific (use the subtask ID).'); }
      err("Subtask '"+nameOrId+"' not found under this item.");
    }

    async function resolveMember(tid, nameOrEmail) {
      const r = await api('GET','/team/'+tid+'/users/?action=data&index=1&range=50');
      // Workspace users: fields are userId, displayName, emailId. Normalize to name/email.
      const users = (r.users||[]).map(x=>({...x, name: x.displayName||x.fullName||x.name||'', email: x.emailId||x.email||''}));
      // Exact match first (email or ID)
      let exact = users.find(x=>x.email===nameOrEmail||x.userId===nameOrEmail);
      if (exact) return exact;
      // Exact name match
      let byName = users.filter(x=>x.name.toLowerCase()===nameOrEmail.toLowerCase());
      if (byName.length===1) return byName[0];
      if (byName.length>1) {
        console.log('Multiple users found with name "'+nameOrEmail+'":');
        byName.forEach((u,i)=>console.log((i+1)+'. '+u.name+' ('+u.email+')'));
        console.log('Please use the email address to be specific.');
        return null;
      }
      // Partial name match
      let partial = users.filter(x=>x.name.toLowerCase().includes(nameOrEmail.toLowerCase()));
      if (partial.length===1) return partial[0];
      if (partial.length>1) {
        console.log('Multiple users match "'+nameOrEmail+'":');
        partial.forEach((u,i)=>console.log((i+1)+'. '+u.name+' ('+u.email+')'));
        console.log('Please use the full name or email address.');
        return null;
      }
      return null;
    }

    // ── Lookup-map helper: maps statusId/priorityId/userId → name (cached per run) ──
    let _maps = null;
    async function getMaps(tid, projId) {
      if (_maps) return _maps;
      const [stR, prR, usR] = await Promise.all([
        api('GET','/team/'+tid+'/projects/'+projId+'/itemstatus/?action=data&index=1&range=50'),
        api('GET','/team/'+tid+'/projects/'+projId+'/priority/?action=data&index=1&range=50'),
        api('GET','/team/'+tid+'/projects/'+projId+'/users/?action=data&index=1&range=100&type=1'),
      ]);
      const status = {}, priority = {}, user = {};
      (stR.statuses||[]).forEach(s=>status[s.statusId]=s.statusName);
      (prR.projPriorities||[]).forEach(p=>priority[p.projPriorityId]=p.priorityName);
      (usR.users||[]).forEach(u=>user[u.userId]=u.displayName||u.emailId);
      _maps = {status, priority, user};
      return _maps;
    }
    // Resolve a Zoho module ID by name (item/sprint/epic/...) — needed for comments/notes.
    let _moduleIds = null;
    async function getModuleId(tid, moduleName) {
      if (!_moduleIds) {
        const m = await api('GET','/team/'+tid+'/settings/customization/modules/?action=data&index=1&range=50');
        _moduleIds = {};
        (m.custommodules||[]).forEach(x=>{ if(x.moduleName) _moduleIds[x.moduleName]=x.moduleId; });
      }
      return _moduleIds[moduleName];
    }
    // Enrich a raw item with readable status/priority/assignee names
    function enrichItem(it, maps) {
      const ownerId = Array.isArray(it.ownerId)?it.ownerId[0]:it.ownerId;
      const assigneeName = maps.user[ownerId]||'Unassigned';
      return {
        ...it,
        title: it.itemName||it.title,
        statusName: maps.status[it.statusId]||'',
        priority: maps.priority[it.projPriorityId]||'',
        assigneeName: assigneeName==='Unassigned'?'-':assigneeName,
      };
    }

    // ── Canonical per-project state ──────────────────────────────────────────────
    // Pick the single "current" sprint deterministically by DATE, not array order.
    // sprintType: 1=Upcoming, 2=Active, 3=Completed, 4=Cancelled. The Zoho API returns
    // sprints newest-first, so slice(-1) picks the OLDEST — wrong. We instead prefer:
    //   1. an Active (type 2) sprint
    //   2. a live sprint whose [start,end] date range contains today
    //   3. the soonest-starting not-yet-ended upcoming sprint
    //   4. the most recently-started non-done/cancelled sprint (last resort)
    function pickSprint(sprints) {
      const sDate = v => { if(!v||v==='-1') return null;
        if(/^\d{4}-\d{2}-\d{2}/.test(v) && !v.includes('Z')) return v.slice(0,10);
        return new Date(new Date(v).getTime()+5.5*3600000).toISOString().slice(0,10); };
      const live = (sprints||[]).filter(s=>s.sprintType!==3 && s.sprintType!==4);
      const today = todayIST();
      const active = live.find(s=>s.sprintType===2);
      if (active) return active;
      // Current by date range (start ≤ today ≤ end)
      const current = live.filter(s=>{ const st=sDate(s.startDate), en=sDate(s.endDate);
        return st && st<=today && (!en || today<=en); })
        .sort((a,b)=>(sDate(b.startDate)||'').localeCompare(sDate(a.startDate)||''))[0];
      if (current) return current;
      // Soonest-starting upcoming that hasn't ended yet
      const upcoming = live.filter(s=>{ const en=sDate(s.endDate); return !en || en>=today; })
        .sort((a,b)=>(sDate(a.startDate)||'9999').localeCompare(sDate(b.startDate)||'9999'))[0];
      if (upcoming) return upcoming;
      // Last resort: most recently started
      return live.sort((a,b)=>(sDate(b.startDate)||'').localeCompare(sDate(a.startDate)||''))[0] || null;
    }

    // The single source of truth used by snapshot, morning-brief, alert-check and
    // weekly-report so they all categorise items identically. Returns null if the
    // project has no active sprint.
    async function buildProjectState(tid, proj) {
      // Resolve the active sprint WITHOUT the err()/process.exit path (so a project
      // with no active sprint is skipped gracefully, not fatal to the whole cron run).
      const sprR = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/?action=data&index=1&range=100');
      const sprint = pickSprint(sprR.sprints||[]);
      if (!sprint) return null;
      const maps = await getMaps(tid, proj.projId);
      const stR  = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/itemstatus/?action=data&index=1&range=50');
      const stMeta = {}; (stR.statuses||[]).forEach(s=>stMeta[s.statusId]={type:s.statusType,isStart:s.isStart,isEnd:s.isEnd});
      const r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/?action=data&index=1&range=200');
      const cat = i => { const m=stMeta[i.statusId]||{}; if(m.isEnd||m.type===1) return 'done'; if(m.isStart||m.type===0) return 'todo'; return 'prog'; };
      const today = todayIST();
      const items = (r.items||[]).map(it=>{
        const e = enrichItem(it, maps);
        e.cat = cat(it);
        e.dueDate = (it.endDate && it.endDate!=='-1') ? it.endDate.split('T')[0] : '';
        e.completedDate = (it.completedDate && it.completedDate!=='-1') ? it.completedDate.split('T')[0] : '';
        e.overdue = e.cat!=='done' && e.dueDate && e.dueDate < today;
        e.isHigh = /high|critical|urgent/i.test(e.priority||'');
        e.unassigned = !e.assigneeName || e.assigneeName==='-';
        return { itemId:e.itemId, title:e.title, cat:e.cat, statusName:e.statusName, priority:e.priority,
                 assigneeName:e.assigneeName, ownerId:e.ownerId, dueDate:e.dueDate, completedDate:e.completedDate,
                 overdue:e.overdue, isHigh:e.isHigh, unassigned:e.unassigned, epicId:e.epicId };
      });
      // Sprint progress: % of items done; days remaining until sprint end
      const done = items.filter(i=>i.cat==='done').length;
      const pct  = items.length ? Math.round(done/items.length*100) : 0;
      let daysLeft = null;
      if (sprint.endDate && sprint.endDate!=='-1') {
        const end = new Date(sprint.endDate); const now = new Date();
        daysLeft = Math.ceil((end - now)/86400000);
      }
      return {
        projId: proj.projId, projName: proj.projName,
        sprintId: sprint.sprintId, sprintName: sprint.sprintName, sprintType: sprint.sprintType,
        sprintEnd: (sprint.endDate&&sprint.endDate!=='-1')?sprint.endDate.split('T')[0]:'', daysLeft, pct,
        items,
        counts: {
          total: items.length, done, prog: items.filter(i=>i.cat==='prog').length,
          todo: items.filter(i=>i.cat==='todo').length, overdue: items.filter(i=>i.overdue).length,
          unassigned: items.filter(i=>i.unassigned).length, high: items.filter(i=>i.isHigh).length,
        },
      };
    }

    // ── CLI helpers ────────────────────────────────────────────────────────────
    const args = process.argv.slice(2);
    const cmd  = args[0];
    const sub  = args[1];
    function flag(f) { const i=args.indexOf(f); if(i<0)return null; const p=[]; for(let j=i+1;j<args.length;j++){if(args[j].startsWith('--'))break;p.push(args[j]);} return p.length?p.join(' '):null; }
    function err(msg) { console.error('[zoho-sprints] '+msg); process.exit(1); }
    function ok(msg) { console.log(msg); }


    // ── Active sprint resolver ────────────────────────────────────────────────
    async function resolveActiveSprint(tid, projId, nameOrId, soft) {
      if (nameOrId) return resolveSprint(tid, projId, nameOrId);
      // Auto-detect the current sprint by DATE (shared with buildProjectState).
      // Retry once after 3s to handle Zoho eventual consistency (empty list right after create/start).
      let r = await api('GET','/team/'+tid+'/projects/'+projId+'/sprints/?action=data&index=1&range=100');
      if (!(r.sprints||[]).length) {
        await new Promise(res=>setTimeout(res,3000));
        r = await api('GET','/team/'+tid+'/projects/'+projId+'/sprints/?action=data&index=1&range=100');
      }
      const sprint = pickSprint(r.sprints||[]);
      if (sprint) { if(!soft) ok('[Using sprint: "'+sprint.sprintName+'"]'); return sprint; }
      // soft mode: return null instead of exiting (used by autonomous multi-project loops)
      if (soft) return null;
      err('No active sprint found. Use --sprint <name> to specify one.');
    }

    // ── Date utilities (IST = UTC+5:30) ───────────────────────────────────────
    function nowIST() { return new Date(Date.now() + 5.5*3600*1000); }
    function todayIST() { const d=nowIST(); return d.toISOString().split('T')[0]; }
    function daysFromNow(n) { const d=new Date(Date.now()+n*86400000+5.5*3600000); return d.toISOString().split('T')[0]; }
    // Normalize any date to Zoho's required format: yyyy-MM-ddT00:00:00+05:30.
    // Accepts plain 'YYYY-MM-DD' (user input) OR Zoho's stored '...T..:..:..Z' (with millis).
    function zohoDate(d) {
      if (!d) return null;
      if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d+'T00:00:00+05:30';
      if (d.includes('+')) return d.replace(/\.\d{3}/,''); // already has offset
      // ISO UTC (e.g. 2026-06-30T18:30:00.000Z) → shift to IST date
      const ist = new Date(new Date(d).getTime()+5.5*3600*1000);
      return ist.toISOString().split('T')[0]+'T00:00:00+05:30';
    }
    function startOfWeekIST() {
      const d = nowIST();
      const day = d.getUTCDay(); // 0=Sun
      const diff = day===0 ? -6 : 1-day; // Monday
      return new Date(d.getTime()+diff*86400000).toISOString().split('T')[0];
    }
    function isOverdue(item) {
      if (!item.dueDate) return false;
      return item.dueDate < todayIST() && (item.statusType||'').toLowerCase()!=='close';
    }
    function isDueThisWeek(item) {
      if (!item.dueDate) return false;
      return item.dueDate >= todayIST() && item.dueDate <= daysFromNow(7);
    }
    function isCompletedThisWeek(item) {
      if ((item.statusType||'').toLowerCase()!=='close') return false;
      const closed = item.closedTime||item.updatedTime||'';
      return closed >= startOfWeekIST();
    }

    // ── Fuzzy status matcher ──────────────────────────────────────────────────
    function fuzzyMatchStatus(items, query) {
      const q = query.toLowerCase();
      const priorityWords = { urgent:['urgent','critical','blocker'], high:['high','important'], medium:['medium','normal'], low:['low','minor'] };
      const statusWords = { blocked:['blocked','stuck','blocked','impediment'], done:['done','closed','complete','finished'], inprogress:['progress','working','active','ongoing'] };
      
      for (const [prio, words] of Object.entries(priorityWords)) {
        if (words.some(w=>q.includes(w))) return items.filter(i=>(i.priority||'').toLowerCase()===prio);
      }
      for (const [type, words] of Object.entries(statusWords)) {
        if (words.some(w=>q.includes(w))) {
          if (type==='done') return items.filter(i=>(i.statusType||'').toLowerCase()==='close');
          if (type==='inprogress') return items.filter(i=>(i.statusType||'').toLowerCase()==='inprogress');
          return items.filter(i=>(i.statusName||'').toLowerCase().includes(q)||(i.priority||'').toLowerCase().includes(q));
        }
      }
      // Fall back to status name match
      return items.filter(i=>(i.statusName||'').toLowerCase().includes(q)||(i.priority||'').toLowerCase().includes(q));
    }


    // ── Main ───────────────────────────────────────────────────────────────────
    async function main() {
      if (!WORKSPACE_ID) err('ZOHO_WORKSPACE_ID not set.');
      const tid = await getTeamId();

      switch (cmd) {

        // ── Workspaces ─────────────────────────────────────────────────────────
        case 'workspaces': {
          const r = await api('GET','/teams/');
          (r.portals||[]).forEach(p=>ok('ID:'+p.zsoid+' | '+p.teamName));
          break;
        }

        // ── Projects ───────────────────────────────────────────────────────────
        case 'projects': {
          if (!sub||sub==='list') {
            const r = await api('GET','/team/'+tid+'/projects/?action=data&index=1&range=100');
            const projs = r.projects||[];
            const PSTATUS={1:'Active',2:'Archived',6:'Template'};
            projs.forEach(p=>ok('ID:'+(p.projId||p.projectId)+' | '+p.projName+' | '+(PSTATUS[p.status]||p.status)+(p.groupName?' | Group:'+p.groupName:'')));
            // Cross-project overdue summary if --overdue flag
            if (args.includes('--overdue')) {
              ok('');
              ok('=== Overdue across all projects ===');
              for (const proj2 of projs) {
                const sr = await api('GET','/team/'+tid+'/projects/'+proj2.projId+'/sprints/?action=data&index=1&range=100');
                const activeSprint = (sr.sprints||[]).find(s=>s.sprintType===2);
                if (!activeSprint) continue;
                const ir = await api('GET','/team/'+tid+'/projects/'+proj2.projId+'/sprints/'+activeSprint.sprintId+'/item/?action=data&index=1&range=100');
                const overdue = (ir.items||[]).map(x=>({...x,title:x.itemName||x.title,dueDate:x.endDate})).filter(isOverdue);
                if (overdue.length) {
                  ok(proj2.projName+' ('+overdue.length+' overdue):');
                  overdue.forEach(i=>ok('  ['+i.itemId+'] '+i.title+' | due:'+(i.endDate||'').split('T')[0]));
                }
              }
            }
          } else if (sub==='create') {
            if (!flag('--name')) err('--name required');
            // Zoho requires owner (user ID) and projgroup (project group ID) — fetch/create both automatically
            let pgr = await api('GET','/team/'+tid+'/projectgroups/?action=data&index=1&range=5');
            let projgroup = ((pgr.groups||[])[0]||{}).groupId;
            if (!projgroup) {
              // No project groups exist — create a default one (form-encoded as Zoho docs specify)
              const pg = await apiForm('POST','/team/'+tid+'/projectgroups/',{action:'create',name:'Default'});
              projgroup = pg.groupId;
              if (!projgroup) err('Failed to create default project group: '+JSON.stringify(pg));
              ok('Created default project group.');
            }
            const usr = await api('GET','/team/'+tid+'/users/?action=data&index=1&range=5');
            const owner = ((usr.users||[])[0]||{}).userId;
            if (!owner) err('Could not resolve workspace owner user ID.');
            const toISO = d => d ? (d.includes('T') ? d : d+'T00:00:00+05:30') : null;
            const projParams = {name:flag('--name'), desc:flag('--description')||'', owner, projgroup};
            // Optional UI fields per Zoho docs
            if (flag('--prefix'))   projParams.prefix      = flag('--prefix');
            if (flag('--start'))    projParams.startdate   = toISO(flag('--start'));
            if (flag('--end'))      projParams.enddate     = toISO(flag('--end'));
            if (flag('--type')) {
              // Scrum=1, Kanban=2
              const t = flag('--type').toLowerCase();
              projParams.projectType = t.includes('kanban') ? 2 : 1;
            }
            await apiForm('POST','/team/'+tid+'/projects/',projParams);
            // Create response doesn't return a clean project object — confirm by fetching the list
            let createdId='';
            try { const pl=await api('GET','/team/'+tid+'/projects/?action=data&index=1&range=100'); const found=(pl.projects||[]).find(x=>x.projName===flag('--name')); if(found)createdId=found.projectId; } catch(e){}
            ok('Created project: '+flag('--name')+(createdId?' (ID: '+createdId+')':''));
          } else if (sub==='update') {
            const p = await resolveProject(tid, flag('--project'));
            const toISO = d => d ? (d.includes('T') ? d : d+'T00:00:00+05:30') : null;
            const body = {};
            if (flag('--name'))  body.name = flag('--name');
            if (flag('--start')) body.startdate = toISO(flag('--start'));
            if (flag('--end'))   body.enddate   = toISO(flag('--end'));
            if (flag('--owner')) { const m=await resolveMember(tid, flag('--owner')); if(m) body.owner=m.userId; }
            if (!Object.keys(body).length) err('Nothing to update. Provide --name/--start/--end/--owner.');
            await apiForm('POST','/team/'+tid+'/projects/'+p.projId+'/',body);
            ok('Project "'+p.projName+'" updated.');
          } else if (sub==='archive') {
            const p = await resolveProject(tid, flag('--project'));
            await apiForm('POST','/team/'+tid+'/projects/'+p.projId+'/',{status:2});
            ok('Project "'+p.projName+'" archived.');
          } else if (sub==='unarchive') {
            const p = await resolveProject(tid, flag('--project'));
            await apiForm('POST','/team/'+tid+'/projects/'+p.projId+'/',{status:1});
            ok('Project "'+p.projName+'" unarchived (set to Active).');
          } else if (sub==='delete') {
            const p = await resolveProject(tid, flag('--project'));
            await api('DELETE','/team/'+tid+'/projects/'+p.projId+'/');
            ok('Project "'+p.projName+'" deleted.');
          }
          break;
        }

        // ── Sprints ────────────────────────────────────────────────────────────
        case 'sprints': {
          const proj = await resolveProject(tid, flag('--project'));
          if (!sub||sub==='list') {
            let r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/?action=data&index=1&range=100');
            // Zoho has eventual consistency — retry once after 3s if empty (common right after create/start)
            if (!(r.sprints||[]).length) {
              await new Promise(res=>setTimeout(res,3000));
              r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/?action=data&index=1&range=100');
            }
            const SPTYPE={1:'Upcoming',2:'Active',3:'Completed',4:'Cancelled'};
            const sps=r.sprints||[];
            if(!sps.length) ok('No sprints found.');
            sps.forEach(s=>ok('ID:'+s.sprintId+' | '+s.sprintName+' | '+(SPTYPE[s.sprintType]||'?')+(s.startDate&&s.startDate!=='-1'?' | '+s.startDate.split('T')[0]+' → '+(s.endDate||'').split('T')[0]:'')));
          } else if (sub==='create') {
            if (!flag('--name')) err('--name required');
            const sprintName = flag('--name');
            // Deduplicate: abort if sprint with same name already exists
            try {
              const existing = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/?action=data&index=1&range=100');
              const dup = (existing.sprints||[]).find(s=>s.sprintName.toLowerCase()===sprintName.toLowerCase());
              if (dup) { ok('Sprint "'+sprintName+'" already exists (ID: '+dup.sprintId+'). Not creating duplicate.'); break; }
            } catch(e) { /* ignore — proceed with create */ }
            // Zoho docs: form-encoded POST, params: name, description, startdate, enddate, duration, scrummaster, users
            const toISO = d => d ? (d.includes('T') ? d : d+'T00:00:00+05:30') : null;
            const params = {name: sprintName};
            if (flag('--description')) params.description = flag('--description');
            if (flag('--start'))    params.startdate   = toISO(flag('--start'));
            if (flag('--end'))      params.enddate     = toISO(flag('--end'));
            if (flag('--duration')) params.duration    = flag('--duration');
            if (flag('--owner')) {
              const ownerUser = await resolveUser(tid, flag('--owner'));
              if (ownerUser) params.scrummaster = ownerUser.userId;
            }
            if (flag('--users')) {
              const names = flag('--users').split(',').map(x=>x.trim()).filter(Boolean);
              const allUsers = await api('GET','/team/'+tid+'/users/?action=data&index=1&range=50');
              const ulist = allUsers.users||[];
              const ids = names.map(n=>{
                const u = ulist.find(x=>x.emailId===n||(x.fullName||'').toLowerCase().includes(n.toLowerCase()));
                return u ? u.userId : null;
              }).filter(Boolean);
              if (ids.length) params.users = JSON.stringify(ids);
            }
            if (flag('--usergroup')) ok('Note: User groups are UI-only in Zoho Sprints — no API param. Use --users to add members instead.');
            // POST — create returns status:success only, no sprint ID in response
            await apiForm('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/',params);
            // Confirm creation by fetching sprint list (non-fatal if fetch fails)
            let createdId = '';
            try {
              const allSp = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/?action=data&index=1&range=100');
              const found = (allSp.sprints||[]).find(s=>s.sprintName.toLowerCase()===sprintName.toLowerCase());
              if (found) createdId = found.sprintId;
            } catch(e) { /* confirmation fetch failed — sprint was still created */ }
            ok('Sprint "'+sprintName+'" created successfully.'+(createdId?' ID: '+createdId:''));
            // Auto-create the Slack channel for this sprint (#pm-{project}-{sprint})
            if (process.env.SLACK_BOT_TOKEN) {
              const ch = await getOrCreateProjectChannel(proj.projName);
              if (ch) ok('[Slack] '+(ch.existed?'Using existing':'Created')+" "+chDisplay(ch)+" — all "+proj.projName+" standups will post here.");
              else ok('[Slack] Could not create #'+slackChannelName(proj.projName)+'. Add channels:write scope at api.slack.com/apps → your app → OAuth & Permissions.');
            }
          } else if (sub==='update') {
            const sprint = await resolveSprint(tid, proj.projId, flag('--sprint'));
            const toISO = d => d ? (d.includes('T') ? d : d+'T00:00:00+05:30') : null;
            const body = {};
            if (flag('--name'))        body.name        = flag('--name');
            if (flag('--description')) body.description = flag('--description');
            if (flag('--duration'))    body.duration    = flag('--duration');
            if (flag('--goal'))        body.goal        = flag('--goal');
            // Zoho requires BOTH dates together on update, in yyyy-MM-ddT00:00:00+05:30 format.
            // If only one is given, carry over the existing other (normalized via zohoDate).
            if (flag('--start') || flag('--end')) {
              body.startdate = zohoDate(flag('--start')) || (sprint.startDate && sprint.startDate!=='-1' ? zohoDate(sprint.startDate) : null);
              body.enddate   = zohoDate(flag('--end'))   || (sprint.endDate   && sprint.endDate!=='-1'   ? zohoDate(sprint.endDate)   : null);
              if (!body.startdate || !body.enddate) err('Sprint update needs both a start and end date. Provide --start and --end (the sprint has no existing dates to carry over).');
            }
            await apiForm('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/',body);
            ok('Sprint "'+sprint.sprintName+'" updated.');
          } else if (sub==='start') {
            const sprint = await resolveSprint(tid, proj.projId, flag('--sprint'));
            await apiForm('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/start/',{});
            ok('Sprint "'+sprint.sprintName+'" started.');
          } else if (sub==='complete') {
            const sprint = await resolveSprint(tid, proj.projId, flag('--sprint'));
            await apiForm('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/complete/',{});
            ok('Sprint "'+sprint.sprintName+'" completed.');
          } else if (sub==='delete') {
            const sprint = await resolveSprint(tid, proj.projId, flag('--sprint'));
            await api('DELETE','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/');
            ok('Sprint "'+sprint.sprintName+'" deleted.');
          } else if (sub==='rollover') {
            // Move all incomplete items from current sprint to a target sprint
            const fromSprint = await resolveSprint(tid, proj.projId, flag('--from'));
            const toSprint   = await resolveSprint(tid, proj.projId, flag('--to'));
            const r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+fromSprint.sprintId+'/item/?action=data&index=1&range=100');
            const open = (r.items||[]).filter(i=>(i.statusType||'').toLowerCase()!=='close');
            if (!open.length) { ok('No incomplete items to move.'); break; }
            await api('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+fromSprint.sprintId+'/bulkupdate/',{action:'moveitem',itemidarr:open.map(i=>i.itemId),tosprintid:toSprint.sprintId});
            ok('Moved '+open.length+' items from "'+fromSprint.sprintName+'" to "'+toSprint.sprintName+'".');
          }
          break;
        }

        // ── Items ──────────────────────────────────────────────────────────────
        case 'items': {
          const proj = await resolveProject(tid, flag('--project'));
          const sprintName = flag('--sprint');
          // For list/get/create, default to active sprint when --sprint not given (literal 'backlog' is invalid).
          let sprint = sprintName ? await resolveSprint(tid, proj.projId, sprintName) : null;
          if (!sprint && (!sub||sub==='list'||sub==='create'||sub==='get')) {
            try { sprint = await resolveActiveSprint(tid, proj.projId, null, true); } catch(e) { /* no sprint — fall through */ }
          }
          // 'backlog' is invalid in Zoho API — if no sprint found, tell user clearly
          if (!sprint && (sub==='list'||!sub)) { ok('No active sprint found in "'+proj.projName+'". Create and start a sprint first, then items can be listed.'); break; }
          if (!sprint) err('No sprint found in "'+proj.projName+'". Use --sprint <name> to specify one.');
          const sprintId = sprint.sprintId;

          if (!sub||sub==='list') {
            const filterAssignee = flag('--assignee');
            const filterStatus   = flag('--status');
            const filterPriority = flag('--priority');
            const searchTerm     = flag('--search');
            const filterOverdue  = args.includes('--overdue');
            const filterThisWeek = args.includes('--this-week');
            const filterDueDate  = flag('--due');
            let url = '/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprintId+'/item/?action=data&index=1&range=100';
            if (searchTerm) url += '&searchby=name&searchvalue='+encodeURIComponent(searchTerm);
            const r = await api('GET', url);
            // Enrich raw items with readable status/priority/assignee from lookup maps
            const maps = await getMaps(tid, proj.projId);
            let items = (r.items||[]).map(it=>{const e=enrichItem(it,maps); e.dueDate=(it.endDate&&it.endDate!=='-1')?it.endDate.split('T')[0]:''; return e;});
            if (filterAssignee) {
              const m = await resolveMember(tid, filterAssignee);
              if (m) items = items.filter(i=>(Array.isArray(i.ownerId)?i.ownerId:[i.ownerId]).includes(m.userId)||i.assigneeName===m.name);
            }
            if (filterStatus)   items = items.filter(i=>(i.statusName||'').toLowerCase().includes(filterStatus.toLowerCase()));
            if (filterPriority) items = items.filter(i=>(i.priority||'').toLowerCase()===filterPriority.toLowerCase());
            if (filterOverdue)  items = items.filter(isOverdue);
            if (filterThisWeek) items = items.filter(isDueThisWeek);
            if (filterDueDate)  items = items.filter(i=>i.dueDate===filterDueDate);
            if (!items.length) { ok('No items found.'); break; }
            items.forEach(i=>ok('ID:'+i.itemId+' | '+i.title+' | '+(i.statusName||'-')+' | Assignee:'+(i.assigneeName||'-')+' | Priority:'+(i.priority||'-')));
          } else if (sub==='get') {
            const itemName = flag('--item')||args[2];
            if (!itemName) err('--item <name or ID> required');
            if (!sprint) err('--sprint required for item details');
            const item = await resolveItem(tid, proj.projId, sprint.sprintId, itemName);
            ok('ID: '+item.itemId);
            ok('Title: '+item.title);
            ok('Status: '+item.statusName);
            ok('Assignee: '+(item.assigneeName||'Unassigned'));
            ok('Priority: '+(item.priority||'None'));
            ok('Story Points: '+(item.storyPoints||'Not set'));
            ok('Description: '+(item.description||'None'));
          } else if (sub==='create') {
            if (!flag('--title')&&!flag('--name')) err('--title required');
            if (!sprint) err('--sprint required for creating an item');
            const itemTitle = flag('--title')||flag('--name');
            // Fetch item types and priorities — both projitemtypeid + projpriorityid are MANDATORY
            const [typesR, priR] = await Promise.all([
              api('GET','/team/'+tid+'/projects/'+proj.projId+'/itemtype/?action=data&index=1&range=20'),
              api('GET','/team/'+tid+'/projects/'+proj.projId+'/priority/?action=data&index=1&range=20')
            ]);
            const types = typesR.projItemTypes||[];
            const pris  = priR.projPriorities||[];
            const defaultType = types.find(t=>t.isDefault)||types[0]||{};
            const projitemtypeid = defaultType.projItemTypeId||'';
            // Match priority by name, else default
            let projpriorityid = '';
            if (flag('--priority') && pris.length) {
              const pMatch = pris.find(p=>(p.priorityName||'').toLowerCase().includes(flag('--priority').toLowerCase()));
              if (pMatch) projpriorityid = pMatch.projPriorityId;
            }
            if (!projpriorityid && pris.length) {
              projpriorityid = (pris.find(p=>p.isDefault)||pris[0]).projPriorityId;
            }
            const toISO = d => d ? (d.includes('T') ? d : d+'T00:00:00+05:30') : null;
            const body = {name:itemTitle, projitemtypeid, projpriorityid};
            if (flag('--description')) body.description = flag('--description');
            if (flag('--points'))      body.point       = parseInt(flag('--points'));
            if (flag('--start'))       body.startdate   = toISO(flag('--start'));
            if (flag('--end'))         body.enddate     = toISO(flag('--end'));
            if (flag('--duration'))    body.duration    = flag('--duration');
            if (flag('--epic')) {
              const er = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/epic/?action=data&index=1&range=50');
              const ep = (er.epics||[]).find(e=>(e.epicName||'').toLowerCase().includes(flag('--epic').toLowerCase()));
              if (ep) body.epicid = ep.epicId;
            }
            if (flag('--assignee')) {
              const m = await resolveMember(tid, flag('--assignee'));
              if (m) body.users = JSON.stringify([m.userId]);
            }
            if (flag('--status')) {
              const sr = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/itemstatus/?action=data&index=1&range=50');
              const st = (sr.statuses||[]).find(s=>(s.statusName||'').toLowerCase()===flag('--status').toLowerCase())||(sr.statuses||[]).find(s=>(s.statusName||'').toLowerCase().includes(flag('--status').toLowerCase()));
              if (st) body.statusid = st.statusId;
            }
            const r = await apiForm('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/',body);
            ok('Created item: '+itemTitle+(r.addedItemId?' (ID: '+r.addedItemId+', '+(r.itemNo||'')+')':''));
            appendJournal({ tool:'zoho', project:proj.projName, event:'item_created', item:itemTitle, itemId:r.addedItemId||'', priority:flag('--priority')||'' });
          } else if (sub==='update') {
            const itemName = flag('--item')||args[2];
            if (!itemName) err('--item <name or ID> required');
            if (!sprint) err('--sprint required');
            const item = await resolveItem(tid, proj.projId, sprint.sprintId, itemName);
            const toISO = d => d ? (d.includes('T') ? d : d+'T00:00:00+05:30') : null;
            const body = {};
            if (flag('--title')||flag('--name')) body.name = flag('--title')||flag('--name');
            if (flag('--description')) body.description = flag('--description');
            if (flag('--points')) body.point = parseInt(flag('--points'));
            if (flag('--start')) body.startdate = toISO(flag('--start'));
            if (flag('--end'))   body.enddate   = toISO(flag('--end'));
            if (flag('--priority')) {
              const pr = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/priority/?action=data&index=1&range=20');
              const pm = (pr.projPriorities||[]).find(p=>(p.priorityName||'').toLowerCase().includes(flag('--priority').toLowerCase()));
              if (pm) body.projpriorityid = pm.projPriorityId;
            }
            if (flag('--status')) {
              const sr = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/itemstatus/?action=data&index=1&range=50');
              const st = (sr.statuses||[]).find(s=>(s.statusName||'').toLowerCase()===flag('--status').toLowerCase())||(sr.statuses||[]).find(s=>(s.statusName||'').toLowerCase().includes(flag('--status').toLowerCase()));
              if (st) body.statusid = st.statusId;
            }
            await apiForm('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/',body);
            ok('Item "'+item.title+'" updated.');
            if (flag('--assignee')) ok('Note: Zoho Sprints API only supports setting the assignee when an item is created, not on existing items. To change the owner, recreate the item with --assignee.');
          } else if (sub==='assign') {
            // Zoho's public API has no endpoint to reassign an existing item's owner —
            // the owner (users) can only be set at creation time. Report honestly.
            ok('Zoho Sprints API does not support reassigning an existing item to a different user. Assignee can only be set when the item is created (use "items create --assignee <email>"). To reassign, delete and recreate the item with the new --assignee.');
          } else if (sub==='reassign') {
            // Move all tasks from one person to another
            if (!flag('--from')) err('--from <name or email> required');
            if (!flag('--to')) err('--to <name or email> required');
            if (!sprint) err('--sprint required');
            const fromUser = await resolveMember(tid, flag('--from'));
            const toUser   = await resolveMember(tid, flag('--to'));
            if (!fromUser) err('User "'+flag('--from')+'" not found.');
            if (!toUser)   err('User "'+flag('--to')+'" not found.');
            const r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/?action=data&index=1&range=100');
            const mine = (r.items||[]).filter(i=>i.assignee===fromUser.userId||(i.assigneeName||'').toLowerCase()===fromUser.name.toLowerCase());
            if (!mine.length) { ok('No tasks found assigned to '+fromUser.name+'.'); break; }
            for (const item of mine) {
              await api('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/',{assignee:toUser.userId});
            }
            ok('Reassigned '+mine.length+' tasks from '+fromUser.name+' to '+toUser.name+'.');
          } else if (sub==='status') {
            const itemName = flag('--item')||args[2];
            if (!itemName) err('--item <name or ID> required');
            if (!sprint) err('--sprint required');
            if (!flag('--to')) err('--to <status name> required');
            const item = await resolveItem(tid, proj.projId, sprint.sprintId, itemName);
            const sr = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/itemstatus/?action=data&index=1&range=50');
            const statuses = sr.statuses||[];
            const st = statuses.find(s=>s.statusName.toLowerCase()===flag('--to').toLowerCase())||statuses.find(s=>s.statusName.toLowerCase().includes(flag('--to').toLowerCase()));
            if (!st) {
              ok('Available statuses: '+statuses.map(s=>s.statusName).join(', '));
              err('Status "'+flag('--to')+'" not found.');
            }
            // Item update endpoint requires form-encoding — api() (JSON) is silently ignored by Zoho
            await apiForm('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/',{statusid:st.statusId});
            ok('"'+item.title+'" status changed to "'+st.statusName+'".');
            appendJournal({ tool:'zoho', project:proj.projName, event:'item_status_changed', item:item.title, itemId:item.itemId, to:st.statusName });
          } else if (sub==='move') {
            const itemName = flag('--item')||args[2];
            if (!itemName) err('--item <name or ID> required');
            if (!sprint) err('--sprint <current sprint> required');
            if (!flag('--to-sprint')) err('--to-sprint <target sprint name> required');
            const item = await resolveItem(tid, proj.projId, sprint.sprintId, itemName);
            const toSprint = await resolveSprint(tid, proj.projId, flag('--to-sprint'));
            await api('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/bulkupdate/',{action:'moveitem',itemidarr:[item.itemId],tosprintid:toSprint.sprintId});
            ok('"'+item.title+'" moved to "'+toSprint.sprintName+'".');
          } else if (sub==='comment') {
            const itemName = flag('--item')||args[2];
            if (!itemName) err('--item <name or ID> required');
            if (!sprint) err('--sprint required');
            if (!flag('--body')) err('--body "text" required');
            const item = await resolveItem(tid, proj.projId, sprint.sprintId, itemName);
            // Comments live under the notes endpoint: /modules/{itemModuleId}/entity/{itemId}/notes/
            const mid = await getModuleId(tid, 'item');
            if (!mid) err('Could not resolve the item module ID for comments.');
            await apiForm('POST','/team/'+tid+'/projects/'+proj.projId+'/modules/'+mid+'/entity/'+item.itemId+'/notes/',{action:'addnotes',name:flag('--body')});
            ok('Comment added to "'+item.title+'".');
          } else if (sub==='comments') {
            const itemName = flag('--item')||args[2];
            if (!itemName) err('--item <name or ID> required');
            if (!sprint) err('--sprint required');
            const item = await resolveItem(tid, proj.projId, sprint.sprintId, itemName);
            const mid = await getModuleId(tid, 'item');
            const maps = await getMaps(tid, proj.projId);
            const r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/modules/'+mid+'/entity/'+item.itemId+'/notes/?action=data&index=1&range=50');
            const notes = r.notess||[]; // Zoho's response key is "notess" (sic)
            if (!notes.length) ok('No comments yet.');
            else notes.forEach(c=>ok('['+c.noteId+'] '+(maps.user[c.updatedBy]||c.updatedBy||'?')+': '+(c.notes||'').replace(/<[^>]+>/g,'')));
          } else if (sub==='comment-update') {
            const itemName = flag('--item')||args[2];
            if (!itemName) err('--item <name or ID> required');
            if (!sprint) err('--sprint required');
            if (!flag('--body')) err('--body "new text" required');
            const item = await resolveItem(tid, proj.projId, sprint.sprintId, itemName);
            const mid = await getModuleId(tid, 'item');
            const base = '/team/'+tid+'/projects/'+proj.projId+'/modules/'+mid+'/entity/'+item.itemId+'/notes/';
            // Resolve which comment: --comment-id, else the most recent one
            let nid = flag('--comment-id');
            if (!nid) { const lst=await api('GET',base+'?action=data&index=1&range=50'); const ns=lst.notess||[]; if(!ns.length) err('No comments to update.'); nid=ns[0].noteId; }
            await apiForm('POST',base+nid+'/',{action:'updatenotes',name:flag('--body')});
            ok('Comment updated on "'+item.title+'".');
          } else if (sub==='comment-delete') {
            const itemName = flag('--item')||args[2];
            if (!itemName) err('--item <name or ID> required');
            if (!sprint) err('--sprint required');
            const item = await resolveItem(tid, proj.projId, sprint.sprintId, itemName);
            const mid = await getModuleId(tid, 'item');
            const base = '/team/'+tid+'/projects/'+proj.projId+'/modules/'+mid+'/entity/'+item.itemId+'/notes/';
            let nid = flag('--comment-id');
            if (!nid) { const lst=await api('GET',base+'?action=data&index=1&range=50'); const ns=lst.notess||[]; if(!ns.length) err('No comments to delete.'); nid=ns[0].noteId; }
            await api('DELETE',base+nid+'/');
            ok('Comment deleted from "'+item.title+'".');
          } else if (sub==='close') {
            const itemName = flag('--item')||args[2];
            if (!itemName) err('--item <name or ID> required');
            if (!sprint) err('--sprint required');
            const item = await resolveItem(tid, proj.projId, sprint.sprintId, itemName);
            // To close: set statusid to the end status (isEnd:true), e.g. "Closed"/"Done"
            const sr = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/itemstatus/?action=data&index=1&range=50');
            const endSt = (sr.statuses||[]).find(s=>s.isEnd)||(sr.statuses||[]).find(s=>s.statusType===1);
            if (!endSt) err('No closed/end status found in this project workflow.');
            await apiForm('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/',{statusid:endSt.statusId});
            ok('"'+item.title+'" closed (status: '+endSt.statusName+').');
            appendJournal({ tool:'zoho', project:proj.projName, event:'item_closed', item:item.title, itemId:item.itemId });
          } else if (sub==='delete') {
            const itemName = flag('--item')||args[2];
            if (!itemName) err('--item <name or ID> required');
            if (!sprint) err('--sprint required');
            const item = await resolveItem(tid, proj.projId, sprint.sprintId, itemName);
            await api('DELETE','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/');
            ok('"'+item.title+'" deleted.');
          } else if (sub==='statuses') {
            // List available statuses for a project
            const sr = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/itemstatus/?action=data&index=1&range=50');
            (sr.statuses||sr.itemstatus||[]).forEach(s=>ok('ID:'+s.statusId+' | '+s.statusName+' | Type:'+s.statusType));
          }
          break;
        }

        // ── Members ────────────────────────────────────────────────────────────
        case 'members': {
          const projName = flag('--project');
          const proj = projName ? await resolveProject(tid, projName) : null;

          if (!sub||sub==='list') {
            if (proj) {
              const r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/users/?action=data&index=1&range=100&type=1');
              const us = r.users||[];
              if (!us.length) ok('No members found.');
              us.forEach(u=>ok('ID:'+u.userId+' | '+(u.displayName||u.fullName||'-')+' | '+(u.emailId||'-')));
            } else {
              const r = await api('GET','/team/'+tid+'/users/?action=data&index=1&range=100');
              const us = r.users||[];
              if (!us.length) ok('No members found.');
              us.forEach(u=>ok('ID:'+u.userId+' | '+(u.displayName||u.fullName||'-')+' | '+(u.emailId||'-')));
            }
          } else if (sub==='invite') {
            if (!flag('--email')) err('--email required');
            if (!flag('--profile')) err('--profile <profileId> required (use members profiles to list)');
            if (!flag('--role'))    err('--role <roleId> required');
            await api('POST','/team/'+tid+'/users/',{users:[{EMAILID:flag('--email'),profileId:flag('--profile'),roleId:flag('--role')}]});
            ok('Invited '+flag('--email')+' to workspace.');
          } else if (sub==='add') {
            if (!proj) err('--project required');
            if (!flag('--email')) err('--email required');
            await api('POST','/team/'+tid+'/projects/'+proj.projId+'/users/',{newusers:[{EMAILID:flag('--email')}]});
            ok(flag('--email')+' added to project "'+proj.projName+'".');
          } else if (sub==='remove') {
            const m = await resolveMember(tid, flag('--user'));
            if (!m) err('User "'+flag('--user')+'" not found.');
            if (proj) {
              await api('DELETE','/team/'+tid+'/projects/'+proj.projId+'/users/'+m.userId+'/');
              ok(m.name+' removed from project "'+proj.projName+'".');
            } else {
              await api('DELETE','/team/'+tid+'/users/'+m.userId+'/');
              ok(m.name+' removed from workspace.');
            }
          }
          break;
        }

        // ── Standup ────────────────────────────────────────────────────────────
        case 'standup': {
          const proj = await resolveProject(tid, flag('--project'));
          const sprintName = flag('--sprint');
          const sprint = sprintName ? await resolveSprint(tid, proj.projId, sprintName) : await resolveActiveSprint(tid, proj.projId, null, true);
          if (!sprint) { ok('No sprints found in "'+proj.projName+'". Create a sprint first, then add items to it.'); break; }
          const sid = sprint.sprintId;
          const userFilter = flag('--user');
          const mode = flag('--mode') || 'morning';  // 'morning' or 'eod'
          const postSlack = args.includes('--post-slack');

          const r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sid+'/item/?action=data&index=1&range=200');
          const maps = await getMaps(tid, proj.projId);
          const stR = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/itemstatus/?action=data&index=1&range=50');
          const stMeta = {}; (stR.statuses||[]).forEach(s=>stMeta[s.statusId]={type:s.statusType,isStart:s.isStart,isEnd:s.isEnd});
          let items = (r.items||[]).map(it=>enrichItem(it,maps));
          if (userFilter) {
            const m = await resolveMember(tid, userFilter);
            if (m) items = items.filter(i=>(Array.isArray(i.ownerId)?i.ownerId:[i.ownerId]).includes(m.userId));
          }

          const cat = i => { const meta=stMeta[i.statusId]||{}; if(meta.isEnd||meta.type===1) return 'done'; if(meta.isStart||meta.type===0) return 'todo'; return 'prog'; };
          const todayStr = todayIST();  // 'YYYY-MM-DD' in IST

          // EOD mode: separate "completed TODAY" from "completed earlier"
          const isDoneToday = i => cat(i)==='done' && i.completedDate && i.completedDate!=='-1' && i.completedDate.startsWith(todayStr);
          const isDoneEarlier = i => cat(i)==='done' && !isDoneToday(i);
          const isOverdueItem = i => cat(i)!=='done' && i.dueDate && i.dueDate < todayStr;

          const doneToday   = items.filter(isDoneToday);
          const prog        = items.filter(i=>cat(i)==='prog');
          const todo        = items.filter(i=>cat(i)==='todo');
          const overdue     = items.filter(isOverdueItem);

          const sprintLabel = sprint ? sprint.sprintName : 'Backlog';
          const dateLabel   = new Date(Date.now()+5.5*3600000).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

          // ── Format the message ────────────────────────────────────────────
          const fmt = i => '• '+i.title+(i.assigneeName&&i.assigneeName!=='-'?' · @'+i.assigneeName:'');
          let msg;
          if (mode === 'eod') {
            msg = [
              '*📊 '+proj.projName+' — '+sprintLabel+' · End of Day · '+dateLabel+'*',
              '',
              '✅ *Completed today ('+doneToday.length+')*',
              ...(doneToday.length ? doneToday.map(fmt) : ['  _Nothing closed today_']),
              '',
              '🔨 *In Progress ('+prog.length+')*',
              ...(prog.length ? prog.map(fmt) : ['  _Nothing in progress_']),
              '',
              '📋 *Still To Do ('+todo.length+')*',
              ...(todo.length ? todo.slice(0,8).map(fmt).concat(todo.length>8?['  _…and '+(todo.length-8)+' more_']:[]) : ['  _Sprint is clear ✨_']),
              ...(overdue.length ? ['','⚠️ *Overdue ('+overdue.length+')*',...overdue.map(i=>fmt(i)+' · due '+i.dueDate)] : []),
            ].join('\n');
          } else {
            // Morning standup: what's in progress + what's up next
            const done = items.filter(i=>cat(i)==='done');
            msg = [
              '*🌅 '+proj.projName+' — '+sprintLabel+' · Standup · '+dateLabel+'*',
              '',
              '✅ *Done ('+done.length+')*',
              ...(done.length ? done.slice(0,5).map(fmt).concat(done.length>5?['  _…and '+(done.length-5)+' more_']:[]) : ['  _Nothing closed yet_']),
              '',
              '🔨 *In Progress ('+prog.length+')*',
              ...(prog.length ? prog.map(fmt) : ['  _Nothing in progress_']),
              '',
              '📋 *Up Next ('+todo.length+')*',
              ...(todo.length ? todo.slice(0,5).map(fmt).concat(todo.length>5?['  _…and '+(todo.length-5)+' more_']:[]) : ['  _Nothing queued_']),
              ...(overdue.length ? ['','⚠️ *Overdue ('+overdue.length+')*',...overdue.map(i=>fmt(i)+' · due '+i.dueDate)] : []),
            ].join('\n');
          }

          ok(msg);

          // ── Auto-post to Slack (per-sprint channel + day thread) ────────────
          // Architecture: each sprint gets its own Slack channel (#pm-{proj}-{sprint}).
          // Each day gets one parent message; morning and EOD post as thread replies.
          // State (channelIds + threadTs) persisted on PVC → survives pod restarts.
          if (postSlack) {
            if (!process.env.SLACK_BOT_TOKEN) {
              ok('[Slack] Skipped — SLACK_BOT_TOKEN not set.');
            } else if (!sprint) {
              ok('[Slack] Skipped — no active sprint resolved, cannot determine channel.');
            } else {
              const ch = await getOrCreateProjectChannel(proj.projName);
              if (!ch) {
                // No channel available at all — tell the agent to ask the user
                ok('[Slack] No channel available for '+proj.projName+'. AGENT: ask the user which Slack channel to use for '+proj.projName+' updates, then run: node zoho-sprints.js slack set-channel --project "'+proj.projName+'" --channel "#their-answer"');
              } else {
                if (!ch.existed) ok('[Slack] Created '+chDisplay(ch)+' for '+proj.projName+' standups.');
                const threadTs = await getOrCreateDayThread(ch.id, proj.projName, sprint?sprint.sprintName:'', todayIST());
                const posted   = await postToSlack(ch.id, msg, threadTs);
                ok(posted ? '[Slack] Posted to '+chDisplay(ch)+' (day-threaded under '+todayIST()+')' : '[Slack] Post failed — check bot permissions.');
              }
            }
          }
          break;
        }


        // ── standup-all: auto-discover all projects + post to their channels ──
        // Used by the Kubernetes CronJobs (9am / 9pm). Zero config needed.
        case 'standup-all': {
          const mode = flag('--mode') || 'morning';
          const pr = await api('GET','/team/'+tid+'/projects/?action=data&index=1&range=100');
          const allProjects = (pr.projects||[]).filter(p=>p.status===1).map(p=>({...p,projId:p.projId||p.projectId}));
          if (!allProjects.length) { ok('No active projects found.'); break; }
          ok('Running '+mode+' standup for '+allProjects.length+' project(s): '+allProjects.map(p=>p.projName).join(', '));
          for (const proj of allProjects) {
            try {
              const sprint = await resolveActiveSprint(tid, proj.projId, null, true);
              if (!sprint) { ok('['+proj.projName+'] No active sprint — skipping.'); continue; }
              const maps = await getMaps(tid, proj.projId);
              const stR  = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/itemstatus/?action=data&index=1&range=50');
              const stMeta = {}; (stR.statuses||[]).forEach(s=>stMeta[s.statusId]={type:s.statusType,isStart:s.isStart,isEnd:s.isEnd});
              const r    = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/?action=data&index=1&range=200');
              let items  = (r.items||[]).map(it=>enrichItem(it,maps));
              const cat  = i => { const m=stMeta[i.statusId]||{}; if(m.isEnd||m.type===1) return 'done'; if(m.isStart||m.type===0) return 'todo'; return 'prog'; };
              const todayStr = todayIST();
              const fmt  = i => '• '+i.title+(i.assigneeName&&i.assigneeName!=='-'?' · @'+i.assigneeName:'');
              const dateLabel = new Date(Date.now()+5.5*3600000).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
              let msg;
              if (mode==='eod') {
                const doneToday = items.filter(i=>cat(i)==='done'&&i.completedDate&&i.completedDate!=='-1'&&i.completedDate.startsWith(todayStr));
                const prog      = items.filter(i=>cat(i)==='prog');
                const todo      = items.filter(i=>cat(i)==='todo');
                const overdue   = items.filter(i=>cat(i)!=='done'&&i.dueDate&&i.dueDate<todayStr);
                msg = ['*📊 '+proj.projName+' — '+sprint.sprintName+' · End of Day · '+dateLabel+'*','',
                  '✅ *Completed today ('+doneToday.length+')*',...(doneToday.length?doneToday.map(fmt):['  _Nothing closed today_']),'',
                  '🔨 *In Progress ('+prog.length+')*',...(prog.length?prog.map(fmt):['  _Nothing in progress_']),'',
                  '📋 *Still To Do ('+todo.length+')*',...(todo.length?todo.slice(0,8).map(fmt).concat(todo.length>8?['  _…and '+(todo.length-8)+' more_']:[]):['  _Sprint is clear ✨_']),
                  ...(overdue.length?['','⚠️ *Overdue ('+overdue.length+')*',...overdue.map(i=>fmt(i)+' · due '+i.dueDate)]:[])].join('\n');
              } else {
                const done = items.filter(i=>cat(i)==='done');
                const prog = items.filter(i=>cat(i)==='prog');
                const todo = items.filter(i=>cat(i)==='todo');
                const overdue = items.filter(i=>cat(i)!=='done'&&i.dueDate&&i.dueDate<todayStr);
                msg = ['*🌅 '+proj.projName+' — '+sprint.sprintName+' · Standup · '+dateLabel+'*','',
                  '✅ *Done ('+done.length+')*',...(done.length?done.slice(0,5).map(fmt).concat(done.length>5?['  _…and '+(done.length-5)+' more_']:[]):['  _Nothing closed yet_']),'',
                  '🔨 *In Progress ('+prog.length+')*',...(prog.length?prog.map(fmt):['  _Nothing in progress_']),'',
                  '📋 *Up Next ('+todo.length+')*',...(todo.length?todo.slice(0,5).map(fmt).concat(todo.length>5?['  _…and '+(todo.length-5)+' more_']:[]):['  _Nothing queued_']),
                  ...(overdue.length?['','⚠️ *Overdue ('+overdue.length+')*',...overdue.map(i=>fmt(i)+' · due '+i.dueDate)]:[])].join('\n');
              }
              ok(msg);
              // Get/create the project's standup channel and post as day-thread
              if (process.env.SLACK_BOT_TOKEN) {
                const ch = await getOrCreateProjectChannel(proj.projName);
                if (ch) {
                  if (!ch.existed) ok('[Slack] Created '+chDisplay(ch));
                  const threadTs = await getOrCreateDayThread(ch.id, proj.projName, sprint.sprintName, todayStr);
                  const posted   = await postToSlack(ch.id, msg, threadTs);
                  ok(posted ? '[Slack] '+proj.projName+' → '+chDisplay(ch)+' (day-threaded)' : '[Slack] '+proj.projName+' post failed.');
                } else {
                  // No auto-channel + no saved manual channel + no SLACK_STANDUP_CHANNEL
                  // In cron mode we can only log; in interactive mode the agent will ask the user.
                  ok('[Slack] '+proj.projName+': no Slack channel configured. AGENT: ask the user which channel to use and run: node zoho-sprints.js slack set-channel --project "'+proj.projName+'" --channel "#their-choice"');
                }
              }
            } catch(e) { ok('['+proj.projName+'] Error: '+e.message+' — continuing with next project.'); }
          }
          break;
        }

        // ── daily-snapshot: dump full state of all active projects to PVC ────────
        // Run nightly (11pm). Morning-brief diffs against the latest snapshot.
        case 'daily-snapshot': {
          const pr = await api('GET','/team/'+tid+'/projects/?action=data&index=1&range=100');
          const projects = (pr.projects||[]).filter(p=>p.status===1).map(p=>({...p,projId:p.projId||p.projectId}));
          const states = [];
          for (const proj of projects) {
            try { const st = await buildProjectState(tid, proj); if (st) states.push(st); }
            catch(e) { ok('['+proj.projName+'] snapshot error: '+e.message); }
          }
          saveSnapshot(todayIST(), { date: todayIST(), projects: states });
          ok('Snapshot saved for '+todayIST()+' — '+states.length+' project(s) with active sprints.');
          break;
        }

        // ── morning-brief: synthesised delta vs yesterday, per project ──────────
        case 'morning-brief': {
          const pr = await api('GET','/team/'+tid+'/projects/?action=data&index=1&range=100');
          const projects = (pr.projects||[]).filter(p=>p.status===1).map(p=>({...p,projId:p.projId||p.projectId}));
          // Find the most recent prior snapshot (yesterday, or the latest available)
          let prior = null;
          for (let back=1; back<=7 && !prior; back++) {
            const d = new Date(Date.now()+5.5*3600000 - back*86400000).toISOString().split('T')[0];
            prior = loadSnapshot(d);
          }
          const priorById = {};
          if (prior) (prior.projects||[]).forEach(p=>{ priorById[p.projId] = {}; (p.items||[]).forEach(i=>priorById[p.projId][i.itemId]=i); });
          const dateLabel = new Date(Date.now()+5.5*3600000).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
          for (const proj of projects) {
            try {
              const st = await buildProjectState(tid, proj);
              if (!st) { ok('['+proj.projName+'] no active sprint — skipping.'); continue; }
              const prev = priorById[proj.projId] || {};
              const fmt = i => i.title+(i.assigneeName&&i.assigneeName!=='-'?' · @'+i.assigneeName:'')+(i.isHigh?' ['+(i.priority)+']':'');
              // Deltas since the prior snapshot
              const closedSince = st.items.filter(i=>i.cat==='done' && (!prev[i.itemId] || prev[i.itemId].cat!=='done'));
              const addedSince  = st.items.filter(i=>!prev[i.itemId]);
              const nowOverdue  = st.items.filter(i=>i.overdue && (!prev[i.itemId] || !prev[i.itemId].overdue));
              const inProg      = st.items.filter(i=>i.cat==='prog');
              const todo        = st.items.filter(i=>i.cat==='todo');
              const blocked     = st.items.filter(i=>/block/i.test(i.statusName||''));
              const lines = ['*🌅 '+proj.projName+' · Morning Brief · '+dateLabel+'*',''];
              if (!prior) { lines.push('_(First brief — no prior snapshot to compare. Baseline below.)_',''); }
              else {
                lines.push('*Since yesterday:*');
                lines.push(closedSince.length ? '✅ Closed: '+closedSince.map(i=>i.title).join(', ')+' ('+closedSince.length+' shipped)' : '✅ Closed: nothing new');
                if (addedSince.length) lines.push('🆕 Added: '+addedSince.map(fmt).join(', '));
                if (nowOverdue.length) lines.push('⚠️ Newly overdue: '+nowOverdue.map(i=>i.title+(i.assigneeName==='-'?' (no owner)':' · @'+i.assigneeName)).join(', '));
                lines.push('');
              }
              lines.push('*Today:*');
              lines.push('🔨 In Progress ('+inProg.length+'): '+(inProg.length?inProg.slice(0,6).map(i=>i.title).join(', '):'none'));
              lines.push('📋 To Do ('+todo.length+'): '+st.counts.unassigned+' unassigned');
              lines.push('🚨 Blockers: '+(blocked.length?blocked.map(i=>i.title).join(', '):'none'));
              if (st.daysLeft!=null) {
                const pace = st.pct >= (100 - st.daysLeft*8) ? 'on track' : 'behind pace';
                lines.push('');
                lines.push('Sprint '+st.sprintName+' — '+st.pct+'% complete'+(st.daysLeft>=0?', ends in '+st.daysLeft+' day'+(st.daysLeft===1?'':'s')+' ('+pace+')':' (overdue)'));
              }
              const res = await notify(proj.projName, st.sprintName, lines.join('\n'));
              ok('['+proj.projName+'] '+res.join(' | '));
            } catch(e) { ok('['+proj.projName+'] brief error: '+e.message); }
          }
          break;
        }

        // ── alert-check: fire only on NEW high-pri / overdue / sprint-at-risk ────
        // Run every 2h. Diffs against pm-alert-state.json so it never repeats noise.
        case 'alert-check': {
          const ALERT_FILE = '/home/node/.openclaw/workspace/pm-alert-state.json';
          let seen = {}; try { seen = JSON.parse(fs.readFileSync(ALERT_FILE,'utf8')); } catch(e) { seen = {}; }
          const pr = await api('GET','/team/'+tid+'/projects/?action=data&index=1&range=100');
          const projects = (pr.projects||[]).filter(p=>p.status===1).map(p=>({...p,projId:p.projId||p.projectId}));
          const newSeen = {};
          for (const proj of projects) {
            try {
              const st = await buildProjectState(tid, proj);
              if (!st) continue;
              const alerts = [];
              const pseen = seen[proj.projId] || { high:[], overdue:[], atRisk:false };
              const nseen = { high:[], overdue:[], atRisk:false };
              // New high-priority items
              st.items.filter(i=>i.isHigh && i.cat!=='done').forEach(i=>{
                nseen.high.push(i.itemId);
                if (!pseen.high.includes(i.itemId)) alerts.push('🔴 New '+(i.priority||'high')+' priority: *'+i.title+'*'+(i.assigneeName==='-'?' (unassigned)':' · @'+i.assigneeName));
              });
              // Newly overdue items
              st.items.filter(i=>i.overdue).forEach(i=>{
                nseen.overdue.push(i.itemId);
                if (!pseen.overdue.includes(i.itemId)) alerts.push('⏰ Overdue: *'+i.title+'* (due '+i.dueDate+(i.assigneeName==='-'?', no owner)':', @'+i.assigneeName+')'));
              });
              // Sprint at risk: <3 days left and <50% complete
              const atRisk = st.daysLeft!=null && st.daysLeft<=3 && st.daysLeft>=0 && st.pct<50;
              nseen.atRisk = atRisk;
              if (atRisk && !pseen.atRisk) alerts.push('🚨 *Sprint at risk* — '+st.sprintName+' ends in '+st.daysLeft+' day(s) but only '+st.pct+'% complete.');
              newSeen[proj.projId] = nseen;
              if (alerts.length) {
                const msg = '*⚠️ '+proj.projName+' — Alerts*\n\n'+alerts.join('\n');
                const res = await notify(proj.projName, st.sprintName, msg);
                ok('['+proj.projName+'] '+alerts.length+' alert(s) → '+res.join(' | '));
              } else {
                ok('['+proj.projName+'] no new alerts.');
              }
            } catch(e) { ok('['+proj.projName+'] alert error: '+e.message); }
          }
          try { fs.writeFileSync(ALERT_FILE, JSON.stringify(newSeen)); } catch(e) {}
          break;
        }

        // ── weekly-report: analytics digest → email (+ Slack/Telegram) ──────────
        // Run Friday 5pm. Velocity from snapshot deltas, team load + blockers from
        // current state, simple linear prediction for sprint completion.
        case 'weekly-report': {
          const pr = await api('GET','/team/'+tid+'/projects/?action=data&index=1&range=100');
          const projects = (pr.projects||[]).filter(p=>p.status===1).map(p=>({...p,projId:p.projId||p.projectId}));
          const d7  = new Date(Date.now()+5.5*3600000 - 7*86400000).toISOString().split('T')[0];
          const d14 = new Date(Date.now()+5.5*3600000 - 14*86400000).toISOString().split('T')[0];
          const snap7 = loadSnapshot(d7), snap14 = loadSnapshot(d14);
          const doneSet = (snap, pid) => { const p=(snap&&snap.projects||[]).find(x=>x.projId===pid); return p? new Set((p.items||[]).filter(i=>i.cat==='done').map(i=>i.itemId)) : new Set(); };
          const weekNum = (() => { const d=new Date(Date.now()+5.5*3600000); const onejan=new Date(d.getFullYear(),0,1); return Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7); })();
          const reports = [];
          for (const proj of projects) {
            try {
              const st = await buildProjectState(tid, proj);
              if (!st) continue;
              const doneNow = new Set(st.items.filter(i=>i.cat==='done').map(i=>i.itemId));
              const done7   = doneSet(snap7, proj.projId);
              const done14  = doneSet(snap14, proj.projId);
              const closedThisWeek = [...doneNow].filter(id=>!done7.has(id)).length;
              const closedLastWeek = [...done7].filter(id=>!done14.has(id)).length;
              const velArrow = snap7 ? (closedThisWeek>=closedLastWeek?'↑':'↓')+Math.abs(closedThisWeek-closedLastWeek)+' vs last week' : 'no prior week data';
              // Team load
              const load = {};
              st.items.filter(i=>i.cat!=='done').forEach(i=>{ const a=i.assigneeName==='-'?'_unassigned':i.assigneeName; load[a]=(load[a]||0)+1; });
              const assignedPeople = Object.keys(load).filter(k=>k!=='_unassigned');
              const avg = assignedPeople.length ? (assignedPeople.reduce((s,k)=>s+load[k],0)/assignedPeople.length) : 0;
              const loadLines = Object.entries(load).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
                if (k==='_unassigned') return '  '+v+' item(s): unassigned';
                const tag = v > avg*1.5 ? ' (overloaded — avg '+avg.toFixed(1)+')' : (v < avg*0.5 ? ' (light)' : '');
                return '  '+k+': '+v+' item(s)'+tag;
              });
              const blockers = st.items.filter(i=>/block/i.test(i.statusName||''));
              const overdue  = st.items.filter(i=>i.overdue);
              // Prediction: items/day this week → project to sprint end
              let prediction = 'n/a (no prior snapshot)';
              if (snap7 && st.daysLeft!=null) {
                const perDay = closedThisWeek/7;
                const projected = Math.min(100, Math.round((st.counts.done + perDay*Math.max(0,st.daysLeft))/Math.max(1,st.counts.total)*100));
                prediction = 'Sprint completes ~'+projected+'% by end date (at current '+perDay.toFixed(1)+' items/day)';
              }
              const body = [
                '📊 '+proj.projName+' — Week '+weekNum+' Report',
                '',
                'Velocity: '+closedThisWeek+' items closed ('+velArrow+')',
                'Sprint: '+st.sprintName+' — '+st.pct+'% complete'+(st.daysLeft!=null?', '+Math.max(0,st.daysLeft)+' days remaining':''),
                '',
                'Team load:',
                ...(loadLines.length?loadLines:['  (no items assigned)']),
                '',
                'Blockers: '+(blockers.length?blockers.map(i=>i.title).join(', '):'none'),
                'Overdue: '+(overdue.length?overdue.map(i=>i.title+' (due '+i.dueDate+')').join(', '):'none'),
                '',
                'Prediction: '+prediction,
              ].join('\n');
              reports.push({ proj: proj.projName, sprint: st.sprintName, body });
            } catch(e) { ok('['+proj.projName+'] weekly error: '+e.message); }
          }
          if (!reports.length) { ok('No active projects to report on.'); break; }
          // Email — one combined email to all stakeholders
          const emailBody = reports.map(r=>r.body).join('\n\n'+'─'.repeat(40)+'\n\n');
          const mail = await sendReportEmail('Weekly PM Report — Week '+weekNum, emailBody);
          ok(mail.ok ? '[Email] Sent week '+weekNum+' report to '+mail.to.join(', ') : '[Email] Skipped: '+mail.reason);
          // Also post each project's report to its Slack/Telegram channel
          for (const r of reports) {
            const res = await notify(r.proj, r.sprint, '*'+r.body.split('\n')[0]+'*\n'+r.body.split('\n').slice(1).join('\n'));
            ok('['+r.proj+'] '+res.join(' | '));
          }
          break;
        }

        // ── Epics ─────────────────────────────────────────────────────────────
        case 'epics': {
          const proj = await resolveProject(tid, flag('--project'));
          if (!sub||sub==='list') {
            const r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/epic/?action=data&index=1&range=50');
            const eps=r.epics||[];
            if(!eps.length) ok('No epics found.');
            eps.forEach(e=>ok('ID:'+e.epicId+' | '+e.epicName+' | '+(e.epicType===1?'Archived':'Active')));
          } else if (sub==='create') {
            if (!flag('--name')) err('--name required');
            // Epic create: name + owner mandatory per Zoho docs
            const epicOwner = ((await api('GET','/team/'+tid+'/users/?action=data&index=1&range=5')).users||[])[0]||{};
            const epicParams = {name:flag('--name'), owner: epicOwner.userId||''};
            if (flag('--description')) epicParams.desc = flag('--description');
            if (flag('--color')) epicParams.color = flag('--color');
            // Epic create uses a JSON body (unlike sprint/item which are form-encoded)
            const r = await api('POST','/team/'+tid+'/projects/'+proj.projId+'/epic/',epicParams);
            const e=(r.epics||[])[0]||{}; ok('Created epic: '+(e.epicId||'')+' — '+(e.epicName||flag('--name')));
          } else if (sub==='items') {
            const epicId = flag('--epic'); if (!epicId) err('--epic <id or name> required');
            const er = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/epic/?action=data&index=1&range=50');
            const epic = (er.epics||[]).find(e=>e.epicId===epicId||e.epicName.toLowerCase()===epicId.toLowerCase()||e.epicName.toLowerCase().includes(epicId.toLowerCase()));
            if (!epic) err('Epic "'+epicId+'" not found.');
            const maps = await getMaps(tid, proj.projId);
            const r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/epic/'+epic.epicId+'/?action=details');
            const eitems=(r.items||r.epicItems||[]).map(i=>enrichItem(i,maps));
            if(!eitems.length) ok('No items in this epic.');
            eitems.forEach(i=>ok('ID:'+i.itemId+' | '+i.title+' | '+(i.statusName||'-')));
          } else if (sub==='delete') {
            const epicId = flag('--epic'); if (!epicId) err('--epic <id or name> required');
            const er = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/epic/?action=data&index=1&range=50');
            const epic = (er.epics||[]).find(e=>e.epicId===epicId||e.epicName.toLowerCase().includes(epicId.toLowerCase()));
            if (!epic) err('Epic "'+epicId+'" not found.');
            await api('DELETE','/team/'+tid+'/projects/'+proj.projId+'/epic/'+epic.epicId+'/');
            ok('Epic "'+epic.epicName+'" deleted.');
          }
          break;
        }

        // ── Timesheets ────────────────────────────────────────────────────────
        case 'timesheet': {
          const proj = await resolveProject(tid, flag('--project'));
          const sprintName = flag('--sprint');
          const sprint = sprintName ? await resolveSprint(tid, proj.projId, sprintName) : null;

          // Convert "2", "1.5", or "02:30" → Zoho duration "HH:MM"
          const toDuration = h => { if(/^\d{1,2}:\d{2}$/.test(h)) return h; const f=parseFloat(h); const hh=Math.floor(f); const mm=Math.round((f-hh)*60); return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'); };
          if (!sub||sub==='list') {
            const r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/timesheet/?action=data&index=1&range=50&listviewtype=1&logtypes=%5B0%5D');
            const umap = r.userDisplayName||{};
            const logs = r.logs||r.loghours||[];
            if(!logs.length) ok('No time logs found.');
            // logTime is the duration in MILLISECONDS (e.g. 9000000 = 2h30m)
            const fmtMs = ms => { const mins=Math.round((Number(ms)||0)/60000); return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0'); };
            logs.forEach(l=>{
              const hrs = l.logTime!=null ? fmtMs(l.logTime) : '?';
              const who = umap[l.Owner]||l.Owner||'';
              ok((l.logDate||'').split('T')[0]+' | '+hrs+' | '+who+' | '+(l.logNotes||l.logTitle||'-'));
            });
          } else if (sub==='log') {
            if (!flag('--item')) err('--item <name or ID> required');
            if (!flag('--hours')) err('--hours <number> required');
            if (!sprint) err('--sprint required');
            const item = await resolveItem(tid, proj.projId, sprint.sprintId, flag('--item'));
            // Resolve the user: --user, else the workspace's first user (the PM)
            let userId;
            if (flag('--user')) { const m=await resolveMember(tid, flag('--user')); if(m) userId=m.userId; }
            if (!userId) userId = ((await api('GET','/team/'+tid+'/users/?action=data&index=1&range=5')).users||[])[0].userId;
            // Date must not be in the future; default to today (IST)
            const logDate = (flag('--date')||todayIST())+'T00:00:00+05:30';
            const body = {action:'additemlog', duration:toDuration(flag('--hours')), date:logDate, users:userId, notes:flag('--notes')||flag('--note')||'', isbillable:0};
            await apiForm('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/timesheet/',body);
            ok('Logged '+flag('--hours')+'h on "'+item.title+'".');
          }
          break;
        }

        // ── Releases ──────────────────────────────────────────────────────────
        case 'releases': {
          const proj = await resolveProject(tid, flag('--project'));
          if (!sub||sub==='list') {
            const r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/release/?action=data&index=1&range=50');
            const rels=r.releases||[];
            if(!rels.length) ok('No releases found.');
            rels.forEach(r2=>ok('ID:'+r2.releaseId+' | '+r2.releaseName+(r2.startDate&&r2.startDate!=='-1'?' | '+r2.startDate.split('T')[0]+' → '+(r2.endDate||'').split('T')[0]:'')));
          } else if (sub==='create') {
            if (!flag('--name')) err('--name required');
            // Release create: JSON body. Mandatory: name, startdate, enddate, ownerIds, statusId (release stage).
            const owner = ((await api('GET','/team/'+tid+'/users/?action=data&index=1&range=5')).users||[])[0]||{};
            // Fetch release stages — statusId (a stage) is required ("Choose the release stage")
            const stagesR = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/releasestatus/?action=data&index=1&range=20');
            const stages = stagesR.releasestatuses||[];
            const stage = stages.find(s=>s.isStart)||stages[0]||{};
            const statusId = stage.statusId||stage.releasestatusId;
            const body = {name:flag('--name'), startdate:zohoDate(flag('--start')||todayIST()), enddate:zohoDate(flag('--end')||daysFromNow(14)), ownerIds:[owner.userId], goal:flag('--description')||flag('--goal')||''};
            if (statusId) body.statusId = statusId;
            if (flag('--color')) body.color = flag('--color');
            const r = await api('POST','/team/'+tid+'/projects/'+proj.projId+'/release/',body);
            const rel=(r.releases||[])[0]||{}; ok('Created release: '+(rel.releaseId||'')+' — '+(rel.releaseName||flag('--name')));
          } else if (sub==='add-item') {
            if (!flag('--release')) err('--release <id or name> required');
            if (!flag('--item')) err('--item <id> required');
            const rr = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/release/?action=data&index=1&range=50');
            const rel = (rr.releases||[]).find(r2=>r2.releaseId===flag('--release')||r2.releaseName.toLowerCase().includes(flag('--release').toLowerCase()));
            if (!rel) err('Release "'+flag('--release')+'" not found.');
            await api('POST','/team/'+tid+'/projects/'+proj.projId+'/release/'+rel.releaseId+'/item/associate/',{itemIds:[flag('--item')]});
            ok('Item added to release "'+rel.releaseName+'".');
          } else if (sub==='delete') {
            const rr = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/release/?action=data&index=1&range=50');
            const rel = (rr.releases||[]).find(r2=>r2.releaseName.toLowerCase().includes((flag('--release')||'').toLowerCase()));
            if (!rel) err('Release "'+flag('--release')+'" not found.');
            await api('DELETE','/team/'+tid+'/projects/'+proj.projId+'/release/'+rel.releaseId+'/');
            ok('Release "'+rel.releaseName+'" deleted.');
          }
          break;
        }

        // ── Meetings ──────────────────────────────────────────────────────────
        case 'meetings': {
          const proj = await resolveProject(tid, flag('--project'));
          const sprintName = flag('--sprint');
          const sprint = sprintName ? await resolveSprint(tid, proj.projId, sprintName) : null;

          if (!sub||sub==='list') {
            const path = sprint
              ? '/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/meeting/?action=data&index=1&range=30&filter=%7B%22viewtype%22%3A0%7D'
              : '/team/'+tid+'/projects/'+proj.projId+'/meeting/?action=data&index=1&range=30&filter=%7B%22viewtype%22%3A0%7D';
            const r = await api('GET', path);
            (r.meetings||[]).forEach(m=>ok('ID:'+m.meetingId+' | '+m.title+' | '+m.startDateTime+' | '+m.status));
          } else if (sub==='create') {
            if (!flag('--title')) err('--title required');
            if (!flag('--date')) err('--date <YYYY-MM-DD HH:MM> required');
            if (!sprint) err('--sprint required');
            const body = {title:flag('--title'),startDateTime:flag('--date'),duration:flag('--duration')||'60',description:flag('--description')||''};
            const r = await api('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/meeting/',body);
            const m=(r.meetingJObj||[])[0]||{}; ok('Created meeting: '+m.meetingId+' — '+m.title);
          } else if (sub==='delete') {
            if (!sprint) err('--sprint required');
            if (!flag('--meeting')) err('--meeting <id> required');
            await api('DELETE','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/meeting/'+flag('--meeting')+'/');
            ok('Meeting deleted.');
          }
          break;
        }

        // ── Checklists ────────────────────────────────────────────────────────
        case 'checklists': {
          const proj = await resolveProject(tid, flag('--project'));
          const sprint = await resolveSprint(tid, proj.projId, flag('--sprint'));
          const item = await resolveItem(tid, proj.projId, sprint.sprintId, flag('--item'));

          if (!sub||sub==='list') {
            const r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/clgroup/?action=data&index=1&range=25');
            const groups = r.checklistGroups||r.clgroups||[];
            for (const g of groups) {
              ok('Group: '+g.clgName+' (ID:'+g.clgId+')');
              const cr = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/clgroup/'+g.clgId+'/clitem/?action=data&index=1&range=50');
              (cr.checklistItems||cr.clitems||[]).forEach(c=>ok('  ['+(c.status===1?'x':' ')+'] '+c.clName+' (ID:'+c.clId+')'));
            }
          } else if (sub==='add') {
            if (!flag('--name')) err('--name required');
            // Create group if --group specified, otherwise use first existing group
            let clgId = flag('--group');
            if (!clgId) {
              const r = await api('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/clgroup/',{clgName:flag('--name')+'_group'});
              clgId = (r.checklistGroup||r.clgObj||{}).clgId;
            }
            if (clgId) {
              const r = await api('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/clgroup/'+clgId+'/clitem/',{clName:flag('--name')});
              ok('Checklist item added: '+flag('--name'));
            }
          } else if (sub==='check'||sub==='done') {
            if (!flag('--checklist')) err('--checklist <id> required');
            if (!flag('--group')) err('--group <clgId> required');
            await api('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/clgroup/'+flag('--group')+'/clitem/'+flag('--checklist')+'/',{status:1});
            ok('Checklist item marked done.');
          } else if (sub==='uncheck') {
            if (!flag('--checklist')) err('--checklist <id> required');
            if (!flag('--group')) err('--group <clgId> required');
            await api('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/clgroup/'+flag('--group')+'/clitem/'+flag('--checklist')+'/',{status:0});
            ok('Checklist item unchecked.');
          } else if (sub==='delete') {
            if (!flag('--checklist')) err('--checklist <id> required');
            if (!flag('--group')) err('--group <clgId> required');
            await api('DELETE','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/clgroup/'+flag('--group')+'/clitem/'+flag('--checklist')+'/');
            ok('Checklist item deleted.');
          }
          break;
        }

        // ── Activity (Item History) ────────────────────────────────────────────
        case 'activity': {
          const proj = await resolveProject(tid, flag('--project'));
          const sprint = await resolveSprint(tid, proj.projId, flag('--sprint'));
          const item = await resolveItem(tid, proj.projId, sprint.sprintId, flag('--item'));
          const r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/activity/?index=1&range=20');
          (r.activity||r.activities||[]).forEach(a=>ok((a.performedByName||'?')+' | '+a.activity+' | '+(a.performedTime||'')));
          break;
        }


        // ── Fix 3: Active sprint auto-detect (already in resolveSprint, adding fallback) ──
        // ── Fix 6: Linked items & subtasks ──────────────────────────────────────
        case 'links': {
          const proj = await resolveProject(tid, flag('--project'));
          const sprint = await resolveActiveSprint(tid, proj.projId, flag('--sprint'));
          const item = await resolveItem(tid, proj.projId, sprint.sprintId, flag('--item'));
          const r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/linkitem/?action=data');
          const links = r.linkedItems||r.linkItems||[];
          if (!links.length) { ok('No linked items for "'+item.title+'".'); break; }
          links.forEach(l=>ok((l.linkType||'linked')+': ['+l.itemId+'] '+l.title+' | '+l.statusName+' | '+l.sprintName));
          break;
        }

        case 'subtasks': {
          const proj = await resolveProject(tid, flag('--project'));
          const sprint = await resolveActiveSprint(tid, proj.projId, flag('--sprint'));
          const parent = await resolveItem(tid, proj.projId, sprint.sprintId, flag('--item'));
          const ibase = '/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+parent.itemId;
          if (!sub||sub==='list') {
            const maps = await getMaps(tid, proj.projId);
            const r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/?action=data&index=1&range=200&subitem=true');
            const subs = (r.items||[]).filter(i=>String(i.immediateParentId)===String(parent.itemId)).map(i=>enrichItem(i,maps));
            if (!subs.length) { ok('No subtasks for "'+parent.title+'".'); break; }
            subs.forEach(s=>ok('  ['+s.itemId+'] '+s.title+' | '+(s.statusName||'-')+' | '+(s.assigneeName||'-')));
          } else if (sub==='create') {
            if (!flag('--name')&&!flag('--title')) err('--name "subtask name" required');
            const name = flag('--name')||flag('--title');
            const [typesR, priR] = await Promise.all([
              api('GET','/team/'+tid+'/projects/'+proj.projId+'/itemtype/?action=data&index=1&range=20'),
              api('GET','/team/'+tid+'/projects/'+proj.projId+'/priority/?action=data&index=1&range=20')
            ]);
            const ty=(typesR.projItemTypes||[]).find(t=>t.isDefault)||{};
            const pr=(priR.projPriorities||[]).find(p=>p.isDefault)||{};
            const body={name, projitemtypeid:ty.projItemTypeId, projpriorityid:pr.projPriorityId};
            if (flag('--description')) body.description=flag('--description');
            const r = await apiForm('POST',ibase+'/subitem/',body);
            ok('Subtask "'+name+'" created under "'+parent.title+'"'+(r.addedItemId?' (ID: '+r.addedItemId+')':'')+'.');
          } else if (sub==='complete'||sub==='close') {
            const sub2 = await resolveSubitem(tid, proj.projId, sprint.sprintId, parent.itemId, flag('--subtask')||flag('--name'));
            const sr = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/itemstatus/?action=data&index=1&range=50');
            const endSt=(sr.statuses||[]).find(s=>s.isEnd)||(sr.statuses||[]).find(s=>s.statusType===1);
            await apiForm('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+sub2.itemId+'/',{statusid:endSt.statusId});
            ok('Subtask "'+sub2.title+'" marked done.');
          } else if (sub==='delete') {
            const sub2 = await resolveSubitem(tid, proj.projId, sprint.sprintId, parent.itemId, flag('--subtask')||flag('--name'));
            await api('DELETE','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+sub2.itemId+'/');
            ok('Subtask "'+sub2.title+'" deleted.');
          }
          break;
        }

        // ── Slack channel management ──────────────────────────────────────────
        case 'slack': {
          if (sub==='set-channel') {
            // Save a manually chosen Slack channel for a project.
            // Usage: node zoho-sprints.js slack set-channel --project TIR --channel "#general"
            if (!flag('--project')) err('--project <name> required');
            if (!flag('--channel')) err('--channel <#channel-name> required');
            const proj = await resolveProject(tid, flag('--project'));
            saveManualChannel(proj.projName, flag('--channel'));
            ok('Saved: '+proj.projName+' updates → '+flag('--channel')+'. All future standups for '+proj.projName+' will post there.');
          } else if (sub==='channels') {
            // Show all saved channel mappings
            const state = loadSlackState();
            const entries = Object.entries(state.channels);
            if (!entries.length) { ok('No channel mappings saved yet.'); break; }
            entries.forEach(([k,v])=>ok(k.replace(/^(ch:|manual:)/,'')+' → '+v));
          } else if (sub==='clear-channel') {
            if (!flag('--project')) err('--project <name> required');
            const proj = await resolveProject(tid, flag('--project'));
            const state = loadSlackState();
            delete state.channels['ch:'+proj.projName.toLowerCase()];
            delete state.channels['manual:'+proj.projName.toLowerCase()];
            saveSlackState(state);
            ok('Cleared channel mapping for '+proj.projName+'. Next standup will auto-detect or ask again.');
          } else {
            ok('Usage: slack set-channel --project X --channel #Y  |  slack channels  |  slack clear-channel --project X');
          }
          break;
        }

        // ── Tags ───────────────────────────────────────────────────────────────
        case 'tags': {
          // Workspace tag helpers. NOTE: a tag has both tagId and zsTagId — item
          // association uses zsTagId; read-back key is associateTagIds.
          const tagName = t => t.tagName||t.name||'';
          const tagZId  = t => t.zsTagId;
          const listTags = async () => (await api('GET','/team/'+tid+'/tags/?action=data&index=1&range=100')).zsTags||[];
          if (!sub||sub==='list') {
            const tags = await listTags();
            if (!tags.length) ok('No tags defined in this workspace yet. Create one with: tags create --name "backend".');
            tags.forEach(t=>ok(tagName(t)));
          } else if (sub==='create') {
            if (!flag('--name')) err('--name required');
            const body={action:'createtag', name:flag('--name')};
            if (flag('--color')) body.color=flag('--color');
            await apiForm('POST','/team/'+tid+'/tag/',body);
            ok('Tag "'+flag('--name')+'" created.');
          } else if (sub==='add'||sub==='remove'||sub==='item') {
            const proj = await resolveProject(tid, flag('--project'));
            const sprint = await resolveActiveSprint(tid, proj.projId, flag('--sprint'));
            const item = await resolveItem(tid, proj.projId, sprint.sprintId, flag('--item'));
            const tbase = '/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/tags/';
            let allTags = await listTags();
            const curIds = (await api('GET',tbase+'?action=itemassociatedtagIds')).associateTagIds||[];
            if (sub==='item') {
              if (!curIds.length) { ok('No tags on "'+item.title+'".'); break; }
              ok('Tags on "'+item.title+'": '+curIds.map(id=>{const m=allTags.find(t=>String(tagZId(t))===String(id)); return m?tagName(m):id;}).join(', '));
              break;
            }
            if (!flag('--tag')) err('--tag <name> required (comma-separate for multiple, e.g. --tag backend,frontend)');
            const tagNames = flag('--tag').split(',').map(s=>s.trim()).filter(Boolean);
            if (sub==='add') {
              // Resolve/create every requested tag, then do ONE associate call (avoids
              // read-after-write races when adding several tags).
              const addIds = [];
              for (const tn of tagNames) {
                let tag = allTags.find(t=>tagName(t).toLowerCase()===tn.toLowerCase());
                if (!tag) { await apiForm('POST','/team/'+tid+'/tag/',{action:'createtag',name:tn}); allTags=await listTags(); tag=allTags.find(t=>tagName(t).toLowerCase()===tn.toLowerCase()); }
                if (tag) addIds.push(String(tagZId(tag)));
              }
              const merged = Array.from(new Set([...curIds.map(String), ...addIds]));
              await apiForm('POST',tbase,{action:'associateupdate', newtags:JSON.stringify(merged), reassociate:true});
              ok('Tag(s) '+tagNames.join(', ')+' added to "'+item.title+'".');
            } else { // remove
              const removeIds = tagNames.map(tn=>{const t=allTags.find(x=>tagName(x).toLowerCase()===tn.toLowerCase()); return t?String(tagZId(t)):null;}).filter(Boolean);
              const keep = curIds.map(String).filter(id=>!removeIds.includes(id));
              await apiForm('POST',tbase,{action:'associateupdate', newtags:JSON.stringify(keep), reassociate:true});
              ok('Tag(s) '+tagNames.join(', ')+' removed from "'+item.title+'".');
            }
          }
          break;
        }

        // ── Fix 5: Sprint comparison ──────────────────────────────────────────
        case 'compare': {
          const proj = await resolveProject(tid, flag('--project'));
          const s1name = flag('--sprint1')||flag('--from');
          const s2name = flag('--sprint2')||flag('--to');
          if (!s1name||!s2name) err('--sprint1 <name> --sprint2 <name> required');
          const s1 = await resolveSprint(tid, proj.projId, s1name);
          const s2 = await resolveSprint(tid, proj.projId, s2name);

          async function sprintStats(sprint) {
            const r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/?action=data&index=1&range=200');
            const items = r.items||[];
            const done  = items.filter(i=>(i.statusType||'').toLowerCase()==='close');
            const total = items.length;
            const pts   = done.reduce((a,i)=>a+(parseInt(i.storyPoints)||0),0);
            const overdue = items.filter(i=>i.dueDate&&new Date(i.dueDate)<new Date()&&(i.statusType||'').toLowerCase()!=='close');
            return { sprint, items, done, total, pts, overdue };
          }

          const [r1, r2] = await Promise.all([sprintStats(s1), sprintStats(s2)]);
          ok('=== Sprint Comparison ===');
          ok('');
          ok(String(s1.sprintName).padEnd(30)+' | '+String(s2.sprintName));
          ok('Total items:  '+String(r1.total).padEnd(28)+' | '+r2.total);
          ok('Completed:    '+String(r1.done.length).padEnd(28)+' | '+r2.done.length);
          ok('Story pts:    '+String(r1.pts).padEnd(28)+' | '+r2.pts);
          ok('Overdue:      '+String(r1.overdue.length).padEnd(28)+' | '+r2.overdue.length);
          const velocityDelta = r2.pts - r1.pts;
          ok('');
          ok('Velocity change: '+(velocityDelta>=0?'+':'')+velocityDelta+' story points');
          ok('Completion rate: '+Math.round(r1.done.length/Math.max(r1.total,1)*100)+'% → '+Math.round(r2.done.length/Math.max(r2.total,1)*100)+'%');
          break;
        }

        // ── Fix 9: Bulk conditional operations ───────────────────────────────
        case 'bulk': {
          const proj = await resolveProject(tid, flag('--project'));
          const sprint = await resolveActiveSprint(tid, proj.projId, flag('--sprint'));
          const maps = await getMaps(tid, proj.projId);
          const r = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/?action=data&index=1&range=200');
          let items = (r.items||[]).map(it=>enrichItem(it,maps));

          // Apply filters
          const filterStatus   = flag('--where-status');
          const filterAssignee = flag('--where-assignee');
          const filterPriority = flag('--where-priority');
          const filterUnassigned = args.includes('--where-unassigned');

          if (filterStatus)    items = items.filter(i=>(i.statusName||'').toLowerCase().includes(filterStatus.toLowerCase()));
          if (filterPriority)  items = items.filter(i=>(i.priority||'').toLowerCase()===filterPriority.toLowerCase());
          if (filterUnassigned) items = items.filter(i=>i.assigneeName==='-'||!i.assigneeName);
          if (filterAssignee) {
            const m = await resolveMember(tid, filterAssignee);
            if (m) items = items.filter(i=>(Array.isArray(i.ownerId)?i.ownerId:[i.ownerId]).includes(m.userId));
          }

          if (!items.length) { ok('No items match the filter.'); break; }
          ok('Found '+items.length+' items matching filter.');

          const action = sub;
          if (action==='close') {
            const sr = await api('GET','/team/'+tid+'/projects/'+proj.projId+'/itemstatus/?action=data&index=1&range=50');
            const endSt = (sr.statuses||[]).find(s=>s.isEnd)||(sr.statuses||[]).find(s=>s.statusType===1);
            if (!endSt) err('No closed/end status found in this project workflow.');
            for (const item of items) {
              await apiForm('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/',{statusid:endSt.statusId});
              ok('  Closed: '+item.title);
            }
          } else if (action==='assign') {
            const toUser = flag('--to'); if (!toUser) err('--to <name or email> required');
            const m = await resolveMember(tid, toUser);
            const assignee = m ? m.userId : toUser;
            for (const item of items) {
              await api('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/item/'+item.itemId+'/',{assignee});
              ok('  Assigned: '+item.title+' → '+(m?m.name:toUser));
            }
          } else if (action==='move') {
            const toSprint = await resolveSprint(tid, proj.projId, flag('--to-sprint'));
            await api('POST','/team/'+tid+'/projects/'+proj.projId+'/sprints/'+sprint.sprintId+'/bulkupdate/',{action:'moveitem',itemidarr:items.map(i=>i.itemId),tosprintid:toSprint.sprintId});
            ok('Moved '+items.length+' items to "'+toSprint.sprintName+'".');
          } else {
            err('Unknown bulk action: '+action+'. Use: close, assign, move');
          }
          break;
        }

        // ── update-creds ───────────────────────────────────────────────────────
        // Saves Zoho credentials to PVC. User can call via chat to update without redeploying.
        // Usage: node zoho-sprints.js update-creds [--client-id X] [--client-secret Y] [--refresh-token Z] [--workspace-id W]
        case 'update-creds': {
          const newId  = flag('--client-id')     || '';
          const newSec = flag('--client-secret') || '';
          const newTok = flag('--refresh-token') || '';
          const newWid = flag('--workspace-id')  || '';
          if (!newId && !newSec && !newTok && !newWid) err('Provide at least one of: --client-id --client-secret --refresh-token --workspace-id');
          let existing = {};
          try { existing = JSON.parse(fs.readFileSync(ZOHO_CREDS_FILE,'utf8')); } catch(e) {}
          const updated = {
            clientId:     newId  || existing.clientId     || '',
            clientSecret: newSec || existing.clientSecret || '',
            refreshToken: newTok || existing.refreshToken || '',
            workspaceId:  newWid || existing.workspaceId  || '',
            savedAt: new Date().toISOString()
          };
          fs.writeFileSync(ZOHO_CREDS_FILE, JSON.stringify(updated,null,2));
          ok('Zoho credentials updated and saved. Changes take effect on the next Zoho command.');
          break;
        }

        default:
          console.error('Unknown: '+cmd+'\nAvailable: workspaces, projects, sprints, items, members, standup, update-creds');
          process.exit(1);
      }
    }

    main().catch(e=>{ console.error('[zoho-sprints] '+(e.message||e)); process.exit(1); });

  # Telegram pairing-approval MCP server. Lets the operator approve unknown Telegram
  # DM requests from chat (OpenClaw exposes no Control-UI path for channel pairing).
  # Only used when Telegram is in "pairing" mode (no allowed user IDs provided).
  tg-pairing-mcp.js: |
    'use strict';
    const fs = require('fs');
    const { spawnSync } = require('child_process');
    const PAIR = '/home/node/.openclaw/credentials/telegram-pairing.json';
    function send(m) { process.stdout.write(JSON.stringify(m) + '\n'); }
    function pending() {
      try {
        const d = JSON.parse(fs.readFileSync(PAIR, 'utf8'));
        return (d.requests || []).map(r => ({
          code: r.code, telegramUserId: r.id,
          username: r.meta && r.meta.username,
          name: [r.meta && r.meta.firstName, r.meta && r.meta.lastName].filter(Boolean).join(' '),
        }));
      } catch (e) { return []; }
    }
    function approve(code) {
      const r = spawnSync('node', ['/app/dist/index.js', 'pairing', 'approve', 'telegram', String(code)],
        { env: Object.assign({}, process.env, { HOME: '/home/node', OPENCLAW_CONFIG_DIR: '/home/node/.openclaw' }), encoding: 'utf8', timeout: 30000 });
      return { ok: r.status === 0, out: ((r.stdout || '') + (r.stderr || '')).trim().slice(0, 400) };
    }
    const TOOLS = [
      { name: 'telegram_list_pending_pairings', description: 'List people waiting for approval to use the Telegram bot (pending DM pairing requests). Returns each request code, username and name.', inputSchema: { type: 'object', properties: {}, required: [] } },
      { name: 'telegram_approve_pairing', description: 'Approve a pending Telegram pairing request by its code so that user can use the bot. Confirm with the user before calling.', inputSchema: { type: 'object', properties: { code: { type: 'string' } }, required: ['code'] } },
    ];
    let buf = '';
    process.stdin.on('data', d => {
      buf += d; let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        let m; try { m = JSON.parse(line); } catch (e) { continue; }
        handle(m);
      }
    });
    function handle(m) {
      const id = m.id, method = m.method, params = m.params;
      if (method === 'initialize') {
        send({ jsonrpc: '2.0', id, result: { protocolVersion: (params && params.protocolVersion) || '2024-11-05', capabilities: { tools: {} }, serverInfo: { name: 'telegram-pairing', version: '1.0.0' } } });
      } else if (method === 'tools/list') {
        send({ jsonrpc: '2.0', id, result: { tools: TOOLS } });
      } else if (method === 'tools/call') {
        const n = params && params.name, a = (params && params.arguments) || {};
        let result;
        if (n === 'telegram_list_pending_pairings') {
          const p = pending();
          result = { content: [{ type: 'text', text: p.length ? JSON.stringify(p, null, 2) : 'No pending Telegram pairing requests.' }] };
        } else if (n === 'telegram_approve_pairing') {
          if (!a.code) { result = { content: [{ type: 'text', text: 'Error: code is required.' }], isError: true }; }
          else { const r = approve(a.code); result = { content: [{ type: 'text', text: (r.ok ? 'Approved. ' : 'Failed. ') + r.out }], isError: !r.ok }; }
        } else { result = { content: [{ type: 'text', text: 'Unknown tool ' + n }], isError: true }; }
        send({ jsonrpc: '2.0', id, result });
      } else if (id !== undefined) {
        send({ jsonrpc: '2.0', id, error: { code: -32601, message: 'no method ' + method } });
      }
    }

  e2e-setup-proxy.js: |
    'use strict';
    const http  = require('http');
    const https = require('https');
    const fs    = require('fs');
    const path  = require('path');

    const TOKEN_FILE  = '/home/node/.openclaw/e2e-token.json';
    const CONFIG_FILE = '/home/node/.openclaw/openclaw.json';
    const AUTH_FILE   = '/home/node/.openclaw/agents/pm/agent/auth-profiles.json';
    const PORT        = 3000;

    const E2E_NAMESPACE = process.env.E2E_PROJECT_NAMESPACE || '';
    const E2E_MODEL     = process.env.E2E_MODEL_NAME || 'gpt_oss_120b';

    const TIR_MODELS = new Set([
      'gpt_oss_120b','qwen3_32b','qwen3_235b_a22b','qwen3_14b','qwen2_5_72b_instruct',
      'qwen2_5_32B_instruct','qwq_32b','deepseek_r1','deepseek_v3','deepseek_v3_0324',
      'deepseek_r1_distill_llama_70b','deepseek_r1_distill_qwen_8b','llama_3_3_70b_instruct',
      'llama_3_3_70b_instruct_fp8','llama3_1_8b_instruct','llama_3_1_nemotron_ultra_253b_v1',
      'llama3_openbiollm_70b','llama3_openbiollm_8b','llama3_med42_8b','mistral_7b_instruct',
      'mixtral_8x7b_instruct_v01','dolphin_2_9_2_mixtral_8x22b','phi_4','phi_3_5_mini_instruct',
      'phi_3_5_moe_instruct','phi_3_medium_128k_instruct','phi_3_mini_4k_instruct',
      'nemotron_3_nano_30b_base_bf16','codellama_34b_instruct','gemma_7b','olmo_7b_instruct_hf',
      'llama_4_scout_17b_16e_instruct','gemma_3_27b_it'
    ]);

    function resolveModel(raw) {
      const m = (raw || E2E_MODEL).replace(/^[^/]+\//, '');
      return TIR_MODELS.has(m) ? m : E2E_MODEL;
    }

    function getStoredToken() {
      try {
        const t = JSON.parse(fs.readFileSync(TOKEN_FILE, 'utf8')).token || '';
        if (!t) return null;
        const parts = t.split('.');
        if (parts.length === 3) {
          try {
            const p = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
            if (p.exp && p.exp < Math.floor(Date.now() / 1000)) {
              console.log('[proxy] Stored token expired');
              return null;
            }
          } catch(e) {}
        }
        return t;
      } catch(e) { return null; }
    }

    function isJWT(str) {
      // Strip optional timestamp prefix added by OpenClaw: [Day YYYY-MM-DD HH:MM TZ]
      const s = (str||'').trim().replace(/^\[[^\]]*\]\s*/, '');
      return /^eyJ[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+$/.test(s);
    }

    function extractJWT(str) {
      return (str||'').trim().replace(/^\[[^\]]*\]\s*/, '');
    }

    function extractText(content) {
      if (!content) return '';
      if (typeof content === 'string') return content.trim();
      if (Array.isArray(content)) {
        return content.map(p => p.text || p.content || '').join('').trim();
      }
      return String(content).trim();
    }

    function saveToken(token) {
      fs.writeFileSync(TOKEN_FILE, JSON.stringify({ token, savedAt: new Date().toISOString() }, null, 2));
      try {
        const c = JSON.parse(fs.readFileSync(CONFIG_FILE, 'utf8'));
        if (!c.models) c.models = {};
        if (!c.models.providers) c.models.providers = {};
        if (!c.models.providers.e2e) c.models.providers.e2e = {};
        c.models.providers.e2e.apiKey = token;
        fs.writeFileSync(CONFIG_FILE, JSON.stringify(c, null, 2));
      } catch(e) { console.error('[proxy] Config update error:', e.message); }
      try {
        fs.mkdirSync(path.dirname(AUTH_FILE), { recursive: true });
        let auth = {};
        try { auth = JSON.parse(fs.readFileSync(AUTH_FILE, 'utf8')); } catch(e) {}
        auth.e2e = { apiKey: token };
        fs.writeFileSync(AUTH_FILE, JSON.stringify(auth, null, 2));
      } catch(e) { console.error('[proxy] Auth store error:', e.message); }
      console.log('[proxy] Token saved to PVC');
    }

    function sendSSE(res, content, model) {
      const ts = Math.floor(Date.now() / 1000);
      const m = (model || E2E_MODEL).replace(/^[^/]+\//, '');
      res.writeHead(200, { 'Content-Type': 'text/event-stream', 'Cache-Control': 'no-cache', 'Access-Control-Allow-Origin': '*' });
      res.write(`data: ${JSON.stringify({ id:'chatcmpl-setup', object:'chat.completion.chunk', created:ts, model:m, choices:[{index:0,delta:{role:'assistant'},finish_reason:null}] })}\n\n`);
      res.write(`data: ${JSON.stringify({ id:'chatcmpl-setup', object:'chat.completion.chunk', created:ts, model:m, choices:[{index:0,delta:{content},finish_reason:null}] })}\n\n`);
      res.write(`data: ${JSON.stringify({ id:'chatcmpl-setup', object:'chat.completion.chunk', created:ts, model:m, choices:[{index:0,delta:{},finish_reason:'stop'}] })}\n\n`);
      res.write('data: [DONE]\n\n');
      res.end();
    }

    function sendSSEResponses(res, content, model) {
      const ts     = Math.floor(Date.now() / 1000);
      const m      = (model || E2E_MODEL).replace(/^[^/]+\//, '');
      const respId = 'resp-setup-' + ts;
      const itemId = 'item-setup-' + ts;
      res.writeHead(200, { 'Content-Type': 'text/event-stream', 'Cache-Control': 'no-cache', 'Access-Control-Allow-Origin': '*' });
      res.write(`event: response.created\ndata: ${JSON.stringify({type:'response.created',response:{id:respId,object:'response',created_at:ts,status:'in_progress',model:m,output:[]}})}\n\n`);
      res.write(`event: response.output_item.added\ndata: ${JSON.stringify({type:'response.output_item.added',response_id:respId,output_index:0,item:{id:itemId,type:'message',status:'in_progress',role:'assistant',content:[]}})}\n\n`);
      res.write(`event: response.content_part.added\ndata: ${JSON.stringify({type:'response.content_part.added',response_id:respId,item_id:itemId,output_index:0,content_index:0,part:{type:'output_text',text:''}})}\n\n`);
      res.write(`event: response.output_text.delta\ndata: ${JSON.stringify({type:'response.output_text.delta',response_id:respId,item_id:itemId,output_index:0,content_index:0,delta:content})}\n\n`);
      res.write(`event: response.output_text.done\ndata: ${JSON.stringify({type:'response.output_text.done',response_id:respId,item_id:itemId,output_index:0,content_index:0,text:content})}\n\n`);
      res.write(`event: response.content_part.done\ndata: ${JSON.stringify({type:'response.content_part.done',response_id:respId,item_id:itemId,output_index:0,content_index:0,part:{type:'output_text',text:content}})}\n\n`);
      res.write(`event: response.output_item.done\ndata: ${JSON.stringify({type:'response.output_item.done',response_id:respId,output_index:0,item:{id:itemId,type:'message',status:'completed',role:'assistant',content:[{type:'output_text',text:content}]}})}\n\n`);
      res.write(`event: response.completed\ndata: ${JSON.stringify({type:'response.completed',response:{id:respId,object:'response',created_at:ts,status:'completed',model:m,output:[{id:itemId,type:'message',status:'completed',role:'assistant',content:[{type:'output_text',text:content}]}]}})}\n\n`);
      res.end();
    }

    function forwardToE2E(body, token, res) {
      let parsed;
      try { parsed = JSON.parse(body); } catch(e) { res.writeHead(400).end('Bad JSON'); return; }
      const model = resolveModel(parsed.model);
      if (model === 'llama3_1_8b_instruct') { delete parsed.tools; delete parsed.tool_choice; body = JSON.stringify(parsed); }
      const target = `https://infer.e2enetworks.net/project/${E2E_NAMESPACE}/genai/${model}/v1/chat/completions`;
      const url = new URL(target);
      const bodyBuf = Buffer.from(body);
      const req = https.request({
        hostname: url.hostname, path: url.pathname, method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Content-Length': bodyBuf.length }
      }, proxyRes => {
        res.writeHead(proxyRes.statusCode, proxyRes.headers);
        proxyRes.pipe(res);
      });
      req.on('error', e => { console.error('[proxy] Forward error:', e.message); if (!res.headersSent) res.writeHead(502).end(); });
      req.write(bodyBuf);
      req.end();
    }

    function forwardToE2EResponses(body, token, res) {
      let parsed;
      try { parsed = JSON.parse(body); } catch(e) { res.writeHead(400).end('Bad JSON'); return; }
      const model  = resolveModel(parsed.model);
      const msgs   = typeof parsed.input === 'string'
        ? [{ role: 'user', content: parsed.input }]
        : (parsed.input || []).map(m => ({ role: m.role, content: extractText(m.content) }));
      if (parsed.instructions) msgs.unshift({ role: 'system', content: parsed.instructions });
      const ccBody   = JSON.stringify({ model, messages: msgs, stream: true });
      const target   = `https://infer.e2enetworks.net/project/${E2E_NAMESPACE}/genai/${model}/v1/chat/completions`;
      const url      = new URL(target);
      const bodyBuf  = Buffer.from(ccBody);
      const ts       = Math.floor(Date.now() / 1000);
      const respId   = 'resp-' + ts;
      const itemId   = 'item-' + ts;
      const req = https.request({
        hostname: url.hostname, path: url.pathname, method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Content-Length': bodyBuf.length }
      }, proxyRes => {
        if (proxyRes.statusCode !== 200) {
          res.writeHead(proxyRes.statusCode, proxyRes.headers);
          proxyRes.pipe(res);
          return;
        }
        res.writeHead(200, { 'Content-Type': 'text/event-stream', 'Cache-Control': 'no-cache', 'Access-Control-Allow-Origin': '*' });
        res.write(`event: response.created\ndata: ${JSON.stringify({type:'response.created',response:{id:respId,object:'response',created_at:ts,status:'in_progress',model,output:[]}})}\n\n`);
        res.write(`event: response.output_item.added\ndata: ${JSON.stringify({type:'response.output_item.added',response_id:respId,output_index:0,item:{id:itemId,type:'message',status:'in_progress',role:'assistant',content:[]}})}\n\n`);
        res.write(`event: response.content_part.added\ndata: ${JSON.stringify({type:'response.content_part.added',response_id:respId,item_id:itemId,output_index:0,content_index:0,part:{type:'output_text',text:''}})}\n\n`);
        let buf = '';
        let fullText = '';
        proxyRes.on('data', chunk => {
          buf += chunk.toString();
          const lines = buf.split('\n');
          buf = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data:')) continue;
            const data = line.slice(5).trim();
            if (data === '[DONE]') continue;
            try {
              const cc    = JSON.parse(data);
              const delta = cc.choices?.[0]?.delta?.content;
              if (delta) {
                fullText += delta;
                res.write(`event: response.output_text.delta\ndata: ${JSON.stringify({type:'response.output_text.delta',response_id:respId,item_id:itemId,output_index:0,content_index:0,delta})}\n\n`);
              }
            } catch(e) {}
          }
        });
        proxyRes.on('end', () => {
          const doneTs = Math.floor(Date.now() / 1000);
          res.write(`event: response.output_text.done\ndata: ${JSON.stringify({type:'response.output_text.done',response_id:respId,item_id:itemId,output_index:0,content_index:0,text:fullText})}\n\n`);
          res.write(`event: response.content_part.done\ndata: ${JSON.stringify({type:'response.content_part.done',response_id:respId,item_id:itemId,output_index:0,content_index:0,part:{type:'output_text',text:fullText}})}\n\n`);
          res.write(`event: response.output_item.done\ndata: ${JSON.stringify({type:'response.output_item.done',response_id:respId,output_index:0,item:{id:itemId,type:'message',status:'completed',role:'assistant',content:[{type:'output_text',text:fullText}]}})}\n\n`);
          res.write(`event: response.completed\ndata: ${JSON.stringify({type:'response.completed',response:{id:respId,object:'response',created_at:doneTs,status:'completed',model,output:[{id:itemId,type:'message',status:'completed',role:'assistant',content:[{type:'output_text',text:fullText}]}]}})}\n\n`);
          res.end();
        });
        proxyRes.on('error', e => { console.error('[proxy] Stream error:', e.message); res.end(); });
      });
      req.on('error', e => { console.error('[proxy] Forward error:', e.message); if (!res.headersSent) res.writeHead(502).end(); });
      req.write(bodyBuf);
      req.end();
    }

    http.createServer((req, res) => {
      if (req.method === 'OPTIONS') {
        res.writeHead(204, { 'Access-Control-Allow-Origin':'*', 'Access-Control-Allow-Headers':'*', 'Access-Control-Allow-Methods':'*' });
        return res.end();
      }

      if (req.method === 'GET' && req.url.startsWith('/v1/models')) {
        let models = [{ id: E2E_MODEL, object:'model', created:0, owned_by:'e2e' }];
        try {
          const provModels = JSON.parse(fs.readFileSync(CONFIG_FILE,'utf8'))?.models?.providers?.e2e?.models || [];
          if (provModels.length) models = provModels.map(m => ({ id: m.id, object:'model', created:0, owned_by:'e2e' }));
        } catch(e) {}
        res.writeHead(200, { 'Content-Type':'application/json' });
        return res.end(JSON.stringify({ object:'list', data: models }));
      }

      if (req.method === 'POST' && req.url === '/v1/chat/completions') {
        let body = '';
        req.on('data', c => body += c);
        req.on('end', () => {
          const token = getStoredToken();
          if (token) return forwardToE2E(body, token, res);

          let parsed;
          try { parsed = JSON.parse(body); } catch(e) { return res.writeHead(400).end(); }
          const lastMsg = (parsed.messages || []).slice(-1)[0];
          const content = extractText(lastMsg?.content);

          if (isJWT(content)) {
            saveToken(extractJWT(content));
            sendSSE(res, 'Bearer token saved! You can start chatting now — no refresh needed.', parsed.model);
            return;
          }

          sendSSE(res,
            'Welcome to E2E AI Project Manager!\n\nTo get started, I need your E2E Networks bearer token to connect to the GenAI models.\n\nGet it from: E2E Console -> TIR project -> API Tokens\n\nOnce you have it, paste it here and I\'ll set everything up automatically.',
            parsed.model);
        });
        return;
      }

      if (req.method === 'POST' && req.url === '/v1/responses') {
        let body = '';
        req.on('data', c => body += c);
        req.on('end', () => {
          let parsed;
          try { parsed = JSON.parse(body); } catch(e) { return res.writeHead(400).end(); }

          const token = getStoredToken();
          if (token) return forwardToE2EResponses(body, token, res);

          let content = '';
          if (typeof parsed.input === 'string') {
            content = parsed.input.trim();
          } else if (Array.isArray(parsed.input)) {
            const lastMsg = parsed.input.slice(-1)[0];
            content = extractText(lastMsg?.content);
          }

          if (isJWT(content)) {
            saveToken(extractJWT(content));
            sendSSEResponses(res, 'Bearer token saved! You can start chatting now — no refresh needed.', parsed.model);
            return;
          }

          sendSSEResponses(res,
            'Welcome to E2E AI Project Manager!\n\nTo get started, I need your E2E Networks bearer token to connect to the GenAI models.\n\nGet it from: E2E Console -> TIR project -> API Tokens\n\nOnce you have it, paste it here and I\'ll set everything up automatically.',
            parsed.model);
        });
        return;
      }

      res.writeHead(404).end();
    }).listen(PORT, () => {
      const token = getStoredToken();
      console.log(`[proxy] Listening on :${PORT} | namespace=${E2E_NAMESPACE} | token=${token ? 'SET' : 'NOT SET — setup mode'}`);
    });
