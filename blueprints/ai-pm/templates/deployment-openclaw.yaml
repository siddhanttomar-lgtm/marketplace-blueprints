apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-openclaw
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aipm.labels" . | nindent 4 }}
    app.kubernetes.io/component: openclaw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: openclaw
    spec:
      serviceAccountName: {{ .Release.Name }}-ingress-patcher
      imagePullSecrets:
        - name: registry-pull-secret
      securityContext:
        fsGroup: 1000
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: fix-permissions
          image: "{{ .Values.openclaw.image.repository }}:{{ .Values.openclaw.image.tag }}"
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command: ["sh", "-c", "chown -R 1000:1000 /home/node/.openclaw && chmod 755 /home/node/.openclaw && echo '[fix-permissions] done'"]
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw

        - name: init-config
          image: "{{ .Values.openclaw.image.repository }}:{{ .Values.openclaw.image.tag }}"
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              cp /config/openclaw.json /home/node/.openclaw/openclaw.json
              cp /home/node/.openclaw/openclaw.json /tmp/openclaw-backup.json
              mkdir -p /home/node/.openclaw/workspace
              cp /config/SKILL.md /home/node/.openclaw/workspace/SKILL.md
              echo "[init-config] Config and SKILL.md copied."

              # AI model selection
              if [ ${#ANTHROPIC_API_KEY} -gt 30 ]; then
                PROVIDER="anthropic"; MODEL_ID="claude-sonnet-4-5"
              elif [ ${#OPENAI_API_KEY} -gt 30 ]; then
                PROVIDER="openai"; MODEL_ID="gpt-4o-mini"
              elif [ ${#GOOGLE_API_KEY} -gt 20 ]; then
                PROVIDER="google"; MODEL_ID="gemini-2.0-flash"
              elif [ ${#GROQ_API_KEY} -gt 30 ]; then
                PROVIDER="groq"; MODEL_ID="qwen-qwq-32b"
              elif [ ${#FIREWORKS_API_KEY} -gt 10 ]; then
                PROVIDER="openai"; MODEL_ID="accounts/fireworks/models/deepseek-v4-pro"
                FIREWORKS_MODE="true"
              else
                echo "[init-config] WARNING: no AI API key set."
                PROVIDER=""; MODEL_ID=""
              fi

              if [ -n "$PROVIDER" ] && [ -n "$MODEL_ID" ]; then
                HOME=/home/node OPENCLAW_CONFIG_DIR=/home/node/.openclaw \
                  node /app/dist/index.js models set "${PROVIDER}/${MODEL_ID}" 2>/dev/null || true
                echo "[init-config] Default model: ${PROVIDER}/${MODEL_ID}"
              fi

              # Restore gateway/agents/cron if models set clobbered them
              node -e "
                const fs = require('fs');
                const p = '/home/node/.openclaw/openclaw.json';
                const backup = JSON.parse(fs.readFileSync('/tmp/openclaw-backup.json','utf8'));
                let c = {};
                try { c = JSON.parse(fs.readFileSync(p,'utf8')); } catch(e) { c = {}; }
                if (!c.gateway || !c.gateway.mode) {
                  c.gateway = backup.gateway;
                  if (backup.agents) c.agents = backup.agents;
                  if (backup.cron) c.cron = backup.cron;
                  fs.writeFileSync(p, JSON.stringify(c,null,2));
                  console.error('[init-config] Restored gateway/agents/cron after models set.');
                }
              " 2>/dev/null || true

              if [ "${FIREWORKS_MODE}" = "true" ]; then
                node -e "
                  const fs = require('fs');
                  const p = '/home/node/.openclaw/openclaw.json';
                  const c = JSON.parse(fs.readFileSync(p,'utf8'));
                  if (!c.models) c.models = {};
                  if (!c.models.providers) c.models.providers = {};
                  if (!c.models.providers.openai) c.models.providers.openai = {};
                  c.models.providers.openai.baseUrl = 'https://api.fireworks.ai/inference/v1';
                  c.models.providers.openai.apiKey  = process.env.FIREWORKS_API_KEY;
                  fs.writeFileSync(p, JSON.stringify(c,null,2));
                " 2>/dev/null || true
              fi

              if [ -n "${OPENAI_API_BASE}" ]; then
                node -e "
                  const fs = require('fs');
                  const p = '/home/node/.openclaw/openclaw.json';
                  const c = JSON.parse(fs.readFileSync(p,'utf8'));
                  if (c.models && c.models.providers && c.models.providers.openai)
                    c.models.providers.openai.baseUrl = process.env.OPENAI_API_BASE;
                  fs.writeFileSync(p, JSON.stringify(c,null,2));
                " 2>/dev/null || true
              fi

              # Telegram
              if [ ${#TELEGRAM_BOT_TOKEN} -gt 10 ]; then
                node -e "
                  const fs = require('fs');
                  const p = '/home/node/.openclaw/openclaw.json';
                  const c = JSON.parse(fs.readFileSync(p,'utf8'));
                  c.channels = { telegram: { enabled: true, dmPolicy: 'open', allowFrom: ['*'], botToken: process.env.TELEGRAM_BOT_TOKEN } };
                  fs.writeFileSync(p, JSON.stringify(c,null,2));
                " 2>/dev/null || true
                echo "[init-config] Telegram configured."
              fi

              # Inject Plane connection into openclaw.json env section
              node -e "
                const fs = require('fs');
                const p = '/home/node/.openclaw/openclaw.json';
                const c = JSON.parse(fs.readFileSync(p,'utf8'));
                if (!c.env) c.env = {};
                c.env.PLANE_BASE_URL = 'http://{{ .Release.Name }}-api:8000';
                c.env.PLANE_WORKSPACE = process.env.PLANE_WORKSPACE_SLUG || 'my-team';
                c.env.PLANE_AGENT_TOKEN = process.env.PLANE_AGENT_TOKEN;
                if (process.env.SLACK_BOT_TOKEN) c.env.SLACK_BOT_TOKEN = process.env.SLACK_BOT_TOKEN;
                if (process.env.SLACK_STANDUP_CHANNEL) c.env.SLACK_STANDUP_CHANNEL = process.env.SLACK_STANDUP_CHANNEL;
                fs.writeFileSync(p, JSON.stringify(c,null,2));
                console.error('[init-config] Plane + Slack env injected into openclaw.json.');
              " 2>/dev/null || true

              # Copy AGENTS.md, identity files, and scripts
              cp /config/AGENTS.md /home/node/.openclaw/workspace/AGENTS.md
              for f in IDENTITY.md SOUL.md TOOLS.md BOOTSTRAP.md HEARTBEAT.md; do
                cp /config/$f /home/node/.openclaw/workspace/$f
              done
              [ -f /home/node/.openclaw/workspace/MEMORY.md ] || cp /config/MEMORY.md /home/node/.openclaw/workspace/MEMORY.md
              [ -f /home/node/.openclaw/workspace/USER.md ]   || cp /config/USER.md   /home/node/.openclaw/workspace/USER.md
              cp /config/plane.js /home/node/.openclaw/workspace/plane.js && chmod 755 /home/node/.openclaw/workspace/plane.js
              cp /config/slack.js /home/node/.openclaw/workspace/slack.js && chmod 755 /home/node/.openclaw/workspace/slack.js
              echo "[init-config] Identity files, AGENTS.md, plane.js, slack.js installed."

              # Init context.json if not exists
              node -e "
                const fs = require('fs');
                const cp = '/home/node/.openclaw/workspace/context.json';
                if (!fs.existsSync(cp)) {
                  fs.writeFileSync(cp, JSON.stringify({
                    activeProject: null, activeCycle: null, recentIssues: [], lastStandupAt: ''
                  }, null, 2));
                  console.error('[init-config] context.json initialized.');
                }
              " 2>/dev/null || true

              # exec-approvals
              node -e "
                const fs = require('fs');
                const p = '/home/node/.openclaw/exec-approvals.json';
                fs.writeFileSync(p, JSON.stringify({
                  version: 1,
                  agents: { pm: { allowlist: ['node /home/node/.openclaw/workspace/*.js *'] } },
                  allowlist: []
                }, null, 2));
                console.error('[init-config] exec-approvals.json written.');
              " 2>&1 || true

              # Rebuild memory index so memory search works on every fresh deploy.
              # Clears stale index metadata that accumulates when AI provider/model changes.
              HOME=/home/node OPENCLAW_CONFIG_DIR=/home/node/.openclaw \
                node /app/dist/index.js memory index --force 2>/dev/null || true
              echo "[init-config] Memory index rebuilt."

              echo "[init-config] All scripts ready."
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: OPENAI_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: GOOGLE_API_KEY
                  optional: true
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: GROQ_API_KEY
                  optional: true
            - name: FIREWORKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: FIREWORKS_API_KEY
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: PLANE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: PLANE_AGENT_TOKEN
            - name: PLANE_WORKSPACE_SLUG
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: PLANE_WORKSPACE_SLUG
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: SLACK_BOT_TOKEN
                  optional: true
            - name: OPENAI_API_BASE
              value: {{ .Values.openclaw.openaiApiBase | quote }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: config
              mountPath: /config

      containers:
        - name: gateway
          image: "{{ .Values.openclaw.image.repository }}:{{ .Values.openclaw.image.tag }}"
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command: ["node", "/app/dist/index.js", "gateway", "run"]
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
          env:
            - name: HOME
              value: /home/node
            - name: OPENCLAW_CONFIG_DIR
              value: /home/node/.openclaw
            - name: NODE_ENV
              value: production
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: OPENAI_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: GOOGLE_API_KEY
                  optional: true
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: GROQ_API_KEY
                  optional: true
            - name: FIREWORKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: FIREWORKS_API_KEY
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: SLACK_BOT_TOKEN
                  optional: true
            - name: PLANE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: PLANE_AGENT_TOKEN
            - name: PLANE_WORKSPACE
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: PLANE_WORKSPACE_SLUG
            - name: PLANE_BASE_URL
              value: "http://{{ .Release.Name }}-api:8000"
          livenessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 150
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.openclaw.resources | nindent 12 }}
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: tmp-volume
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false

        - name: ingress-patcher
          image: "{{ .Values.openclaw.image.repository }}:{{ .Values.openclaw.image.tag }}"
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command:
            - node
            - -e
            - |
              'use strict';
              const https = require('https');
              const fs   = require('fs');
              const token   = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/token', 'utf8').trim();
              const ns      = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/namespace', 'utf8').trim();
              const ca      = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/ca.crt');
              const ingress = 'ingress-{{ .Release.Name }}';
              const base    = '/apis/networking.k8s.io/v1/namespaces/' + ns + '/ingresses/' + ingress;
              const patch   = JSON.stringify({ metadata: { annotations: {
                'haproxy-ingress.github.io/timeout-tunnel':        '1h',
                'haproxy-ingress.github.io/health-check-interval': '0'
              }}});
              function apiCall(method, path, body) {
                return new Promise(resolve => {
                  const opts = { hostname: 'kubernetes.default.svc', path, method, ca,
                    headers: { Authorization: 'Bearer ' + token } };
                  if (body) { opts.headers['Content-Type'] = 'application/merge-patch+json';
                    opts.headers['Content-Length'] = Buffer.byteLength(body); }
                  const req = https.request(opts, res => { resolve(res.statusCode); res.resume(); });
                  req.on('error', () => resolve(0));
                  if (body) req.write(body);
                  req.end();
                });
              }
              async function run() {
                for (let i = 0; i < 24; i++) {
                  const status = await apiCall('GET', base, null);
                  if (status === 200) {
                    const patched = await apiCall('PATCH', base, patch);
                    console.log('[ingress-patcher] patched ' + ingress + ' -> HTTP ' + patched);
                    return;
                  }
                  console.log('[ingress-patcher] waiting for ingress (' + (i+1) + '/24)...');
                  await new Promise(r => setTimeout(r, 5000));
                }
                console.log('[ingress-patcher] ingress not found after 120s — skipping');
              }
              run().catch(e => console.error('[ingress-patcher]', e))
                   .finally(() => setInterval(() => {}, 2147483647));
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false

      volumes:
        - name: openclaw-home
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-openclaw-home
        - name: config
          configMap:
            name: {{ .Release.Name }}-openclaw-config
        - name: tmp-volume
          emptyDir: {}
