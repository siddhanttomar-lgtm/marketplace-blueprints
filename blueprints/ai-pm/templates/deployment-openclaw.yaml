apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-openclaw
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aipm.labels" . | nindent 4 }}
    app.kubernetes.io/component: openclaw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: openclaw
      annotations:
        checksum/credentials: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-ingress-patcher
      imagePullSecrets:
        - name: registry-pull-secret
      securityContext:
        fsGroup: 1000
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: fix-permissions
          image: "{{ .Values.openclaw.image.repository }}:{{ .Values.openclaw.image.tag }}"
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command: ["sh", "-c", "chown -R 1000:1000 /home/node/.openclaw && chmod 755 /home/node/.openclaw && echo '[fix-permissions] done'"]
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw

        - name: init-config
          image: "{{ .Values.openclaw.image.repository }}:{{ .Values.openclaw.image.tag }}"
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              cp /config/openclaw.json /home/node/.openclaw/openclaw.json
              mkdir -p /home/node/.openclaw/workspace
              cp /config/SKILL.md /home/node/.openclaw/workspace/SKILL.md
              echo "[init-config] Config and SKILL.md copied."

              # Point OpenClaw at the local TIR proxy (no external AI keys needed)
              node -e "
                const fs = require('fs');
                const p = '/home/node/.openclaw/openclaw.json';
                const c = JSON.parse(fs.readFileSync(p, 'utf8'));
                if (!c.models) c.models = {};
                if (!c.models.providers) c.models.providers = {};
                if (!c.models.providers.e2e) c.models.providers.e2e = {};
                c.models.providers.e2e.baseUrl = 'http://localhost:3000/v1';
                c.models.providers.e2e.apiKey  = 'e2e-proxy';
                fs.writeFileSync(p, JSON.stringify(c, null, 2));
                console.error('[init-config] Proxy baseUrl set to http://localhost:3000/v1');
              " 2>&1 || true

              # Pre-load E2E bearer token from secret if provided at deploy time.
              if [ ${#E2E_BEARER_TOKEN} -gt 10 ]; then
                printf '{"token":"%s","savedAt":"pre-loaded"}' "${E2E_BEARER_TOKEN}" > /home/node/.openclaw/e2e-token.json
                echo "[init-config] E2E bearer token pre-loaded from secret."
              fi

              # If a token was previously saved on the PVC, load it into openclaw.json
              if [ -f /home/node/.openclaw/e2e-token.json ]; then
                node -e "
                  const fs = require('fs');
                  const p = '/home/node/.openclaw/openclaw.json';
                  const tf = '/home/node/.openclaw/e2e-token.json';
                  try {
                    const token = JSON.parse(fs.readFileSync(tf,'utf8')).token || '';
                    if (!token) { console.error('[init-config] e2e-token.json has no token — skipping.'); process.exit(0); }
                    const parts = token.split('.');
                    if (parts.length === 3) {
                      const p2 = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
                      if (p2.exp && p2.exp < Math.floor(Date.now()/1000)) {
                        console.error('[init-config] Stored token expired — will prompt for new one.');
                        process.exit(0);
                      }
                    }
                    const c = JSON.parse(fs.readFileSync(p, 'utf8'));
                    c.models.providers.e2e.apiKey = token;
                    fs.writeFileSync(p, JSON.stringify(c, null, 2));
                    console.error('[init-config] E2E token loaded from PVC into openclaw.json');
                  } catch(e) { console.error('[init-config] Token load error:', e.message); }
                " 2>&1 || true
              fi

              # Telegram — SECURE by default (never open to the public internet).
              if printf '%s' "$TELEGRAM_BOT_TOKEN" | grep -qE '^[0-9]{6,}:[A-Za-z0-9_-]{30,}$'; then
                cp /config/tg-pairing-mcp.js /home/node/.openclaw/tg-pairing-mcp.js 2>/dev/null || true
                node -e "
                  const fs = require('fs');
                  const p = '/home/node/.openclaw/openclaw.json';
                  const c = JSON.parse(fs.readFileSync(p,'utf8'));
                  const ids = (process.env.TELEGRAM_ALLOWED_USER_IDS||'').split(',').map(s=>s.trim()).filter(Boolean);
                  c.channels = { telegram: {
                    enabled: true,
                    dmPolicy: ids.length ? 'allowlist' : 'pairing',
                    allowFrom: ids,
                    botToken: process.env.TELEGRAM_BOT_TOKEN
                  } };
                  if (!c.mcp) c.mcp = {};
                  if (!c.mcp.servers) c.mcp.servers = {};
                  c.mcp.servers['telegram-pairing'] = { command: 'node', args: ['/home/node/.openclaw/tg-pairing-mcp.js'] };
                  fs.writeFileSync(p, JSON.stringify(c,null,2));
                " 2>/dev/null || true
                if [ -n "$TELEGRAM_ALLOWED_USER_IDS" ]; then
                  echo "[init-config] Telegram: allowlist mode."
                else
                  echo "[init-config] Telegram: pairing mode."
                fi
              fi

              # Slack MCP server
              if printf '%s' "$SLACK_BOT_TOKEN" | grep -q '^xoxb-'; then
                node -e "
                  const fs = require('fs');
                  const p = '/home/node/.openclaw/openclaw.json';
                  const c = JSON.parse(fs.readFileSync(p,'utf8'));
                  if (!c.mcp) c.mcp = {};
                  if (!c.mcp.servers) c.mcp.servers = {};
                  c.mcp.servers.slack = {
                    command: 'npx',
                    args: ['-y', '@modelcontextprotocol/server-slack@2025.4.25'],
                    env: {
                      SLACK_BOT_TOKEN: process.env.SLACK_BOT_TOKEN,
                      SLACK_TEAM_ID: process.env.SLACK_TEAM_ID || ''
                    }
                  };
                  fs.writeFileSync(p, JSON.stringify(c,null,2));
                " 2>/dev/null || true
                echo "[init-config] Slack MCP server registered."
              fi

              # Disable vector memory search — no embedding provider configured
              node -e "
                const fs = require('fs');
                const p = '/home/node/.openclaw/openclaw.json';
                const c = JSON.parse(fs.readFileSync(p, 'utf8'));
                if (!c.agents) c.agents = {};
                if (!c.agents.defaults) c.agents.defaults = {};
                c.agents.defaults.memorySearch = { enabled: false };
                fs.writeFileSync(p, JSON.stringify(c, null, 2));
                console.error('[init-config] memorySearch disabled.');
              " 2>&1 || true

              # Copy identity files and scripts to workspace
              cp /config/AGENTS.md /home/node/.openclaw/workspace/AGENTS.md
              for f in IDENTITY.md SOUL.md TOOLS.md BOOTSTRAP.md HEARTBEAT.md; do
                cp /config/$f /home/node/.openclaw/workspace/$f
              done
              [ -f /home/node/.openclaw/workspace/MEMORY.md ] || cp /config/MEMORY.md /home/node/.openclaw/workspace/MEMORY.md
              [ -f /home/node/.openclaw/workspace/USER.md ]   || cp /config/USER.md   /home/node/.openclaw/workspace/USER.md
              cp /config/zoho-sprints.js /home/node/.openclaw/workspace/zoho-sprints.js && chmod 755 /home/node/.openclaw/workspace/zoho-sprints.js
              echo "[init-config] Identity files, AGENTS.md, zoho-sprints.js installed."

              # Init context.json if not exists
              node -e "
                const fs = require('fs');
                const cp = '/home/node/.openclaw/workspace/context.json';
                if (!fs.existsSync(cp)) {
                  fs.writeFileSync(cp, JSON.stringify({
                    activeProject: null, activeCycle: null, recentIssues: [], lastStandupAt: ''
                  }, null, 2));
                  console.error('[init-config] context.json initialized.');
                }
              " 2>/dev/null || true

              # exec-approvals
              node -e "
                const fs = require('fs');
                const p = '/home/node/.openclaw/exec-approvals.json';
                fs.writeFileSync(p, JSON.stringify({
                  version: 1,
                  agents: { pm: { allowlist: ['node /home/node/.openclaw/workspace/*.js *'] } },
                  allowlist: []
                }, null, 2));
                console.error('[init-config] exec-approvals.json written.');
              " 2>&1 || true

              # Write Zoho credentials to PVC if provided via env (env vars take precedence;
              # if blank, any values previously saved via chat are preserved).
              node -e "
                const fs = require('fs');
                const p = '/home/node/.openclaw/zoho-credentials.json';
                const id  = process.env.ZOHO_CLIENT_ID     || '';
                const sec = process.env.ZOHO_CLIENT_SECRET || '';
                const tok = process.env.ZOHO_REFRESH_TOKEN || '';
                const wid = process.env.ZOHO_WORKSPACE_ID  || '';
                if (!id && !sec && !tok && !wid) {
                  console.error('[init-config] No Zoho creds in env — PVC file unchanged.');
                  process.exit(0);
                }
                let existing = {};
                try { existing = JSON.parse(fs.readFileSync(p,'utf8')); } catch(e) {}
                const merged = {
                  clientId:     id  || existing.clientId     || '',
                  clientSecret: sec || existing.clientSecret || '',
                  refreshToken: tok || existing.refreshToken || '',
                  workspaceId:  wid || existing.workspaceId  || '',
                  savedAt: new Date().toISOString()
                };
                fs.writeFileSync(p, JSON.stringify(merged,null,2));
                console.error('[init-config] Zoho credentials saved to PVC.');
              " 2>&1 || true

              echo "[init-config] All scripts ready."
          env:
            - name: E2E_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: E2E_BEARER_TOKEN
                  optional: true
            - name: ZOHO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: ZOHO_CLIENT_ID
                  optional: true
            - name: ZOHO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: ZOHO_CLIENT_SECRET
                  optional: true
            - name: ZOHO_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: ZOHO_REFRESH_TOKEN
                  optional: true
            - name: ZOHO_WORKSPACE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: ZOHO_WORKSPACE_ID
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: TELEGRAM_CHAT_ID
                  optional: true
            - name: TELEGRAM_ALLOWED_USER_IDS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: TELEGRAM_ALLOWED_USER_IDS
                  optional: true
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: SLACK_BOT_TOKEN
                  optional: true
            - name: SLACK_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: SLACK_TEAM_ID
                  optional: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: config
              mountPath: /config

      containers:
        - name: gateway
          image: "{{ .Values.openclaw.image.repository }}:{{ .Values.openclaw.image.tag }}"
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command: ["node", "/app/dist/index.js", "gateway", "run"]
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
          env:
            - name: HOME
              value: /home/node
            - name: OPENCLAW_CONFIG_DIR
              value: /home/node/.openclaw
            - name: NODE_ENV
              value: production
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: ZOHO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: ZOHO_CLIENT_ID
                  optional: true
            - name: ZOHO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: ZOHO_CLIENT_SECRET
                  optional: true
            - name: ZOHO_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: ZOHO_REFRESH_TOKEN
                  optional: true
            - name: ZOHO_WORKSPACE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: ZOHO_WORKSPACE_ID
                  optional: true
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: SLACK_BOT_TOKEN
                  optional: true
            - name: SLACK_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: SLACK_TEAM_ID
                  optional: true
            - name: SLACK_STANDUP_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: SLACK_STANDUP_CHANNEL
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: TELEGRAM_CHAT_ID
                  optional: true
            - name: TELEGRAM_ALLOWED_USER_IDS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: TELEGRAM_ALLOWED_USER_IDS
                  optional: true
            - name: STAKEHOLDER_EMAILS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: STAKEHOLDER_EMAILS
                  optional: true
          livenessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 150
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.openclaw.resources | nindent 12 }}
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: tmp-volume
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false

        - name: e2e-setup-proxy
          image: "{{ .Values.openclaw.image.repository }}:{{ .Values.openclaw.image.tag }}"
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command: ["node", "/config/e2e-setup-proxy.js"]
          ports:
            - name: proxy
              containerPort: 3000
              protocol: TCP
          env:
            - name: E2E_PROJECT_NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: E2E_PROJECT_NAMESPACE
                  optional: true
            - name: E2E_MODEL_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: E2E_MODEL_NAME
                  optional: true
            - name: E2E_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: E2E_BEARER_TOKEN
                  optional: true
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: config
              mountPath: /config
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false

        - name: ingress-patcher
          image: "{{ .Values.openclaw.image.repository }}:{{ .Values.openclaw.image.tag }}"
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command:
            - node
            - -e
            - |
              'use strict';
              const https = require('https');
              const fs   = require('fs');
              const token   = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/token', 'utf8').trim();
              const ns      = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/namespace', 'utf8').trim();
              const ca      = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/ca.crt');
              const ingress = 'ingress-{{ .Release.Name }}';
              const base    = '/apis/networking.k8s.io/v1/namespaces/' + ns + '/ingresses/' + ingress;
              const patch   = JSON.stringify({ metadata: { annotations: {
                'haproxy-ingress.github.io/timeout-tunnel':        '1h',
                'haproxy-ingress.github.io/health-check-interval': '0'
              }}});
              function apiCall(method, path, body) {
                return new Promise(resolve => {
                  const opts = { hostname: 'kubernetes.default.svc', path, method, ca,
                    headers: { Authorization: 'Bearer ' + token } };
                  if (body) { opts.headers['Content-Type'] = 'application/merge-patch+json';
                    opts.headers['Content-Length'] = Buffer.byteLength(body); }
                  const req = https.request(opts, res => { resolve(res.statusCode); res.resume(); });
                  req.on('error', () => resolve(0));
                  if (body) req.write(body);
                  req.end();
                });
              }
              async function run() {
                for (let i = 0; i < 24; i++) {
                  const status = await apiCall('GET', base, null);
                  if (status === 200) {
                    const patched = await apiCall('PATCH', base, patch);
                    console.log('[ingress-patcher] patched ' + ingress + ' -> HTTP ' + patched);
                    return;
                  }
                  console.log('[ingress-patcher] waiting for ingress (' + (i+1) + '/24)...');
                  await new Promise(r => setTimeout(r, 5000));
                }
                console.log('[ingress-patcher] ingress not found after 120s — skipping');
              }
              run().catch(e => console.error('[ingress-patcher]', e))
                   .finally(() => setInterval(() => {}, 2147483647));
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false

      volumes:
        - name: openclaw-home
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-openclaw-home
        - name: config
          configMap:
            name: {{ .Release.Name }}-openclaw-config
        - name: tmp-volume
          emptyDir: {}
