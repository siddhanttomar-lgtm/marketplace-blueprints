# Prometheus — example values
# helm install prometheus blueprints/prometheus -f my-values.yaml

imagePullSecrets: []

server:
  service:
    type: NodePort
  persistentVolume:
    enabled: true
    size: 8Gi
    storageClass: ""
  retention: "15d"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

# Disable pushgateway if not needed (avoids imagePullSecrets errors on managed clusters)
prometheus-pushgateway:
  enabled: false

prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
