global:
  imagePullSecrets:
    - registry-pull-secret
  security:
    allowInsecureImages: true

keycloak:
  production: true
  proxyHeaders: xforwarded

  service:
    type: ClusterIP

  image:
    registry: registry.e2enetworks.net
    repository: marketplace-blueprint/keycloak
    tag: 26.3.3-debian-12-r0
    pullPolicy: IfNotPresent

  keycloakConfigCli:
    image:
      registry: registry.e2enetworks.net
      repository: marketplace-blueprint/keycloak-config-cli
      tag: 6.4.0-debian-12-r11
      pullPolicy: IfNotPresent

  volumePermissions:
    image:
      registry: registry.e2enetworks.net
      repository: marketplace-blueprint/os-shell
      tag: 12-debian-12-r65
      pullPolicy: IfNotPresent

  postgresql:
    image:
      registry: registry.e2enetworks.net
      repository: marketplace-blueprint/postgresql
      tag: 17.6.0-debian-12-r0
      pullPolicy: IfNotPresent
    metrics:
      image:
        registry: registry.e2enetworks.net
        repository: marketplace-blueprint/postgres-exporter
        tag: 0.17.1-debian-12-r15
        pullPolicy: IfNotPresent
    volumePermissions:
      image:
        registry: registry.e2enetworks.net
        repository: marketplace-blueprint/os-shell
        tag: 12-debian-12-r65
        pullPolicy: IfNotPresent

  # Disable default HTTP readiness probe — port 8080 binds early but HTTP
  # responses take ~130s (JVM + DB migrations). TCP probe on 8080 passes at
  # ~30–40s from pod start, well within the platform's 120s timeout.
  # NOTE: must be YAML boolean false, NOT the string "false" (string is truthy
  # in Go templates and would leave the default HTTP probe active).
  readinessProbe:
    enabled: false

  customReadinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 9
    successThreshold: 1

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1500Mi
