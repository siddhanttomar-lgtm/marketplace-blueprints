{{/* Primary service — name matches release name so platform ingress routes here */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aaa.labels" . | nindent 4 }}
    app.kubernetes.io/component: openclaw
spec:
  type: NodePort
  selector:
    {{- include "aaa.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "openclaw") | nindent 4 }}
  ports:
    - name: gateway
      port: 18789
      targetPort: 18789
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aaa.openclawHost" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aaa.labels" . | nindent 4 }}
    app.kubernetes.io/component: openclaw
spec:
  type: NodePort
  selector:
    {{- include "aaa.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "openclaw") | nindent 4 }}
  ports:
    - name: gateway
      port: 18789
      targetPort: 18789
      protocol: TCP
{{- if and .Values.zoho.clientId .Values.zoho.clientSecret .Values.zoho.refreshToken }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aaa.pagesenseMcpHost" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aaa.labels" . | nindent 4 }}
    app.kubernetes.io/component: pagesense-mcp
spec:
  type: ClusterIP
  selector:
    {{- include "aaa.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "pagesense-mcp") | nindent 4 }}
  ports:
    - name: http
      port: 3334
      targetPort: 3334
      protocol: TCP
{{- end }}
