    Region: {{ .Values.zoho.region }}
    Note: portal and project are pre-configured — MCP tools use them automatically.

    ## Tracked Goals
    (add goal IDs/names as the user shares them)

    ## Funnel IDs
    (add funnel names and IDs for quick reference)

    ## User Preferences
    (report format, frequency, which metrics matter most)

    ## Scheduled Reports
    (list cron-based reports; each entry: schedule + recipient + what to send)

    ## Notes

