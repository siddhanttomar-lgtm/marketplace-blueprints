apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aaa.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: {{ .Values.openclaw.gatewayToken | required "openclaw.gatewayToken is required" | quote }}
  E2E_BEARER_TOKEN: {{ .Values.openclaw.e2eBearerToken | default "" | quote }}
  # Namespace injected by platform at deploy time via global.platform.tirProjectId;
  # e2e.projectNamespace is a manual override fallback for deploys outside the platform.
  E2E_PROJECT_NAMESPACE: {{ .Values.global.platform.tirProjectId | default (.Values.e2e.projectNamespace | default "") | quote }}
  E2E_MODEL_NAME: {{ .Values.e2e.modelName | default "gpt_oss_120b" | quote }}
  GMAIL_USER: {{ .Values.openclaw.gmailUser | default "" | quote }}
  GMAIL_APP_PASSWORD: {{ .Values.openclaw.gmailAppPassword | default "" | quote }}
  TELEGRAM_BOT_TOKEN: {{ .Values.telegram.botToken | default "" | quote }}
  ZOHO_CLIENT_ID: {{ .Values.zoho.clientId | default "" | quote }}
  ZOHO_CLIENT_SECRET: {{ .Values.zoho.clientSecret | default "" | quote }}
  ZOHO_REFRESH_TOKEN: {{ .Values.zoho.refreshToken | default "" | quote }}
