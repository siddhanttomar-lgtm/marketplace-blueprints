# Nginx — main service exposed to users (landing page + reverse proxy)
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pb.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
# Grafana — internal service (accessed via Nginx proxy at /grafana/)
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grafana-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pb.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
---
# Prometheus — internal service (accessed via Nginx proxy at /prometheus/)
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pb.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
---
# Blackbox — internal only
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-blackbox
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pb.labels" . | nindent 4 }}
    app.kubernetes.io/component: blackbox
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: blackbox
  ports:
    - name: http
      port: 9115
      targetPort: 9115
      protocol: TCP
