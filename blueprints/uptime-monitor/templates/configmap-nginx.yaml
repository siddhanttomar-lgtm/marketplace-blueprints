apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pb.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      server {
        listen 80;

        location = / {
          root /usr/share/nginx/html;
          index index.html;
        }
        location = /index.html {
          root /usr/share/nginx/html;
        }

        location /grafana/ {
          proxy_pass http://{{ .Release.Name }}-grafana-internal:3000/grafana/;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
        }

        # Blackbox probe endpoint — routes via Nginx so target URLs are externally accessible
        location /probe {
          proxy_pass http://{{ .Release.Name }}-blackbox:9115/probe;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
        }

        location /prometheus/ {
          proxy_pass http://{{ .Release.Name }}-prometheus-internal:9090/prometheus/;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page 404 502 503 504 /error.html;
        location = /error.html {
          root /usr/share/nginx/html;
          internal;
        }
      }
    }

  error.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Not Accessible</title>
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          background: #0f1117;
          color: #c9d1d9;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 32px 16px;
          text-align: center;
        }
        .code {
          font-size: 72px;
          font-weight: 700;
          color: #21262d;
          line-height: 1;
          margin-bottom: 16px;
        }
        h1 {
          font-size: 20px;
          font-weight: 600;
          color: #f0f6fc;
          margin-bottom: 10px;
        }
        p {
          font-size: 14px;
          color: #6e7681;
          max-width: 420px;
          line-height: 1.6;
          margin-bottom: 32px;
        }
        a {
          display: inline-block;
          padding: 10px 20px;
          background: #161b22;
          border: 1px solid #21262d;
          border-radius: 8px;
          color: #388bfd;
          text-decoration: none;
          font-size: 14px;
          transition: border-color 0.15s;
        }
        a:hover { border-color: #388bfd; }
      </style>
    </head>
    <body>
      <div class="code">—</div>
      <h1>Monitoring Agent</h1>
      <p>
        This endpoint runs inside your monitoring infrastructure and
        collects data in the background. No action needed.
      </p>
      <a href="/">Go to Dashboard</a>
    </body>
    </html>

  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Website Monitor</title>
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
          background: #0f1117;
          color: #c9d1d9;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 32px 16px;
        }

        .brand {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 8px;
        }

        .brand-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #3fb950;
          box-shadow: 0 0 8px #3fb950aa;
        }

        .brand-name {
          font-size: 13px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #8b949e;
        }

        h1 {
          font-size: 30px;
          font-weight: 700;
          color: #f0f6fc;
          margin-bottom: 10px;
          text-align: center;
          letter-spacing: -0.5px;
        }

        .subtitle {
          font-size: 14px;
          color: #6e7681;
          text-align: center;
          margin-bottom: 48px;
          max-width: 380px;
          line-height: 1.6;
        }

        .cards {
          display: flex;
          gap: 16px;
          flex-wrap: wrap;
          justify-content: center;
          max-width: 680px;
          width: 100%;
        }

        .card {
          background: #161b22;
          border: 1px solid #21262d;
          border-radius: 10px;
          padding: 28px 24px;
          width: 300px;
          text-decoration: none;
          color: inherit;
          transition: border-color 0.15s ease, background 0.15s ease;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }

        .card:hover {
          border-color: #388bfd;
          background: #1c2128;
        }

        .card-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
        }

        .card-label {
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          padding: 2px 8px;
          border-radius: 4px;
        }

        .label-grafana {
          background: #1e2d1a;
          color: #f46800;
          border: 1px solid #2d3d1e;
        }

        .label-prometheus {
          background: #1e1f2e;
          color: #e6522c;
          border: 1px solid #2e2e3e;
        }

        .card-arrow {
          color: #6e7681;
          font-size: 16px;
          transition: color 0.15s, transform 0.15s;
        }

        .card:hover .card-arrow {
          color: #388bfd;
          transform: translateX(3px);
        }

        .card h2 {
          font-size: 16px;
          font-weight: 600;
          color: #f0f6fc;
          line-height: 1.3;
        }

        .card p {
          font-size: 13px;
          color: #6e7681;
          line-height: 1.6;
        }

        .footer {
          margin-top: 48px;
          font-size: 12px;
          color: #3d444d;
          text-align: center;
        }
      </style>
    </head>
    <body>
      <div class="brand">
        <div class="brand-dot"></div>
        <span class="brand-name">Monitoring</span>
      </div>

      <h1>Website Monitor</h1>
      <p class="subtitle">
        Real-time uptime, response time, and SSL monitoring for your websites.
      </p>

      <div class="cards">
        <a class="card" id="grafana-link" href="#" target="_blank">
          <div class="card-header">
            <span class="card-label label-grafana">Dashboard</span>
            <span class="card-arrow">&#8594;</span>
          </div>
          <h2>Grafana</h2>
          <p>Visual dashboards with uptime history, response time charts, SSL expiry, and HTTP status codes.</p>
        </a>

        <a class="card" id="prometheus-link" href="#" target="_blank">
          <div class="card-header">
            <span class="card-label label-prometheus">Query Engine</span>
            <span class="card-arrow">&#8594;</span>
          </div>
          <h2>Prometheus</h2>
          <p>Run custom metric queries, explore raw data, and build advanced expressions using PromQL.</p>
        </a>
      </div>

      <div class="footer">Powered by Prometheus &amp; Grafana &mdash; deployed on E2E Cloud</div>

      <script>
        var b = window.location.origin;
        document.getElementById('grafana-link').href = b + '/grafana/';
        document.getElementById('prometheus-link').href = b + '/prometheus/graph';
      </script>
    </body>
    </html>
