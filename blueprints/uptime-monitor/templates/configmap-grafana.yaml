apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pb.labels" . | nindent 4 }}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ .Release.Name }}-prometheus-internal:9090/prometheus
        isDefault: true
        editable: false

  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards

  website-monitor.json: |
    {
      "title": "Website Monitor",
      "uid": "website-monitor",
      "refresh": "30s",
      "time": { "from": "now-24h", "to": "now" },
      "timezone": "browser",
      "panels": [
        {
          "id": 1, "type": "stat", "gridPos": {"x":0,"y":0,"w":6,"h":4},
          "title": "Site Status",
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "text": {"valueSize": 32}
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {"type":"value","options":{"0":{"text":"DOWN","color":"red","index":0},"1":{"text":"UP","color":"green","index":1}}}
              ],
              "thresholds": {"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":1}]},
              "color": {"mode":"thresholds"}
            }
          },
          "targets": [{"expr":"probe_success","legendFormat":"{{"{{"}}instance{{"}}"}}","datasource":{"type":"prometheus","uid":"${datasource}"}}],
          "datasource": {"type":"prometheus","uid":"${datasource}"}
        },
        {
          "id": 2, "type": "stat", "gridPos": {"x":6,"y":0,"w":6,"h":4},
          "title": "Uptime (7 days)",
          "options": {
            "reduceOptions": {"calcs": ["mean"]},
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {"mode":"absolute","steps":[{"color":"red","value":null},{"color":"orange","value":0.95},{"color":"green","value":0.99}]},
              "color": {"mode":"thresholds"}
            }
          },
          "targets": [{"expr":"avg_over_time(probe_success[7d])","legendFormat":"{{"{{"}}instance{{"}}"}}","datasource":{"type":"prometheus","uid":"${datasource}"}}],
          "datasource": {"type":"prometheus","uid":"${datasource}"}
        },
        {
          "id": 3, "type": "stat", "gridPos": {"x":12,"y":0,"w":6,"h":4},
          "title": "Response Time",
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":1},{"color":"red","value":3}]},
              "color": {"mode":"thresholds"}
            }
          },
          "targets": [{"expr":"probe_duration_seconds","legendFormat":"{{"{{"}}instance{{"}}"}}","datasource":{"type":"prometheus","uid":"${datasource}"}}],
          "datasource": {"type":"prometheus","uid":"${datasource}"}
        },
        {
          "id": 4, "type": "stat", "gridPos": {"x":18,"y":0,"w":6,"h":4},
          "title": "SSL Certificate Expiry",
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "thresholds": {"mode":"absolute","steps":[{"color":"red","value":null},{"color":"orange","value":14},{"color":"green","value":30}]},
              "color": {"mode":"thresholds"},
              "decimals": 0
            }
          },
          "targets": [{"expr":"(probe_ssl_earliest_cert_expiry - time()) / 86400","legendFormat":"{{"{{"}}instance{{"}}"}}","datasource":{"type":"prometheus","uid":"${datasource}"}}],
          "datasource": {"type":"prometheus","uid":"${datasource}"}
        },
        {
          "id": 5, "type": "timeseries", "gridPos": {"x":0,"y":4,"w":24,"h":8},
          "title": "Response Time Over Time",
          "options": {"tooltip": {"mode":"multi"}},
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {"lineWidth":2,"fillOpacity":10},
              "thresholds": {"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":1},{"color":"red","value":3}]},
              "color": {"mode":"palette-classic"}
            }
          },
          "targets": [{"expr":"probe_duration_seconds","legendFormat":"{{"{{"}}instance{{"}}"}}","datasource":{"type":"prometheus","uid":"${datasource}"}}],
          "datasource": {"type":"prometheus","uid":"${datasource}"}
        },
        {
          "id": 6, "type": "timeseries", "gridPos": {"x":0,"y":12,"w":24,"h":8},
          "title": "Uptime History (1 = UP, 0 = DOWN)",
          "options": {"tooltip": {"mode":"multi"}},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0, "max": 1,
              "custom": {"lineWidth":2,"fillOpacity":20},
              "mappings": [{"type":"value","options":{"0":{"text":"DOWN"},"1":{"text":"UP"}}}],
              "color": {"mode":"palette-classic"}
            }
          },
          "targets": [{"expr":"probe_success","legendFormat":"{{"{{"}}instance{{"}}"}}","datasource":{"type":"prometheus","uid":"${datasource}"}}],
          "datasource": {"type":"prometheus","uid":"${datasource}"}
        },
        {
          "id": 7, "type": "stat", "gridPos": {"x":0,"y":20,"w":8,"h":4},
          "title": "HTTP Status Code",
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":200},{"color":"orange","value":400},{"color":"red","value":500}]},
              "color": {"mode":"thresholds"}
            }
          },
          "targets": [{"expr":"probe_http_status_code","legendFormat":"{{"{{"}}instance{{"}}"}}","datasource":{"type":"prometheus","uid":"${datasource}"}}],
          "datasource": {"type":"prometheus","uid":"${datasource}"}
        },
        {
          "id": 8, "type": "stat", "gridPos": {"x":8,"y":20,"w":8,"h":4},
          "title": "DNS Lookup Time",
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":0.5},{"color":"red","value":1}]},
              "color": {"mode":"thresholds"}
            }
          },
          "targets": [{"expr":"probe_dns_lookup_time_seconds","legendFormat":"{{"{{"}}instance{{"}}"}}","datasource":{"type":"prometheus","uid":"${datasource}"}}],
          "datasource": {"type":"prometheus","uid":"${datasource}"}
        },
        {
          "id": 9, "type": "stat", "gridPos": {"x":16,"y":20,"w":8,"h":4},
          "title": "TLS Handshake Time",
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":0.5},{"color":"red","value":1}]},
              "color": {"mode":"thresholds"}
            }
          },
          "targets": [{"expr":"probe_tls_version_info","legendFormat":"{{"{{"}}instance{{"}}"}} ({{"{{"}}version{{"}}"}})","datasource":{"type":"prometheus","uid":"${datasource}"}}],
          "datasource": {"type":"prometheus","uid":"${datasource}"}
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "hide": 2,
            "current": {"selected": true, "text": "Prometheus", "value": "Prometheus"}
          }
        ]
      },
      "schemaVersion": 38,
      "version": 1
    }
