{{/* Twenty Server */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-twenty
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b2b-sdr.labels" . | nindent 4 }}
    app.kubernetes.io/component: twenty
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "b2b-sdr.selectorLabels" (dict "release" .Release.Name "component" "twenty") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "b2b-sdr.selectorLabels" (dict "release" .Release.Name "component" "twenty") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Wait for Postgres to be accepting connections before Twenty tries to migrate.
        - name: wait-for-postgres
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              until nc -z {{ .Release.Name }}-postgres 5432; do
                echo "Waiting for postgres..."; sleep 3;
              done
              echo "Postgres ready."
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: twenty-server
          image: {{ .Values.twenty.image.repository }}:{{ .Values.twenty.image.tag }}
          imagePullPolicy: {{ .Values.twenty.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: TWENTY_PG_DSN
            - name: REDIS_URL
              value: redis://{{ .Release.Name }}-redis:6379
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: TWENTY_APP_SECRET
            {{- if .Values.twenty.serverUrl }}
            - name: SERVER_URL
              value: {{ .Values.twenty.serverUrl | quote }}
            {{- else }}
            # Fallback to internal service URL — external email/webhook links won't work
            # until SERVER_URL is updated to the actual public hostname post-deploy.
            - name: SERVER_URL
              value: {{ include "b2b-sdr.twentyInternalUrl" . | quote }}
            {{- end }}
            - name: ENABLE_DB_MIGRATIONS_ON_STARTUP
              value: "true"
            - name: IS_CONFIG_VARIABLES_IN_DB_ENABLED
              value: "false"
            - name: STORAGE_TYPE
              value: local
            - name: STORAGE_LOCAL_PATH
              value: /app/.local-storage
          resources:
            {{- toYaml .Values.twenty.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 300
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: local-storage
              mountPath: /app/.local-storage
      volumes:
        - name: local-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-twenty-storage
---
{{/* Twenty Worker — background job processor */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-twenty-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b2b-sdr.labels" . | nindent 4 }}
    app.kubernetes.io/component: twenty-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "b2b-sdr.selectorLabels" (dict "release" .Release.Name "component" "twenty-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "b2b-sdr.selectorLabels" (dict "release" .Release.Name "component" "twenty-worker") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Wait for Twenty server to pass /healthz before starting the worker.
        - name: wait-for-twenty
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              until wget -qO- http://{{ .Release.Name }}-twenty:3000/healthz >/dev/null 2>&1; do
                echo "Waiting for Twenty server..."; sleep 5;
              done
              echo "Twenty server ready."
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: twenty-worker
          image: {{ .Values.twenty.image.repository }}:{{ .Values.twenty.image.tag }}
          imagePullPolicy: {{ .Values.twenty.image.pullPolicy }}
          command: ["yarn", "worker:prod"]
          env:
            - name: NODE_ENV
              value: production
            - name: PG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: TWENTY_PG_DSN
            - name: REDIS_URL
              value: redis://{{ .Release.Name }}-redis:6379
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: TWENTY_APP_SECRET
            - name: IS_CONFIG_VARIABLES_IN_DB_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
