apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-searxng-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b2b-sdr.labels" . | nindent 4 }}
data:
  settings.yml: |
    use_default_settings: true

    server:
      secret_key: "{{ .Release.Name }}-searxng-secret"
      bind_address: "0.0.0.0:8080"
      limiter: false
      image_proxy: false

    search:
      # json format MUST be enabled — OpenClaw parses JSON responses only.
      # Without this, all web_search tool calls return "fetch failed".
      formats:
        - html
        - json
      safe_search: 0
      autocomplete: ""
      default_lang: "en"

    outgoing:
      request_timeout: 10.0
      max_request_timeout: 15.0
      retries: 1
