{{/* Primary service — name matches release name so platform ingress routes here */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b2b-sdr.labels" . | nindent 4 }}
    app.kubernetes.io/component: openclaw
spec:
  type: ClusterIP
  selector:
    {{- include "b2b-sdr.selectorLabels" (dict "release" .Release.Name "component" "openclaw") | nindent 4 }}
  ports:
    - name: gateway
      port: 18789
      targetPort: 18789
      protocol: TCP
---
{{/* OpenClaw — NodePort, primary ingress for marketplace platform */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-openclaw
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b2b-sdr.labels" . | nindent 4 }}
    app.kubernetes.io/component: openclaw
spec:
  type: NodePort
  selector:
    {{- include "b2b-sdr.selectorLabels" (dict "release" .Release.Name "component" "openclaw") | nindent 4 }}
  ports:
    - name: gateway
      port: 18789
      targetPort: 18789
      protocol: TCP
---
{{/* Twenty CRM — NodePort so users can access the CRM UI */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-twenty
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b2b-sdr.labels" . | nindent 4 }}
    app.kubernetes.io/component: twenty
spec:
  type: NodePort
  selector:
    {{- include "b2b-sdr.selectorLabels" (dict "release" .Release.Name "component" "twenty") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
---
{{/* Postgres — ClusterIP only, internal to cluster */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b2b-sdr.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "b2b-sdr.selectorLabels" (dict "release" .Release.Name "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
{{/* Redis — ClusterIP only, internal to cluster */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b2b-sdr.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    {{- include "b2b-sdr.selectorLabels" (dict "release" .Release.Name "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
{{/* SearXNG — ClusterIP only, internal to OpenClaw */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-searxng-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b2b-sdr.labels" . | nindent 4 }}
    app.kubernetes.io/component: searxng
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: searxng
  ports:
    - name: searxng
      port: 8080
      targetPort: 8080
      protocol: TCP
