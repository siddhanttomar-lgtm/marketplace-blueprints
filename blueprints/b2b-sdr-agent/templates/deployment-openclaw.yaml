apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-openclaw
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b2b-sdr.labels" . | nindent 4 }}
    app.kubernetes.io/component: openclaw
spec:
  replicas: 1
  # Recreate is MANDATORY — RollingUpdate holds the ReadWriteOnce PVC and hangs the new pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "b2b-sdr.selectorLabels" (dict "release" .Release.Name "component" "openclaw") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "b2b-sdr.selectorLabels" (dict "release" .Release.Name "component" "openclaw") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}-openclaw-patcher
      imagePullSecrets:
        - name: registry-pull-secret
      securityContext:
        fsGroup: 1000
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Fix PVC root ownership so uid 1000 (gateway) can chmod it.
        # OpenClaw's exec tool calls chmod(OPENCLAW_CONFIG_DIR) on every exec — fails with EPERM
        # when the directory is root-owned (default PVC mount ownership).
        - name: fix-permissions
          image: {{ .Values.openclaw.image.repository }}:{{ .Values.openclaw.image.tag }}
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command: ["sh", "-c", "chown -R 1000:1000 /home/node/.openclaw && chmod 755 /home/node/.openclaw && echo '[fix-permissions] done'"]
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw

        # Copy config files, set active model, inject channels.telegram + baseUrl if provided.
        - name: init-config
          image: {{ .Values.openclaw.image.repository }}:{{ .Values.openclaw.image.tag }}
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              cp /config/openclaw.json /home/node/.openclaw/openclaw.json
              mkdir -p /home/node/.openclaw/workspace
              cp /config/AGENTS.md /home/node/.openclaw/workspace/AGENTS.md
              cp /config/SOUL.md /home/node/.openclaw/workspace/SOUL.md
              cp /config/BOOTSTRAP.md /home/node/.openclaw/workspace/BOOTSTRAP.md
              echo "[init-config] Config files copied."

              # Select provider from whichever native API key the buyer provided.
              # >30 chars filters out platform-injected placeholder values.
              if [ ${#ANTHROPIC_API_KEY} -gt 30 ]; then
                PROVIDER="anthropic"
                MODEL_ID="claude-sonnet-4-5"
              elif [ ${#OPENAI_API_KEY} -gt 30 ]; then
                PROVIDER="openai"
                MODEL_ID="gpt-4o-mini"
              elif [ ${#GOOGLE_API_KEY} -gt 20 ]; then
                PROVIDER="google"
                MODEL_ID="gemini-2.0-flash"
              elif [ ${#GROQ_API_KEY} -gt 30 ]; then
                PROVIDER="groq"
                MODEL_ID="qwen-qwq-32b"
              elif [ ${#FIREWORKS_API_KEY} -gt 10 ]; then
                PROVIDER="openai"
                MODEL_ID="accounts/fireworks/models/deepseek-v4-pro"
                FIREWORKS_MODE="true"
              else
                echo "[init-config] WARNING: no valid API key found — set at least one API key to use the agent."
                PROVIDER=""
                MODEL_ID=""
              fi

              # Set active model only if a key was found.
              if [ -n "$PROVIDER" ] && [ -n "$MODEL_ID" ]; then
                HOME=/home/node OPENCLAW_CONFIG_DIR=/home/node/.openclaw \
                  node /app/dist/index.js models set "${PROVIDER}/${MODEL_ID}" 2>/dev/null || true
                echo "[init-config] Default model: ${PROVIDER}/${MODEL_ID}"
              fi

              # If Fireworks key detected: inject baseUrl + apiKey so gateway uses Fireworks endpoint.
              if [ "${FIREWORKS_MODE}" = "true" ]; then
                node -e "
                  const fs = require('fs');
                  const p = '/home/node/.openclaw/openclaw.json';
                  const c = JSON.parse(fs.readFileSync(p,'utf8'));
                  if (!c.models) c.models = {};
                  if (!c.models.providers) c.models.providers = {};
                  if (!c.models.providers.openai) c.models.providers.openai = {};
                  c.models.providers.openai.baseUrl = 'https://api.fireworks.ai/inference/v1';
                  c.models.providers.openai.apiKey  = process.env.FIREWORKS_API_KEY;
                  fs.writeFileSync(p, JSON.stringify(c,null,2));
                " 2>/dev/null || true
                echo "[init-config] Fireworks mode: baseUrl + apiKey injected, model=${MODEL_ID}"
              fi

              # Inject custom OpenAI-compatible baseUrl if provided (e.g. Fireworks, Together AI).
              if [ -n "${OPENAI_API_BASE}" ]; then
                node -e "
                  const fs = require('fs');
                  const p = '/home/node/.openclaw/openclaw.json';
                  const c = JSON.parse(fs.readFileSync(p,'utf8'));
                  if (c.models && c.models.providers && c.models.providers.openai)
                    c.models.providers.openai.baseUrl = process.env.OPENAI_API_BASE;
                  fs.writeFileSync(p, JSON.stringify(c,null,2));
                " 2>/dev/null || true
                echo "[init-config] Custom OpenAI baseUrl set: ${OPENAI_API_BASE}"
              fi

              # Install nodemailer to PVC + write send-email.js if Gmail credentials provided.
              if [ ${#GMAIL_USER} -gt 3 ] && [ ${#GMAIL_APP_PASSWORD} -gt 10 ]; then
                # Install nodemailer to PVC (persists across restarts, skips if already installed)
                if [ ! -d "/home/node/.openclaw/npm-email/node_modules/nodemailer" ]; then
                  npm install --prefix /home/node/.openclaw/npm-email nodemailer 2>/dev/null || true
                fi
                # Write send-email.js helper to workspace
                node -e "
                  const fs = require('fs');
                  const script = [
                    \"#!/usr/bin/env node\",
                    \"'use strict';\",
                    \"const nodemailer = require('/home/node/.openclaw/npm-email/node_modules/nodemailer');\",
                    \"const [,,to,subject,...bodyParts] = process.argv;\",
                    \"if (!to||!subject){console.error('Usage: send-email.js <to> <subject> <body>');process.exit(1);}\",
                    \"const body = bodyParts.join(' ');\",
                    \"const user=process.env.GMAIL_USER, pass=process.env.GMAIL_APP_PASSWORD;\",
                    \"if(!user||!pass){console.error('GMAIL_USER/GMAIL_APP_PASSWORD not set');process.exit(1);}\",
                    \"const t=nodemailer.createTransport({host:'smtp.gmail.com',port:587,secure:false,auth:{user,pass}});\",
                    \"t.sendMail({from:user,to,subject,text:body})\",
                    \".then(i=>console.log('Email sent to '+to+' ('+i.messageId+')'))\",
                    \".catch(e=>{console.error('Send failed: '+e.message);process.exit(1);});\",
                  ].join('\n');
                  fs.writeFileSync('/home/node/.openclaw/workspace/send-email.js', script);
                " 2>/dev/null || true
                echo "[init-config] Gmail email configured for ${GMAIL_USER}"
              fi

              # Write check-inbox.js — lets the agent show operator unread lead replies on demand.
              node -e "
                const fs = require('fs'), path = require('path');
                const script = [
                  \"'use strict';\",
                  \"const fs = require('fs'), path = require('path');\",
                  \"const INBOX = path.join(process.env.STATE_DIR||'/home/node/.openclaw','inbox.json');\",
                  \"let box={unread:[],read:[]};\",
                  \"try{box=JSON.parse(fs.readFileSync(INBOX,'utf8'));}catch(e){}\",
                  \"if(!box.unread.length){console.log(JSON.stringify({count:0,messages:[],note:'No unread replies.'}));process.exit(0);}\",
                  \"const out={count:box.unread.length,messages:box.unread.map((m,i)=>({index:i+1,from:(m.leadName||m.from)+' <'+m.from+'>',subject:m.subject,received:m.receivedAt,preview:m.snippet,intent:m.intent||'unknown'}))}\",
                  \";box.read.push(...box.unread);box.unread=[];\",
                  \"fs.writeFileSync(INBOX,JSON.stringify(box,null,2));\",
                  \"console.log(JSON.stringify(out,null,2));\",
                ].join('\n');
                fs.writeFileSync('/home/node/.openclaw/workspace/check-inbox.js', script);
              " 2>/dev/null || true
              echo "[init-config] check-inbox.js written to workspace."

              # Write read-company.js and update-company.js for company knowledge base.
              node -e "
                const fs = require('fs');
                const readScript = [
                  \"'use strict';\",
                  \"const fs = require('fs'), path = require('path');\",
                  \"const f = path.join(process.env.STATE_DIR||'/home/node/.openclaw','workspace','company.md');\",
                  \"if (!fs.existsSync(f)) { console.log('No company knowledge base set yet. Ask the operator to add company info.'); process.exit(0); }\",
                  \"console.log(fs.readFileSync(f,'utf8'));\",
                ].join('\n');
                fs.writeFileSync('/home/node/.openclaw/workspace/read-company.js', readScript);

                const updateScript = [
                  \"'use strict';\",
                  \"const fs = require('fs'), path = require('path');\",
                  \"const f = path.join(process.env.STATE_DIR||'/home/node/.openclaw','workspace','company.md');\",
                  \"const content = process.argv.slice(2).join(' ');\",
                  \"if (!content.trim()) { console.error('No content provided.'); process.exit(1); }\",
                  \"fs.writeFileSync(f, content.trim());\",
                  \"console.log('Company knowledge base updated (' + content.length + ' chars).');\",
                ].join('\n');
                fs.writeFileSync('/home/node/.openclaw/workspace/update-company.js', updateScript);
              " 2>/dev/null || true

              # Pre-seed company.md from COMPANY_DESCRIPTION if provided and file doesn't exist yet.
              if [ -n \"\${COMPANY_DESCRIPTION}\" ] && [ ! -f /home/node/.openclaw/workspace/company.md ]; then
                node -e "
                  const fs = require('fs');
                  fs.writeFileSync('/home/node/.openclaw/workspace/company.md', process.env.COMPANY_DESCRIPTION.trim());
                  console.error('[init-config] company.md pre-seeded from COMPANY_DESCRIPTION.');
                " 2>&1 || true
              fi
              echo "[init-config] company knowledge base scripts ready."

              # Write notify-operator.js — the SDR agent's escalation/notification tool.
              # Sends a formatted Telegram alert AND prints the payload to stdout so
              # OpenClaw captures it in the conversation log (the "UI notification").
              # Uses Node's built-in https module — no npm deps required.
              node -e "
                const fs = require('fs');
                const script = [
                  \"#!/usr/bin/env node\",
                  \"'use strict';\",
                  \"const https = require('https');\",
                  \"const raw = process.argv[2];\",
                  \"if (!raw) { console.error('Usage: notify-operator.js <json-payload>'); process.exit(1); }\",
                  \"let p;\",
                  \"try { p = JSON.parse(raw); } catch (e) { console.error('Invalid JSON payload: ' + e.message); process.exit(1); }\",
                  \"const sev = (p.severity || 'P2').toUpperCase();\",
                  \"const icon = sev === 'P0' ? '\\\\uD83D\\\\uDEA8' : sev === 'P1' ? '\\\\u26A0\\\\uFE0F' : '\\\\u2139\\\\uFE0F';\",
                  \"const silent = p.silent === true;\",
                  \"const ts = p.timestamp || new Date().toISOString();\",
                  \"const conf = (typeof p.agent_confidence === 'number') ? p.agent_confidence.toFixed(2) : 'n/a';\",
                  \"const esc = (s) => String(s == null ? '' : s).replace(/[*_\\\\[\\\\]]/g, ' ');\",
                  \"const lines = [\",
                  \"  icon + ' *' + sev + ' Escalation* ' + (silent ? '(silent)' : ''),\",
                  \"  '',\",
                  \"  '*Reason:* ' + esc(p.reason || 'unspecified'),\",
                  \"  '*Customer:* ' + esc(p.customer_name || 'unknown'),\",
                  \"  '*Email:* ' + esc(p.email || 'unknown'),\",
                  \"  '*Company:* ' + esc(p.company || 'unknown'),\",
                  \"  '',\",
                  \"  '*Summary:* ' + esc(p.conversation_summary || ''),\",
                  \"  '',\",
                  \"  '*Recommended action:* ' + esc(p.recommended_action || ''),\",
                  \"  '',\",
                  \"  '*Agent confidence:* ' + conf,\",
                  \"  '*Time:* ' + esc(ts),\",
                  \"];\",
                  \"const text = lines.join('\\\\n');\",
                  \"const token = process.env.TELEGRAM_BOT_TOKEN || '';\",
                  \"const STATE_FILE = (process.env.STATE_DIR || '/home/node/.openclaw') + '/state.json';\",
                  \"function loadChatId() {\",
                  \"  const explicit = process.env.TELEGRAM_APPROVAL_CHAT_ID || '';\",
                  \"  if (explicit) return explicit;\",
                  \"  try { const s = JSON.parse(require('fs').readFileSync(STATE_FILE,'utf8')); return s._telegramChatId || ''; } catch(e) { return ''; }\",
                  \"}\",
                  \"async function resolveChatId() {\",
                  \"  const cached = loadChatId();\",
                  \"  if (cached) return cached;\",
                  \"  if (token.length < 10) return '';\",
                  \"  try {\",
                  \"    const res = await new Promise((resolve) => {\",
                  \"      const req = require('https').request({ hostname:'api.telegram.org', path:'/bot'+token+'/getUpdates?limit=1&allowed_updates=message', method:'GET' }, (r) => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>{ try{resolve(JSON.parse(d));}catch(e){resolve(null);} }); }); req.on('error',()=>resolve(null)); req.end();\",
                  \"    });\",
                  \"    const updates = (res && res.result) || [];\",
                  \"    if (updates.length > 0) {\",
                  \"      const id = String(updates[0].message.chat.id);\",
                  \"      try { const fs=require('fs'); let s={}; try{s=JSON.parse(fs.readFileSync(STATE_FILE,'utf8'));}catch(e){} s._telegramChatId=id; fs.writeFileSync(STATE_FILE,JSON.stringify(s,null,2)); } catch(e) {}\",
                  \"      return id;\",
                  \"    }\",
                  \"  } catch(e) {}\",
                  \"  return '';\",
                  \"}\",
                  \"function emitStdout() {\",
                  \"  if (silent) { console.log('Escalation logged.'); return; }\",
                  \"  console.log(JSON.stringify(p, null, 2));\",
                  \"}\",
                  \"async function sendTelegram(chat) {\",
                  \"  return new Promise((resolve) => {\",
                  \"    if (token.length < 10 || !chat) { resolve(false); return; }\",
                  \"    const body = JSON.stringify({ chat_id: chat, text: text, parse_mode: 'Markdown' });\",
                  \"    const req = https.request({\",
                  \"      hostname: 'api.telegram.org', path: '/bot' + token + '/sendMessage', method: 'POST',\",
                  \"      headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }\",
                  \"    }, (res) => { res.resume(); res.on('end', () => resolve(res.statusCode >= 200 && res.statusCode < 300)); });\",
                  \"    req.on('error', () => resolve(false));\",
                  \"    req.write(body); req.end();\",
                  \"  });\",
                  \"}\",
                  \"(async () => { try { const chat = await resolveChatId(); await sendTelegram(chat); } catch (e) {} emitStdout(); process.exit(0); })();\",
                ].join('\n');
                fs.writeFileSync('/home/node/.openclaw/workspace/notify-operator.js', script);
              " 2>/dev/null || true
              echo "[init-config] notify-operator.js written to workspace."

              # Inject channels.telegram if bot token provided.
              # dmPolicy=open + allowFrom=["*"]: zero-friction — no pairing prompt for end users.
              if [ ${#TELEGRAM_BOT_TOKEN} -gt 10 ]; then
                node -e "
                  const fs = require('fs');
                  const p = '/home/node/.openclaw/openclaw.json';
                  const c = JSON.parse(fs.readFileSync(p,'utf8'));
                  c.channels = { telegram: { enabled: true, dmPolicy: 'open', allowFrom: ['*'], botToken: process.env.TELEGRAM_BOT_TOKEN } };
                  fs.writeFileSync(p, JSON.stringify(c,null,2));
                " 2>/dev/null || true
                echo "[init-config] Telegram channel configured."
              fi

              # Pre-approve exec calls so the SDR agent can run send-email.js without prompting.
              # Written here to bypass the CLI's chmod call which fails on root-owned PVC root.
              node -e "
                const fs = require('fs');
                const p = '/home/node/.openclaw/exec-approvals.json';
                if (!fs.existsSync(p)) {
                  const data = {
                    version: 1,
                    agents: {
                      sdr: {
                        allowlist: [
                          'node /home/node/.openclaw/workspace/send-email.js *',
                          'node /home/node/.openclaw/workspace/notify-operator.js *',
                          'node /home/node/.openclaw/workspace/*.js *',
                          'node /automation/*.js *'
                        ]
                      }
                    },
                    allowlist: []
                  };
                  fs.writeFileSync(p, JSON.stringify(data, null, 2));
                  console.error('[init-config] exec-approvals.json created for sdr agent.');
                }
              " 2>&1 || true

              # Copy reference MD files from ConfigMap (always overwrite — read-only reference content).
              for f in TOOLS.md IDENTITY.md USER.md HEARTBEAT.md; do
                cp /config/$f /home/node/.openclaw/workspace/$f
              done
              # MEMORY.md accumulates across restarts — only initialize if missing.
              if [ ! -f /home/node/.openclaw/workspace/MEMORY.md ]; then
                cp /config/MEMORY.md /home/node/.openclaw/workspace/MEMORY.md
              fi
              echo "[init-config] workspace files initialized."

          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: GOOGLE_API_KEY
                  optional: true
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: GROQ_API_KEY
                  optional: true
            - name: FIREWORKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: FIREWORKS_API_KEY
                  optional: true
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: GMAIL_USER
                  optional: true
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: GMAIL_APP_PASSWORD
                  optional: true
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: TELEGRAM_APPROVAL_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: TELEGRAM_APPROVAL_CHAT_ID
                  optional: true
            - name: OPENAI_API_BASE
              value: {{ .Values.openclaw.openaiApiBase | quote }}
            - name: COMPANY_DESCRIPTION
              value: {{ .Values.openclaw.companyDescription | quote }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: config
              mountPath: /config
      containers:
        # ─── OpenClaw Gateway ────────────────────────────────────────────────
        - name: gateway
          image: {{ .Values.openclaw.image.repository }}:{{ .Values.openclaw.image.tag }}
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command: ["node", "/app/dist/index.js", "gateway", "run"]
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
          env:
            - name: HOME
              value: /home/node
            - name: OPENCLAW_CONFIG_DIR
              value: /home/node/.openclaw
            - name: NODE_ENV
              value: production
            - name: NODE_OPTIONS
              value: "--dns-result-order=ipv4first"
            - name: SEARXNG_BASE_URL
              value: "http://{{ .Release.Name }}-searxng-svc:8080"
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: OPENAI_API_KEY
                  optional: true

            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: GOOGLE_API_KEY
                  optional: true
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: GROQ_API_KEY
                  optional: true
            - name: FIREWORKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: FIREWORKS_API_KEY
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: TELEGRAM_APPROVAL_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: TELEGRAM_APPROVAL_CHAT_ID
                  optional: true
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: GMAIL_USER
                  optional: true
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: GMAIL_APP_PASSWORD
                  optional: true
            # Twenty CRM — API key auto-generated at runtime by the automation sidecar.
            - name: TWENTY_API_URL
              value: {{ include "b2b-sdr.twentyInternalUrl" . | quote }}
          resources:
            {{- toYaml .Values.openclaw.resources | nindent 12 }}
          # tcpSocket liveness — port opens ~90-120s after start.
          # httpGet /health does NOT exist in this version of OpenClaw.
          livenessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 150
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Process-alive readiness so platform marks deployment Ready before port opens.
          # The gateway port (~90s) is slower than the platform's 120s wait — this avoids
          # a premature failure that would cause the platform to mark deploy as failed.
          readinessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: tmp-volume
              mountPath: /tmp
            - name: automation
              mountPath: /automation
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false

        # ─── Ingress WebSocket Patcher ────────────────────────────────────────
        # Patches the platform-created ingress with HAProxy WebSocket timeout annotation.
        # The platform creates ingress-{release} AFTER helm install completes —
        # we cannot set annotations in chart templates. This sidecar polls until
        # the ingress appears, patches it once, then idles.
        # Reuses the openclaw image (already pulled) — no extra image pull cost.
        - name: ingress-patcher
          image: {{ .Values.openclaw.image.repository }}:{{ .Values.openclaw.image.tag }}
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command:
            - node
            - -e
            - |
              'use strict';
              const https = require('https');
              const fs   = require('fs');
              const token   = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/token', 'utf8').trim();
              const ns      = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/namespace', 'utf8').trim();
              const ca      = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/ca.crt');
              const ingress = 'ingress-{{ .Release.Name }}';
              const base    = '/apis/networking.k8s.io/v1/namespaces/' + ns + '/ingresses/' + ingress;
              const patch   = JSON.stringify({ metadata: { annotations: {
                'haproxy-ingress.github.io/timeout-tunnel':        '1h',
                'haproxy-ingress.github.io/health-check-interval': '0'
              }}});
              function apiCall(method, path, body) {
                return new Promise(resolve => {
                  const opts = { hostname: 'kubernetes.default.svc', path, method, ca,
                    headers: { Authorization: 'Bearer ' + token } };
                  if (body) { opts.headers['Content-Type'] = 'application/merge-patch+json';
                    opts.headers['Content-Length'] = Buffer.byteLength(body); }
                  const req = https.request(opts, res => { resolve(res.statusCode); res.resume(); });
                  req.on('error', () => resolve(0));
                  if (body) req.write(body);
                  req.end();
                });
              }
              async function run() {
                for (let i = 0; i < 24; i++) {
                  const status = await apiCall('GET', base, null);
                  if (status === 200) {
                    const patched = await apiCall('PATCH', base, patch);
                    console.log('[ingress-patcher] patched ' + ingress + ' → HTTP ' + patched);
                    return;
                  }
                  console.log('[ingress-patcher] waiting for ingress (' + (i+1) + '/24)...');
                  await new Promise(r => setTimeout(r, 5000));
                }
                console.log('[ingress-patcher] ingress not found after 120s — skipping');
              }
              run().catch(e => console.error('[ingress-patcher]', e))
                   .finally(() => setInterval(() => {}, 2147483647));
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false

        # ─── Phase 2: Autonomous Outreach Scheduler ───────────────────────────
        # Drives the background loops (reply handling, follow-ups, enrichment+scoring).
        # Reuses the openclaw image (already pulled — no extra pull). Installs its Node
        # deps to the shared PVC on first boot, then runs the scheduler. The interactive
        # gateway above is completely unaffected — this only adds the autonomous lane.
        - name: automation
          image: {{ .Values.openclaw.image.repository }}:{{ .Values.openclaw.image.tag }}
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              export HOME=/home/node
              DEPS=/home/node/.openclaw/npm-automation
              if [ ! -d "$DEPS/node_modules/imapflow" ]; then
                echo "[automation] installing deps (nodemailer imapflow mailparser)..."
                npm install --prefix "$DEPS" nodemailer imapflow mailparser 2>&1 | tail -3 || true
              fi
              echo "[automation] starting scheduler"
              exec node /automation/scheduler.js
          env:
            - name: HOME
              value: /home/node
            - name: STATE_DIR
              value: /home/node/.openclaw
            - name: SDR_NAME
              value: {{ .Values.openclaw.sdrName | quote }}
            - name: COMPANY_NAME
              value: {{ .Values.openclaw.companyName | quote }}
            - name: TWENTY_API_URL
              value: {{ include "b2b-sdr.twentyInternalUrl" . | quote }}
            - name: OPENAI_API_BASE
              value: {{ .Values.openclaw.openaiApiBase | quote }}
            - name: OUTREACH_ENABLED
              value: {{ .Values.outreach.enabled | quote }}
            - name: OUTREACH_AUTO_OUTREACH
              value: {{ .Values.outreach.autoOutreachEnabled | quote }}
            - name: OUTREACH_SCORE_THRESHOLD
              value: {{ .Values.outreach.leadScoreThreshold | quote }}
            - name: OUTREACH_FOLLOWUP_DAYS
              value: {{ .Values.outreach.followUpDays | quote }}
            - name: OUTREACH_REPLY_POLL_MINUTES
              value: {{ .Values.outreach.replyPollMinutes | quote }}
            - name: OUTREACH_PROSPECTING_ENABLED
              value: {{ .Values.outreach.prospectingEnabled | quote }}
            - name: OUTREACH_MAX_EMAILS_PER_DAY
              value: {{ .Values.outreach.maxEmailsPerDay | quote }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: ANTHROPIC_API_KEY, optional: true }
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: OPENAI_API_KEY, optional: true }
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: GOOGLE_API_KEY, optional: true }
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: GROQ_API_KEY, optional: true }
            - name: FIREWORKS_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: FIREWORKS_API_KEY, optional: true }
            - name: JINA_AI_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: JINA_AI_KEY, optional: true }
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: GMAIL_USER, optional: true }
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: GMAIL_APP_PASSWORD, optional: true }
            - name: TWENTY_ADMIN_EMAIL
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: TWENTY_ADMIN_EMAIL }
            - name: TWENTY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: TWENTY_ADMIN_PASSWORD }
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: TELEGRAM_BOT_TOKEN, optional: true }
            - name: TELEGRAM_APPROVAL_CHAT_ID
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: TELEGRAM_APPROVAL_CHAT_ID, optional: true }
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: automation
              mountPath: /automation
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false

      volumes:
        - name: openclaw-home
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-openclaw-home
        - name: config
          configMap:
            name: {{ .Release.Name }}-openclaw-config
        - name: tmp-volume
          emptyDir: {}
        - name: automation
          configMap:
            name: {{ .Release.Name }}-automation
