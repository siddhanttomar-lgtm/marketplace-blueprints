apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b2b-sdr.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: {{ .Values.openclaw.gatewayToken | quote }}
  E2E_BEARER_TOKEN: {{ .Values.openclaw.e2eBearerToken | quote }}
  # Namespace injected by platform at deploy time via global.platform.tirProjectId;
  # e2e.projectNamespace is a manual override fallback for deploys outside the platform.
  E2E_PROJECT_NAMESPACE: {{ .Values.global.platform.tirProjectId | default (.Values.e2e.projectNamespace | default "") | quote }}
  E2E_MODEL_NAME: {{ .Values.e2e.modelName | default "gpt_oss_120b" | quote }}
  GMAIL_USER: {{ .Values.openclaw.gmailUser | quote }}
  GMAIL_APP_PASSWORD: {{ .Values.openclaw.gmailAppPassword | quote }}
  JINA_AI_KEY: {{ .Values.openclaw.jinaAiKey | quote }}
  HUBSPOT_ACCESS_TOKEN: {{ .Values.integrations.hubspot.accessToken | default "" | quote }}
  HUBSPOT_API_BASE: {{ .Values.integrations.hubspot.apiBase | default "https://api.hubapi.com" | quote }}
  # Whitespace-stripped — some marketplace platforms inject stray spaces/newlines into
  # long token fields, which would silently break Telegram auth.
  TELEGRAM_BOT_TOKEN: {{ regexReplaceAll "\\s+" (.Values.telegram.botToken | default "") "" | quote }}
  TELEGRAM_APPROVAL_CHAT_ID: {{ .Values.telegram.approvalChatId | quote }}
