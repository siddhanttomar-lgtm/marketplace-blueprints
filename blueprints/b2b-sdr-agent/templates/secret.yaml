{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" .Release.Name) }}
{{- $adminPass := "" }}
{{- if $existing }}
{{- $adminPass = index $existing.data "TWENTY_ADMIN_PASSWORD" | b64dec }}
{{- else }}
{{- $adminPass = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b2b-sdr.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: {{ .Values.openclaw.gatewayToken | quote }}
  ANTHROPIC_API_KEY: {{ .Values.openclaw.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.openclaw.openaiApiKey | quote }}
  GOOGLE_API_KEY: {{ .Values.openclaw.googleApiKey | quote }}
  GROQ_API_KEY: {{ .Values.openclaw.groqApiKey | quote }}
  FIREWORKS_API_KEY: {{ .Values.openclaw.fireworksApiKey | quote }}
  GMAIL_USER: {{ .Values.openclaw.gmailUser | quote }}
  GMAIL_APP_PASSWORD: {{ .Values.openclaw.gmailAppPassword | quote }}
  JINA_AI_KEY: {{ .Values.openclaw.jinaAiKey | quote }}
  TWENTY_APP_SECRET: {{ .Values.twenty.appSecret | quote }}
  TWENTY_ADMIN_EMAIL: "admin@twenty.internal"
  TWENTY_ADMIN_PASSWORD: {{ $adminPass | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  TWENTY_PG_DSN: {{ include "b2b-sdr.postgresDsn" . | quote }}
  TELEGRAM_BOT_TOKEN: {{ .Values.telegram.botToken | quote }}
  TELEGRAM_APPROVAL_CHAT_ID: {{ .Values.telegram.approvalChatId | quote }}
