busybox:
  image:
    repository: registry.e2enetworks.net/marketplace-blueprint/busybox
    tag: "1.37"

openclaw:
  image:
    repository: registry.e2enetworks.net/marketplace-blueprint/openclaw
    tag: "slim"
    pullPolicy: Always
  storage:
    size: 5Gi
  # REQUIRED: Gateway auth token — change before production
  gatewayToken: "SDRGateway@12345"
  # At least one AI API key required
  anthropicApiKey: ""
  openaiApiKey: ""
  googleApiKey: ""
  groqApiKey: ""
  # Fireworks AI key (testing/dev — OpenAI-compatible, uses deepseek-v4-pro)
  # Get one at fireworks.ai — set this if you don't have a native key yet
  fireworksApiKey: ""
  # Optional: Gmail credentials for outbound email sending
  # Use a Gmail App Password (myaccount.google.com/apppasswords) — NOT your regular password
  gmailUser: ""
  gmailAppPassword: ""
  # SDR persona shown in conversations
  sdrName: "Alex"
  companyName: ""
  # Optional: pre-seed company knowledge base. The agent reads this when answering
  # product questions or drafting emails. Can also be updated later via chat.
  companyDescription: ""
  # Optional: custom OpenAI-compatible endpoint (Fireworks, DeepSeek, Together AI, etc.)
  # e.g. "https://api.fireworks.ai/inference/v1"
  openaiApiBase: ""
  # Optional enrichment APIs
  jinaAiKey: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

twenty:
  image:
    repository: registry.e2enetworks.net/marketplace-blueprint/twenty
    tag: "latest"
    pullPolicy: Always
  storage:
    size: 5Gi
  # REQUIRED: 64-char hex secret — default provided for convenience, change in production
  appSecret: "b2bsdr0000000000000000000000000000000000000000000000000000000001"
  # Set to your actual external URL for correct email/webhook links in Twenty.
  # Leave empty — internal service URL is used by default (sufficient for API-only use).
  serverUrl: ""
  # Twenty API key is auto-generated by the automation sidecar on first boot.
  # No customer action required.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

postgres:
  image:
    repository: registry.e2enetworks.net/marketplace-blueprint/twenty-postgres
    tag: "latest"
    pullPolicy: Always
  storage:
    size: 10Gi
  user: "twenty"
  password: "TwentyPass123"
  database: "twenty"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

redis:
  image:
    repository: registry.e2enetworks.net/marketplace-blueprint/redis
    tag: "7-alpine"
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "500m"
      memory: 256Mi

telegram:
  # Optional — if set, enables a Telegram bot that bridges to the SDR agent.
  # Create a bot via @BotFather on Telegram, paste the token here.
  botToken: ""
  # Optional — chat ID that receives approval requests for the autonomous loops.
  # Find yours by messaging the bot then checking https://api.telegram.org/bot<token>/getUpdates
  # If empty, drafts that need approval are logged instead of pushed to Telegram.
  approvalChatId: ""

# ─── Phase 2: Autonomous outreach engine ──────────────────────────────────────
# These drive the background loops (reply handling, follow-ups, enrichment+scoring).
# The interactive agent (Telegram/web chat) works exactly as in v1 regardless of these.
# Set Gmail + an LLM key AT LAUNCH — that arms send + reply polling + scoring.
# twenty.apiKey is optional and set AFTER first boot (Twenty mints it itself); without
# it the loops still run, they just skip mirroring leads into the CRM.
outreach:
  # Master switch for the autonomous scheduler sidecar. If false, only the
  # interactive agent runs (identical to v1.0.0 behaviour).
  enabled: true
  # false = drafts queued for human approval (via Telegram or logs) before sending.
  # true  = fully autonomous — replies and follow-ups send without human review.
  autoOutreachEnabled: false
  # Lead score (0-100) at/above which a lead auto-enters the outreach sequence.
  # 0 = every lead gets outreach regardless of score.
  leadScoreThreshold: 0
  # Follow-up cadence in days after first contact with no reply (CSV of day offsets).
  followUpDays: "2,5,10"
  # How often (minutes) to poll Gmail for inbound replies. Min 5.
  replyPollMinutes: 15
  # Daily enrichment + scoring pass over new CRM leads (uses Jina AI if openclaw.jinaAiKey set).
  prospectingEnabled: true
  # Hard cap on autonomous outbound emails per day (safety guardrail against spam).
  maxEmailsPerDay: 50

nodeSelector: {}
