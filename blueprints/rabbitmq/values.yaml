global:
  imagePullSecrets:
    - registry-pull-secret
  security:
    allowInsecureImages: true

rabbitmq:
  image:
    registry: registry.e2enetworks.net
    repository: marketplace-blueprint/rabbitmq
    tag: 4.1.3-debian-12-r1
    pullPolicy: IfNotPresent
  volumePermissions:
    image:
      registry: registry.e2enetworks.net
      repository: marketplace-blueprint/os-shell
      tag: 12-debian-12-r65
      pullPolicy: IfNotPresent
  auth:
    username: "admin"
    password: ""
    erlangCookie: "securecookie1234"
  persistence:
    size: "8Gi"
  resources:
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"
  service:
    type: ClusterIP
  metrics:
    enabled: false
