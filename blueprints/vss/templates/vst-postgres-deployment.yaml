apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vss.fullname" . }}-vst-postgres
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: vst-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vst-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vst-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: vst-postgres
    spec:
      imagePullSecrets:
        - name: registry-pull-secret
      containers:
        - name: postgres
          image: {{ .Values.vst.postgres.image }}
          args:
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - unix_socket_directories=/tmp
          env:
            - name: POSTGRES_USER
              value: {{ .Values.vst.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.vst.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vss.fullname" . }}-vst-postgres
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: {{ .Values.vst.postgres.port }}
              name: postgres
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.vst.postgres.user }}
                - -d
                - {{ .Values.vst.postgres.database }}
                - -h
                - /tmp
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.vst.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "vss.fullname" . }}-vst-postgres-db
        - name: postgres-config
          configMap:
            name: {{ include "vss.fullname" . }}-vst-postgres-config
