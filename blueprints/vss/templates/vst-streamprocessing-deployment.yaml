apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vss.fullname" . }}-vst-streamprocessing
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: vst-streamprocessing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vst-streamprocessing
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vst-streamprocessing
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: vst-streamprocessing
    spec:
      imagePullSecrets:
        - name: nvcr-pull-secret
      {{- if .Values.vst.streamprocessing.requireGpu }}
      runtimeClassName: nvidia
      {{- end }}
      containers:
        - name: vst-streamprocessing
          image: {{ .Values.vst.streamprocessing.image }}
          command:
            - /bin/bash
            - -c
            - |
              if [ "$VST_INSTALL_ADDITIONAL_PACKAGES" = "true" ]; then
                /home/vst/vst_release/tools/user_additional_install.sh
              fi
              exec /home/vst/vst_release/launch_vst
          env:
            - name: VST_INSTALL_ADDITIONAL_PACKAGES
              value: "true"
            - name: CONTAINER_NAME
              value: streamprocessing-ms
            - name: ADAPTOR
              value: {{ .Values.vst.sensor.adaptor | quote }}
            - name: HTTP_PORT
              value: {{ .Values.vst.streamprocessing.port | quote }}
            - name: RTSP_SERVER_PORT
              value: {{ .Values.vst.streamprocessing.rtspPort | quote }}
            {{- if .Values.vst.streamprocessing.requireGpu }}
            - name: GPU_DEVICES
              value: {{ .Values.gpu.deviceIds | quote }}
            - name: CUDA_VISIBLE_DEVICES
              value: {{ .Values.gpu.deviceIds | quote }}
            {{- end }}
            - name: CENTRALIZE_DB_NAME
              value: {{ .Values.vst.postgres.database | quote }}
            - name: CENTRALIZE_DB_USERNAME
              value: {{ .Values.vst.postgres.user | quote }}
            - name: PGHOST
              value: {{ include "vss.fullname" . }}-vst-postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: {{ .Values.vst.postgres.user | quote }}
            - name: PGDATABASE
              value: {{ .Values.vst.postgres.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vss.fullname" . }}-vst-postgres
                  key: POSTGRES_PASSWORD
            - name: SENSOR_MODULE_ENDPOINT
              value: "http://{{ include "vss.fullname" . }}-vst-sensor:{{ .Values.vst.sensor.port }}"
            - name: VST_INGRESS_ENDPOINT
              value: "http://{{ include "vss.fullname" . }}-vst-ingress:{{ .Values.vst.ingress.port }}/vst"
            - name: REDIS_SVC_SERVICE_HOST
              value: {{ include "vss.redisHost" . | quote }}
            - name: KAFKA_BOOTSTRAP_URL
              value: {{ include "vss.kafkaBootstrap" . | quote }}
          ports:
            - containerPort: {{ .Values.vst.streamprocessing.port }}
              name: http
            - containerPort: {{ .Values.vst.streamprocessing.rtspPort }}
              name: rtsp
          readinessProbe:
            exec:
              command:
                - bash
                - -ec
                - "exec 3<>/dev/tcp/127.0.0.1/{{ .Values.vst.streamprocessing.port }}"
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5
          resources:
            requests:
              {{- toYaml .Values.vst.streamprocessing.resources.requests | nindent 14 }}
            limits:
              {{- toYaml .Values.vst.streamprocessing.resources.limits | nindent 14 }}
              {{- if .Values.vst.streamprocessing.requireGpu }}
              nvidia.com/gpu: "1"
              {{- end }}
          volumeMounts:
            - name: sensor-config
              mountPath: /home/vst/vst_release/configs/vst_config.json
              subPath: vst_config.json
            - name: sp-data
              mountPath: /home/vst/vst_release/vst_data
      volumes:
        - name: sensor-config
          configMap:
            name: {{ include "vss.fullname" . }}-vst-sensor-config
        - name: sp-data
          persistentVolumeClaim:
            claimName: {{ include "vss.fullname" . }}-vst-sp-data
