apiVersion: v1
kind: Service
metadata:
  name: {{ include "vss.fullname" . }}-nim-cosmos
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: nim-cosmos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nim-cosmos
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.nim.cosmos.port }}
      targetPort: {{ .Values.nim.cosmos.port }}
