{{- if and .Values.ingress.enabled .Values.ingress.baseDomain }}
# UI Ingress — primary entrypoint, named {{ .Release.Name }} service on port 80
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vss.fullname" . }}-ui
  labels:
    {{- include "vss.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ include "vss.uiHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: 80
---
# Agent API Ingress — browser WebSocket + REST calls reach the agent directly
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vss.fullname" . }}-agent
  labels:
    {{- include "vss.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ include "vss.agentHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vss.fullname" . }}-vss-agent
                port:
                  number: {{ .Values.vssAgent.port }}
---
# VST Ingress — browser accesses video management via this hostname
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vss.fullname" . }}-vst
  labels:
    {{- include "vss.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ include "vss.vstHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vss.fullname" . }}-vst-ingress
                port:
                  number: {{ .Values.vst.ingress.port }}
{{- end }}
