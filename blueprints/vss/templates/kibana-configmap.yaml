{{- if .Values.kibana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vss.fullname" . }}-kibana-config
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: kibana
data:
  kibana.yml: |
    server.host: "0.0.0.0"
    server.shutdownTimeout: "5s"
    elasticsearch.hosts: [ {{ include "vss.elasticsearchUrl" . | quote }} ]
    monitoring.ui.container.elasticsearch.enabled: true
{{- end }}
