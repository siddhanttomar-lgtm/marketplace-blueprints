{{- if .Values.kafka.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vss.fullname" . }}-kafka-init-script
  labels:
    {{- include "vss.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  create-kafka-topics.sh: |
    #!/bin/bash
    # Aligned with NVIDIA VSS foundational deployment (deployments/foundational/mdx-foundational.yml)
    # Default: 8 partitions, retention 4h (14400000 ms), segment 1h (3600000 ms)
    set -euo pipefail

    BOOTSTRAP="{{ include "vss.fullname" . }}-kafka:{{ .Values.kafka.port }}"
    DEFAULT_PARTITIONS="8"
    DEFAULT_RETENTION_MS="14400000"
    DEFAULT_SEGMENT_MS="3600000"
    REPLICATION_FACTOR="1"

    echo "Waiting for Kafka broker at $BOOTSTRAP..."
    until kafka-broker-api-versions --bootstrap-server "$BOOTSTRAP" > /dev/null 2>&1; do
      echo "Kafka not ready — retrying in 2s..."
      sleep 2
    done
    echo "Kafka is up."

    create_topic() {
      local name="$1"
      local partitions="${2:-$DEFAULT_PARTITIONS}"
      local retention="${3:-$DEFAULT_RETENTION_MS}"
      local segment="${4:-$DEFAULT_SEGMENT_MS}"
      echo "Creating topic: $name  partitions=$partitions  retention=${retention}ms"
      kafka-topics \
        --bootstrap-server "$BOOTSTRAP" \
        --create --if-not-exists \
        --topic "$name" \
        --partitions "$partitions" \
        --replication-factor "$REPLICATION_FACTOR" \
        --config retention.ms="$retention" \
        --config segment.ms="$segment"
    }

    # ── MDX foundational topics (exact NVIDIA list, mdx-foundational.yml) ────
    create_topic "mdx-raw"
    create_topic "mdx-bev"
    create_topic "mdx-space-utilization"
    create_topic "mdx-alerts"
    create_topic "mdx-behavior"
    create_topic "mdx-behavior-plus"
    create_topic "mdx-frames"
    create_topic "mdx-mtmc"
    create_topic "mdx-rtls"
    create_topic "mdx-rtls-region-1"
    create_topic "mdx-amr"
    create_topic "mdx-vlm-alerts"
    create_topic "mdx-notification"  1          # single partition — ordered notification delivery
    create_topic "mdx-events"
    create_topic "mdx-incidents"
    create_topic "mdx-vlm-incidents"
    create_topic "mdx-vlm"
    create_topic "mdx-embed"
    create_topic "mdx-embed-filtered"

    # ── VSS agent pipeline topics ─────────────────────────────────────────────
    create_topic "vss-events"
    create_topic "vss-search-results"
    create_topic "vss-ingest"
    create_topic "vss-stream-metadata"

    echo "--- All topics ---"
    kafka-topics --bootstrap-server "$BOOTSTRAP" --list
    echo "Kafka topic initialization complete."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vss.fullname" . }}-kafka-init
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-init
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: registry-pull-secret
      containers:
        - name: kafka-init
          image: {{ .Values.kafka.image }}
          command: ["/bin/bash", "/scripts/create-kafka-topics.sh"]
          volumeMounts:
            - name: init-script
              mountPath: /scripts
      volumes:
        - name: init-script
          configMap:
            name: {{ include "vss.fullname" . }}-kafka-init-script
            defaultMode: 0755
{{- end }}
