apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vss.fullname" . }}-vst-nginx-logs
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: vst-ingress
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.vst.ingress.logSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vss.fullname" . }}-vst-ingress
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: vst-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vst-ingress
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vst-ingress
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: vst-ingress
    spec:
      imagePullSecrets:
        - name: nvcr-pull-secret
      containers:
        - name: vst-ingress
          image: {{ .Values.vst.ingress.image }}
          command:
            - /bin/sh
            - -c
            - mkdir -p /tmp/nginx && cp /etc/nginx/conf-k8s/nginx.conf /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'
          env:
            - name: HOST_IP
              value: {{ if .Values.ingress.enabled }}{{ include "vss.vstHost" . | quote }}{{ else }}{{ .Values.externalIp | quote }}{{ end }}
            - name: EXTERNAL_IP
              value: {{ if .Values.ingress.enabled }}{{ include "vss.vstHost" . | quote }}{{ else }}{{ .Values.externalIp | quote }}{{ end }}
            - name: VST_INGRESS_HTTP_PORT
              value: {{ .Values.vst.ingress.port | quote }}
          ports:
            - containerPort: {{ .Values.vst.ingress.port }}
              name: http
          readinessProbe:
            exec:
              command:
                - bash
                - -ec
                - exec 3<>/dev/tcp/127.0.0.1/{{ .Values.vst.ingress.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.vst.ingress.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf-k8s
            - name: nginx-logs
              mountPath: /var/log/nginx
            - name: nginx-tmp
              mountPath: /tmp/nginx
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "vss.fullname" . }}-vst-nginx-config
        - name: nginx-logs
          persistentVolumeClaim:
            claimName: {{ include "vss.fullname" . }}-vst-nginx-logs
        - name: nginx-tmp
          emptyDir: {}
