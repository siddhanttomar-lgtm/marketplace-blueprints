{{- if .Values.lvs.enabled }}
# ── LVS ClusterIP — internal access for vss-agent lvs_video_understanding tool ──
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vss.fullname" . }}-lvs
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: lvs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lvs
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: backend
      port: {{ .Values.lvs.backendPort }}
      targetPort: {{ .Values.lvs.backendPort }}
    - name: mcp
      port: {{ .Values.lvs.mcpPort }}
      targetPort: {{ .Values.lvs.mcpPort }}
    - name: frontend
      port: {{ .Values.lvs.frontendPort }}
      targetPort: {{ .Values.lvs.frontendPort }}
---
{{- if .Values.lvs.frontendNodePort }}
# ── LVS Frontend NodePort — browser access to the LVS standalone UI ──
# LVS has its own React/Gradio frontend (NOT a tab in the main VSS UI).
# Access via: http://<externalIp>:<frontendNodePort>
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vss.fullname" . }}-lvs-ui
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: lvs-ui
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: lvs
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: frontend
      port: {{ .Values.lvs.frontendPort }}
      targetPort: {{ .Values.lvs.frontendPort }}
      nodePort: {{ .Values.lvs.frontendNodePort }}
{{- end }}
{{- end }}
