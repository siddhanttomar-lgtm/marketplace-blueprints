{{- if .Values.phoenix.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vss.fullname" . }}-phoenix
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: phoenix
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: phoenix
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.phoenix.port }}
      targetPort: {{ .Values.phoenix.port }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vss.fullname" . }}-phoenix-data
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: phoenix
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.phoenix.storageSize }}
{{- end }}
