apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vss.fullname" . }}-ngc
  labels:
    {{- include "vss.labels" . | nindent 4 }}
type: Opaque
stringData:
  HF_TOKEN: {{ .Values.hfToken | quote }}
---
{{- $secretName := printf "%s-vst-postgres" (include "vss.fullname" .) }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $pgPassword := "" }}
{{- if $existingSecret }}
{{- $pgPassword = index $existingSecret.data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
{{- $pgPassword = .Values.vst.postgres.password | default (randAlphaNum 32) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "vss.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
{{- if and .Values.rtviEmbed.enabled .Values.rtviEmbed.hfToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vss.fullname" . }}-rtvi-embed
  labels:
    {{- include "vss.labels" . | nindent 4 }}
type: Opaque
stringData:
  HF_TOKEN: {{ .Values.rtviEmbed.hfToken | quote }}
{{- end }}
