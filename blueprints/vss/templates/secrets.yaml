apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vss.fullname" . }}-ngc
  labels:
    {{- include "vss.labels" . | nindent 4 }}
type: Opaque
stringData:
  HF_TOKEN: {{ .Values.hfToken | quote }}
---
# NGC API key (customer-supplied via .Values.ngcApiKey) used by NIM containers to
# download model weights from NGC at runtime (NGC_API_KEY env var).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vss.fullname" . }}-nvcr-api
  labels:
    {{- include "vss.labels" . | nindent 4 }}
type: Opaque
stringData:
  NGC_API_KEY: {{ .Values.ngcApiKey | quote }}
---
# NGC image-pull secret (customer-supplied via .Values.ngcApiKey) used to pull
# nvcr.io container images. Added alongside the platform-injected registry-pull-secret
# (which continues to serve registry.e2enetworks.net images unchanged).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vss.fullname" . }}-nvcr-pull
  labels:
    {{- include "vss.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "vss.nvcrDockerConfigJson" . }}
---
{{- $secretName := printf "%s-vst-postgres" (include "vss.fullname" .) }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $pgPassword := "" }}
{{- if $existingSecret }}
{{- $pgPassword = index $existingSecret.data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
{{- $pgPassword = .Values.vst.postgres.password | default (randAlphaNum 32) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "vss.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
{{- if and .Values.rtviEmbed.enabled .Values.rtviEmbed.hfToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vss.fullname" . }}-rtvi-embed
  labels:
    {{- include "vss.labels" . | nindent 4 }}
type: Opaque
stringData:
  HF_TOKEN: {{ .Values.rtviEmbed.hfToken | quote }}
{{- end }}
