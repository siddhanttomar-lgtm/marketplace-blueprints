{{- if .Values.alertBridge.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vss.fullname" . }}-alert-bridge
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: alert-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-bridge
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-bridge
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      imagePullSecrets:
        - name: nvcr-pull-secret
      initContainers:
        - name: wait-for-es-and-kafka
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              echo "Waiting for Elasticsearch..."
              MAX_ATTEMPTS=60
              for i in $(seq 1 $MAX_ATTEMPTS); do
                if curl -sf "{{ include "vss.elasticsearchUrl" . }}/_index_template/metropolis_template" > /dev/null 2>&1; then
                  echo "Elasticsearch is ready!"
                  break
                fi
                echo "[$i/$MAX_ATTEMPTS] ES not ready, waiting 10s..."
                sleep 10
              done

              {{- if .Values.kafka.enabled }}
              echo "Waiting for Kafka port to be reachable..."
              until nc -z {{ include "vss.fullname" . }}-kafka {{ .Values.kafka.port }} > /dev/null 2>&1; do
                echo "Kafka not ready, waiting 5s..."
                sleep 5
              done
              echo "Kafka port is reachable!"
              {{- end }}

              exit 0
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: alert-bridge
          image: {{ .Values.alertBridge.image }}
          command: ["/usr/local/bin/python", "enhance_alert_with_vlm.py", "--config", "/app/configs/config.yml"]
          env:
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nvcr-api-secret
                  key: NGC_API_KEY
            - name: PYTHONUNBUFFERED
              value: "1"
          readinessProbe:
            exec:
              command: ["sh", "-c", "echo ready"]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.alertBridge.resources | nindent 12 }}
          volumeMounts:
            - name: alert-bridge-config
              mountPath: /app/configs/config.yml
              subPath: config.yml
            - name: runtime
              mountPath: /app/runtime
      volumes:
        - name: alert-bridge-config
          configMap:
            name: {{ include "vss.fullname" . }}-alert-bridge-config
        - name: runtime
          emptyDir:
            sizeLimit: 10Mi
{{- end }}
