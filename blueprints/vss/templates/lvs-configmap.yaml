{{- if .Values.lvs.enabled }}
# ── LVS config.yaml ──────────────────────────────────────────────────────────
# Mounted at /app/config.yaml inside the container.
# Values use the !ENV YAML custom tag — the LVS application resolves them
# from environment variables at startup (not Helm template substitution).
# Do NOT use Helm template expressions inside the config data block.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vss.fullname" . }}-lvs-config
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: lvs
data:
  config.yaml: |
    tools:
      vector_db:
        type: milvus
        params:
          host: !ENV ${MILVUS_DB_HOST}
          port: !ENV ${MILVUS_DB_GRPC_PORT}
        tools:
          embedding: nvidia_embedding

      elasticsearch_db:
        type: elasticsearch
        params:
          host: !ENV ${ES_HOST}
          port: !ENV ${ES_PORT}
          collection_name: lvs-events
        tools:
          embedding: nvidia_embedding

      summarization_llm:
        type: llm
        params:
          model: !ENV ${LVS_LLM_MODEL_NAME}
          base_url: !ENV ${LVS_LLM_BASE_URL}
          max_tokens: 10240
          temperature: 0.2
          top_p: 0.7
          api_key: !ENV ${LVS_LLM_API_KEY}

      nvidia_embedding:
        type: embedding
        params:
          enable: !ENV ${LVS_EMB_ENABLE:false}
          model: !ENV ${LVS_EMB_MODEL_NAME}
          base_url: !ENV ${LVS_EMB_BASE_URL}
          api_key: !ENV ${NVIDIA_API_KEY}

    functions:
      summarization:
        type: vlm_structured_summarization
        params:
          time_overlap_threshold: 0.1
          time_adjacent_threshold: 5
          max_events_per_batch: 50
          enable_llm_merging: true
        tools:
          db: !ENV ${LVS_DATABASE_BACKEND:elasticsearch_db}
          llm: summarization_llm

      summarization_using_llm:
        type: structured_inference
        params:
          prompts:
            caption: "You are an intelligent monitoring system. You must monitor and take note of all events. Start each event description with a start and end time stamp of the event."
        batch_size: 4
        scenario: "monitoring"
        events: ["anomaly", "access violation", "safety incident", "vehicle event"]
        batch_response_method: "json_schema"
        schema: |
          {
            "title": "EventExtraction",
            "description": "Extract structured events from video captions",
            "type": "object",
            "properties": {
              "events": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "start_time": { "type": "number" },
                    "end_time": { "type": "number" },
                    "description": { "type": "string" },
                    "type": { "type": "string" }
                  },
                  "required": ["start_time", "end_time", "description", "type"]
                }
              }
            },
            "required": ["events"]
          }
        auto_generate_prompt: true
        time_metadata_keys: ["start_pts", "end_pts"]
        tools:
          llm: summarization_llm
          db: !ENV ${LVS_DATABASE_BACKEND:elasticsearch_db}

    context_manager:
      functions:
        - summarization
{{- end }}
