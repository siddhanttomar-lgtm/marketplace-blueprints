{{/*
  Resolve each model's hardware profile independently.
  nim.cosmos.hardwareProfile (if set) overrides the global nim.hardwareProfile.
  nim.nemotron.hardwareProfile (if set) overrides the global nim.hardwareProfile.
  If both are empty, neither ConfigMap is created and the deployments rely on NIM auto-detection.
*/}}
{{- $vlmProfile := coalesce .Values.nim.cosmos.hardwareProfile .Values.nim.hardwareProfile "" }}
{{- $llmProfile := coalesce .Values.nim.nemotron.hardwareProfile .Values.nim.hardwareProfile "" }}

{{- if $vlmProfile }}
# ── VLM ConfigMap — Cosmos reason2-8b (vision model) ─────────────────────────
# cosmos-reason2-8b context limits per GPU:
#   H100 / DGX-SPARK : 32768 tokens
#   H100-shared / L40S: 16384 tokens  (L40S uses LOW_MEMORY to share VRAM with VST sensor)
#   RTXPRO6000BW      : 8192 tokens
#   AGX-THOR          : 4096 tokens
# NIM_DISABLE_MM_PREPROCESSOR_CACHE is mandatory for vision models — stale frame embeddings
# occur when the multi-modal pre-processor cache is reused across video chunks.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vss.fullname" . }}-nim-hw-configs-vlm
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: nim-hw-configs
data:
  HARDWARE_PROFILE: {{ $vlmProfile | quote }}
  NIM_DISABLE_MM_PREPROCESSOR_CACHE: "1"
  NIM_TENSOR_PARALLEL_SIZE: "1"
  {{- if eq $vlmProfile "H100" }}
  NIM_QUANTIZATION: ""
  NIM_MAX_MODEL_LEN: {{ .Values.nim.cosmos.maxModelLen | default "32768" | quote }}
  NIM_KVCACHE_PERCENT: "0.5"
  NIM_MAX_NUM_SEQS: "16"
  {{- else if eq $vlmProfile "H100-shared" }}
  NIM_QUANTIZATION: "fp8"
  NIM_MAX_MODEL_LEN: {{ .Values.nim.cosmos.maxModelLen | default "16384" | quote }}
  NIM_KVCACHE_PERCENT: "0.4"
  NIM_MAX_NUM_SEQS: "4"
  {{- else if eq $vlmProfile "L40S" }}
  NIM_QUANTIZATION: "fp8"
  NIM_MAX_MODEL_LEN: {{ .Values.nim.cosmos.maxModelLen | default "16384" | quote }}
  NIM_KVCACHE_PERCENT: "0.8"
  NIM_MAX_NUM_SEQS: "4"
  NIM_LOW_MEMORY_MODE: "1"
  {{- else if eq $vlmProfile "RTXPRO6000BW" }}
  NIM_QUANTIZATION: "fp8"
  NIM_MAX_MODEL_LEN: {{ .Values.nim.cosmos.maxModelLen | default "8192" | quote }}
  NIM_KVCACHE_PERCENT: "0.4"
  NIM_MAX_NUM_SEQS: "4"
  NIM_LOW_MEMORY_MODE: "1"
  {{- else if eq $vlmProfile "DGX-SPARK" }}
  NIM_QUANTIZATION: ""
  NIM_MAX_MODEL_LEN: {{ .Values.nim.cosmos.maxModelLen | default "32768" | quote }}
  NIM_KVCACHE_PERCENT: "0.8"
  NIM_MAX_NUM_SEQS: "4"
  NIM_DISABLE_CUDA_GRAPH: "1"
  {{- else if eq $vlmProfile "AGX-THOR" }}
  NIM_QUANTIZATION: "int4"
  NIM_MAX_MODEL_LEN: {{ .Values.nim.cosmos.maxModelLen | default "4096" | quote }}
  NIM_KVCACHE_PERCENT: "0.8"
  NIM_MAX_NUM_SEQS: "2"
  {{- else }}
  NIM_QUANTIZATION: ""
  NIM_MAX_MODEL_LEN: {{ .Values.nim.cosmos.maxModelLen | default "16384" | quote }}
  NIM_KVCACHE_PERCENT: "0.5"
  NIM_MAX_NUM_SEQS: "4"
  {{- end }}
{{- end }}
{{- if $llmProfile }}
---
# ── LLM ConfigMap — Nemotron nano-9b-v2 (language model) ─────────────────────
# nemotron-nano-9b-v2 context limits per GPU:
#   H100 / DGX-SPARK: 32768 tokens
#   H100-shared      : 8192 tokens
#   L40S             : 128000 tokens  ← Nemotron can utilise full KV cache on L40S;
#                                        Cosmos cannot (vision pre-processor limits it to 16384)
#   RTXPRO6000BW     : 8192 tokens
#   AGX-THOR         : 4096 tokens
# No NIM_DISABLE_MM_PREPROCESSOR_CACHE — this is a text-only model.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vss.fullname" . }}-nim-hw-configs-llm
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: nim-hw-configs
data:
  HARDWARE_PROFILE: {{ $llmProfile | quote }}
  NIM_TENSOR_PARALLEL_SIZE: "1"
  {{- if eq $llmProfile "H100" }}
  NIM_QUANTIZATION: ""
  NIM_MAX_MODEL_LEN: {{ .Values.nim.nemotron.maxModelLen | default "32768" | quote }}
  NIM_KVCACHE_PERCENT: "0.5"
  NIM_MAX_NUM_SEQS: "16"
  {{- else if eq $llmProfile "H100-shared" }}
  NIM_QUANTIZATION: "fp8"
  NIM_MAX_MODEL_LEN: {{ .Values.nim.nemotron.maxModelLen | default "8192" | quote }}
  NIM_KVCACHE_PERCENT: "0.4"
  NIM_MAX_NUM_SEQS: "4"
  {{- else if eq $llmProfile "L40S" }}
  NIM_QUANTIZATION: "fp8"
  NIM_MAX_MODEL_LEN: {{ .Values.nim.nemotron.maxModelLen | default "128000" | quote }}
  NIM_KVCACHE_PERCENT: "0.8"
  NIM_MAX_NUM_SEQS: "4"
  NIM_LOW_MEMORY_MODE: "1"
  {{- else if eq $llmProfile "RTXPRO6000BW" }}
  NIM_QUANTIZATION: "fp8"
  NIM_MAX_MODEL_LEN: {{ .Values.nim.nemotron.maxModelLen | default "8192" | quote }}
  NIM_KVCACHE_PERCENT: "0.4"
  NIM_MAX_NUM_SEQS: "4"
  NIM_LOW_MEMORY_MODE: "1"
  {{- else if eq $llmProfile "DGX-SPARK" }}
  NIM_QUANTIZATION: ""
  NIM_MAX_MODEL_LEN: {{ .Values.nim.nemotron.maxModelLen | default "32768" | quote }}
  NIM_KVCACHE_PERCENT: "0.8"
  NIM_MAX_NUM_SEQS: "4"
  NIM_DISABLE_CUDA_GRAPH: "1"
  {{- else if eq $llmProfile "AGX-THOR" }}
  NIM_QUANTIZATION: "int4"
  NIM_MAX_MODEL_LEN: {{ .Values.nim.nemotron.maxModelLen | default "4096" | quote }}
  NIM_KVCACHE_PERCENT: "0.8"
  NIM_MAX_NUM_SEQS: "2"
  {{- else }}
  NIM_QUANTIZATION: ""
  NIM_MAX_MODEL_LEN: {{ .Values.nim.nemotron.maxModelLen | default "16384" | quote }}
  NIM_KVCACHE_PERCENT: "0.5"
  NIM_MAX_NUM_SEQS: "4"
  {{- end }}
{{- end }}
