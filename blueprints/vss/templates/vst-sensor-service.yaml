apiVersion: v1
kind: Service
metadata:
  name: {{ include "vss.fullname" . }}-vst-sensor
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: vst-sensor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vst-sensor
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.vst.sensor.port }}
      targetPort: {{ .Values.vst.sensor.port }}
