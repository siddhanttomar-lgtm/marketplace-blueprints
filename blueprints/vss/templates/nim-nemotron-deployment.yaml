apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vss.fullname" . }}-nim-nemotron
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: nim-nemotron
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nim-nemotron
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nim-nemotron
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      runtimeClassName: nvidia
      {{- with .Values.nim.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      imagePullSecrets:
        - name: registry-pull-secret
        - name: {{ include "vss.fullname" . }}-nvcr-pull
      initContainers:
        - name: init-cache-permissions
          image: registry.e2enetworks.net/marketplace-blueprint/busybox:1.36
          command: ['sh', '-c', 'chown -R 1000:1000 /opt/nim/.cache || true']
          volumeMounts:
            - name: nim-cache
              mountPath: /opt/nim/.cache
      containers:
        - name: nemotron-nano-9b
          image: {{ .Values.nim.nemotron.image }}
          envFrom:
            - configMapRef:
                name: {{ include "vss.fullname" . }}-nim-hw-configs-llm
                optional: true
          env:
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vss.fullname" . }}-nvcr-api
                  key: NGC_API_KEY
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: NIM_GPU_MEMORY_FRACTION
              value: {{ .Values.nim.nemotron.gpuMemoryFraction | default "0.52" | quote }}
            # NIM_SERVED_MODEL_NAME makes the /v1/models API return the hub model ID that
            # vss-agent references (e.g. "nvidia/nvidia-nemotron-nano-9b-v2").
            - name: NIM_SERVED_MODEL_NAME
              value: {{ .Values.nim.nemotron.modelName | quote }}
            - name: LLM_DEVICE_ID
              value: {{ .Values.gpu.llmDeviceId | quote }}
            - name: CUDA_VISIBLE_DEVICES
              value: {{ .Values.gpu.llmDeviceId | quote }}
          ports:
            - containerPort: {{ .Values.nim.nemotron.port }}
              name: http
          # Readiness: /tmp/ready_done marker (NVIDIA pattern) — waits up to 10 min
          # for model download on first probe, then switches to fast /live checks.
          # timeoutSeconds: 650 matches NVIDIA's tested 40GB download window.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  if [ -f /tmp/ready_done ]; then
                    curl --max-time 30 -sf http://localhost:{{ .Values.nim.nemotron.port }}/v1/health/live > /dev/null 2>&1
                  else
                    elapsed=0
                    while ! curl -fs http://localhost:{{ .Values.nim.nemotron.port }}/v1/health/ready > /dev/null 2>&1; do
                      sleep 5; elapsed=$((elapsed + 5))
                      if [ $elapsed -ge 600 ]; then echo "NIM not ready within 10min"; exit 1; fi
                    done
                    touch /tmp/ready_done
                    curl --max-time 30 -sf http://localhost:{{ .Values.nim.nemotron.port }}/v1/health/live > /dev/null 2>&1
                  fi
            initialDelaySeconds: 0
            periodSeconds: 60
            timeoutSeconds: 650
            failureThreshold: 2
            successThreshold: 1
          # Liveness: gates on /tmp/ready_done — never kills pod during model download.
          # Once marker exists, checks /live; if marker absent, exits 0 (healthy).
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "[ -f /tmp/ready_done ] && curl --max-time 10 -sf http://localhost:{{ .Values.nim.nemotron.port }}/v1/health/live > /dev/null 2>&1 || exit 0"
            initialDelaySeconds: 0
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: {{ .Values.nim.nemotron.resources.requests.memory }}
              cpu: {{ .Values.nim.nemotron.resources.requests.cpu }}
            limits:
              memory: {{ .Values.nim.nemotron.resources.limits.memory }}
              cpu: {{ .Values.nim.nemotron.resources.limits.cpu }}
              nvidia.com/gpu: {{ .Values.nim.nemotron.gpuCount | quote }}
          volumeMounts:
            - name: nim-cache
              mountPath: /opt/nim/.cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: nim-cache
          persistentVolumeClaim:
            claimName: {{ include "vss.fullname" . }}-nim-nemotron-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.nim.nemotron.shmSize }}
