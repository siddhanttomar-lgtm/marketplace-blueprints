{{- if .Values.lvs.enabled }}
# ── LVS data PVC ──────────────────────────────────────────────────────────────
# Used as MODEL_ROOT_DIR (/opt/models/) for temporary video processing artifacts.
# LVS writes decoded frames and intermediate outputs here during summarization.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vss.fullname" . }}-lvs-data
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: lvs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.lvs.storage.dataSize }}
{{- end }}
