{{- if .Values.vssAgentMcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vss.fullname" . }}-vss-agent-mcp
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: vss-agent-mcp
    app.kubernetes.io/part-of: vss-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vss-agent-mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vss-agent-mcp
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: vss-agent-mcp
    spec:
      imagePullSecrets:
        - name: nvcr-pull-secret
      containers:
        - name: vss-agent-mcp
          image: {{ .Values.vssAgentMcp.image }}
          args:
            - "mcp"
            - "serve"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ .Values.vssAgentMcp.port | quote }}
          ports:
            - containerPort: {{ .Values.vssAgentMcp.port }}
              name: http-mcp
          env:
            - name: VSS_VA_MCP_PORT
              value: {{ .Values.vssAgentMcp.port | quote }}
            - name: VSS_AGENT_HOST
              value: {{ include "vss.fullname" . }}-vss-agent
            - name: VSS_AGENT_PORT
              value: {{ .Values.vssAgent.port | quote }}
            - name: VSS_ES_PORT
              value: {{ .Values.elasticsearch.port | quote }}
            - name: VST_MCP_URL
              value: {{ include "vss.vstMcpUrl" . | quote }}
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nvcr-api-secret
                  key: NGC_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.vssAgentMcp.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.vssAgentMcp.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.vssAgentMcp.resources | nindent 12 }}
{{- end }}
