{{- if .Values.vst.envoy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vss.fullname" . }}-vst-envoy
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: vst-envoy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vst-envoy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.vst.envoy.port }}
      targetPort: {{ .Values.vst.envoy.port }}
{{- end }}
