apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vss.fullname" . }}-vss-ui
  labels:
    {{- include "vss.labels" . | nindent 4 }}
    app.kubernetes.io/component: vss-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vss-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vss-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      imagePullSecrets:
        - name: nvcr-pull-secret
      containers:
        - name: vss-ui
          image: {{ .Values.vssUi.image }}
          env:
            - name: HOST_IP
              value: "0.0.0.0"
            - name: EXTERNAL_IP
              value: {{ if .Values.ingress.enabled }}{{ include "vss.uiHost" . | quote }}{{ else }}{{ .Values.externalIp | quote }}{{ end }}
            - name: VSS_AGENT_PORT
              value: {{ .Values.vssAgent.port | quote }}
            - name: RUN_APP_NAME
              value: "nv-metropolis-bp-vss-ui"
            - name: NEXT_PUBLIC_APP_TITLE
              value: {{ .Values.vssUi.appTitle | quote }}
            - name: NEXT_PUBLIC_APP_SUBTITLE
              value: {{ .Values.vssUi.appSubtitle | quote }}
            # Chat tab
            - name: NEXT_PUBLIC_ENABLE_CHAT_TAB
              value: "true"
            - name: NEXT_PUBLIC_WORKFLOW
              value: "VSS Agent"
            {{- if .Values.ingress.enabled }}
            - name: NEXT_PUBLIC_WEBSOCKET_CHAT_COMPLETION_URL
              value: "wss://{{ include "vss.agentHost" . }}/websocket"
            - name: NEXT_PUBLIC_HTTP_CHAT_COMPLETION_URL
              value: "https://{{ include "vss.agentHost" . }}/chat/stream"
            - name: NEXT_PUBLIC_AGENT_API_URL_BASE
              value: "https://{{ include "vss.agentHost" . }}/api/v1"
            {{- else }}
            - name: NEXT_PUBLIC_WEBSOCKET_CHAT_COMPLETION_URL
              value: "ws://{{ .Values.externalIp }}:{{ .Values.vssAgent.nodePort }}/websocket"
            - name: NEXT_PUBLIC_HTTP_CHAT_COMPLETION_URL
              value: "http://{{ include "vss.fullname" . }}-vss-agent:{{ .Values.vssAgent.port }}/chat/stream"
            - name: NEXT_PUBLIC_AGENT_API_URL_BASE
              value: "http://{{ .Values.externalIp }}:{{ .Values.vssAgent.nodePort }}/api/v1"
            {{- end }}
            - name: NEXT_PUBLIC_WEB_SOCKET_DEFAULT_ON
              value: "false"
            - name: NEXT_PUBLIC_ENABLE_INTERMEDIATE_STEPS
              value: "true"
            - name: NEXT_PUBLIC_CHAT_UPLOAD_FILE_ENABLE
              value: "true"
            - name: NEXT_PUBLIC_DARK_THEME_DEFAULT
              value: "true"
            # Other tabs
            - name: NEXT_PUBLIC_ENABLE_ALERTS_TAB
              value: {{ or .Values.rtviVlm.enabled .Values.alertBridge.enabled | quote }}
            - name: NEXT_PUBLIC_ENABLE_SEARCH_TAB
              value: {{ .Values.rtviEmbed.enabled | quote }}
            - name: NEXT_PUBLIC_ENABLE_DASHBOARD_TAB
              value: "false"
            - name: NEXT_PUBLIC_ENABLE_MAP_TAB
              value: "false"
            - name: NEXT_PUBLIC_ENABLE_VIDEO_MANAGEMENT_TAB
              value: "true"
            - name: NEXT_PUBLIC_VIDEO_MANAGEMENT_TAB_ADD_RTSP_ENABLE
              value: "false"
            - name: NEXT_PUBLIC_VIDEO_MANAGEMENT_VIDEO_UPLOAD_ENABLE
              value: "true"
            {{- if .Values.ingress.enabled }}
            - name: NEXT_PUBLIC_VST_API_URL
              value: "https://{{ include "vss.vstHost" . }}/vst/api"
            - name: NEXT_PUBLIC_MDX_WEB_API_URL
              value: "https://{{ include "vss.uiHost" . }}"
            {{- else }}
            - name: NEXT_PUBLIC_VST_API_URL
              value: "http://{{ .Values.externalIp }}:{{ .Values.vst.ingress.nodePort }}/vst/api"
            - name: NEXT_PUBLIC_MDX_WEB_API_URL
              value: "http://{{ .Values.externalIp }}:{{ .Values.vssUi.mdxWebApiPort }}"
            {{- end }}
          ports:
            - containerPort: {{ .Values.vssUi.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.vssUi.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.vssUi.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.vssUi.resources | nindent 12 }}
