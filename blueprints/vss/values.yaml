# ═══════════════════════════════════════════════════════════════════════════════
# NVIDIA VSS Blueprint — Helm values  (chart v1.1.0 / appVersion 3.1.0)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Feature tiers — enable/disable independently:
#
#   BASE (always on)
#     • Chat Q&A with video content (vss-agent + Cosmos VLM + Nemotron LLM)
#     • Video upload, storage and management (VST — 7-service NVIDIA stack)
#     • VSS UI: chat tab + video management tab
#
#   SEARCH  (rtviEmbed.enabled=true)
#     • Semantic video search — "find clips with red cars"
#     • Indexes video frames as vector embeddings via Cosmos-Embed1-448p
#     • Requires Kafka + ~10GB HuggingFace model download + GPU node
#     • Enables: VSS UI search tab, vss-agent streaming_ingest config
#
#   ALERTS  (rtviVlm.enabled=true)
#     • Real-time AI alert generation from live video streams
#     • Delegates inference to in-cluster Cosmos NIM (openai-compat, no extra GPU)
#     • Requires Kafka
#     • Enables: VSS UI alerts tab, vss-agent rtvi_vlm_alert + rtvi_prompt_gen tools
#
#   LONG VIDEO  (lvs.enabled=true)
#     • RAG-based analysis of hours-long recordings
#     • Chunks video → LLM summarization → Elasticsearch index → retrieval Q&A
#     • CPU-only service; delegates VLM/LLM to in-cluster NIMs
#     • Requires Elasticsearch (enabled by default)
#     • Standalone frontend UI at http://<externalIp>:<lvs.frontendNodePort>
#     • Enables: vss-agent lvs_video_understanding tool via report_agent
#
#   INFRASTRUCTURE (optional)
#     • Kafka (kafka.enabled=true)       — required for SEARCH + ALERTS pipelines
#     • Kibana (kibana.enabled=true)     — Elasticsearch dashboard visualisation
#     • Logstash (logstash.enabled=true) — Kafka → Elasticsearch event bridge
#     • Phoenix (phoenix.enabled=true)   — LLM tracing and observability (default on)
#     • Alert Bridge (alertBridge.enabled=true) — VLM-as-verifier for Kafka alerts
#
# ─────────────────────────────────────────────
# Required user inputs
# ─────────────────────────────────────────────
ngcApiKey: ""          # NGC API key (nvapi-...) — required to pull all nvcr.io images and download NIM model weights
externalIp: ""         # Public IP of the node where this is deployed (e.g. 164.52.204.164) — used for NodePort URLs in browser
hfToken: ""            # HuggingFace token (optional) — improves download rate limits for public models; get one free at huggingface.co/settings/tokens

# ─────────────────────────────────────────────
# GPU Device Assignment
# On single-GPU nodes: leave all at "0".
# On multi-GPU nodes: assign each role to a specific device ID.
# Note: in Kubernetes the device plugin sets CUDA_VISIBLE_DEVICES automatically;
# these values are a hint for bare-metal / VM deployments and for VST services
# which use GPU_DEVICES directly.
# ─────────────────────────────────────────────
gpu:
  deviceIds: "0"      # Default device for VST sensor / streamprocessing (GPU_DEVICES)
  vlmDeviceId: "0"    # Cosmos VLM (VLM_DEVICE_ID + CUDA_VISIBLE_DEVICES)
  llmDeviceId: "0"    # Nemotron LLM (LLM_DEVICE_ID + CUDA_VISIBLE_DEVICES)

# ─────────────────────────────────────────────
# NIM (Neural Inference Microservices)
# ─────────────────────────────────────────────
ownGpu: false  # false = E2E managed GPU node (sslip.io URL, no IP needed); true = customer's own GPU VM (user provides externalIp)

# ─────────────────────────────────────────────
# Ingress — HAProxy Ingress for marketplace deployments (ownGpu=false)
# Platform auto-generates: ingress.host = vss-<hash>.172-16-230-151.sslip.io
# Set ingress.enabled=true and ingress.host via helm_extra_config for marketplace.
# ─────────────────────────────────────────────
ingress:
  enabled: false
  className: "haproxy"
  # baseDomain: IP with dashes + .sslip.io — injected by catalog.py helm_extra_config.
  # Hostnames derived from {{ .Release.Name }}:
  #   UI:    {{ .Release.Name }}.baseDomain  → vss-abc.172-16-230-151.sslip.io
  #   Agent: {{ .Release.Name }}-api.baseDomain → vss-abc-api.172-16-230-151.sslip.io
  #   VST:   {{ .Release.Name }}-vst.baseDomain → vss-abc-vst.172-16-230-151.sslip.io
  baseDomain: ""
  annotations:
    haproxy.router.openshift.io/timeout: 5m

# ─────────────────────────────────────────────
nim:
  # Kept for backwards compatibility — use ownGpu instead.
  # NIM pods always deploy into the same cluster as all other VSS services.

  # Global hardware profile — applies to both Cosmos (VLM) and Nemotron (LLM) unless overridden below.
  # Options: H100, H100-shared, L40S, RTXPRO6000BW, DGX-SPARK, AGX-THOR
  # Leave empty ("") to use NIM auto-detection (no hw-config ConfigMap created).
  hardwareProfile: "H100"

  cosmos:
    image: nvcr.io/nim/nvidia/cosmos-reason2-8b:1.6.0
    modelName: "nvidia/cosmos-reason2-8b"
    port: 8000
    gpuCount: 1
    shmSize: 32Gi
    cacheSize: 80Gi
    gpuMemoryFraction: "0.44"
    # Per-model hardware profile override (leave empty to inherit nim.hardwareProfile).
    # Use when Cosmos and Nemotron run on different GPU types.
    hardwareProfile: ""
    # Per-model context length override (leave empty to use profile-based default).
    # cosmos-reason2-8b profile defaults: H100=32768, L40S=16384, RTXPRO6000BW=8192, AGX-THOR=4096
    maxModelLen: ""
    resources:
      requests:
        memory: "8Gi"
        cpu: "2"
      limits:
        memory: "40Gi"
        cpu: "8"
        nvidia.com/gpu: "1"

  nemotron:
    image: nvcr.io/nim/nvidia/nvidia-nemotron-nano-9b-v2:1
    modelName: "nvidia/nvidia-nemotron-nano-9b-v2"
    port: 8000
    gpuCount: 1
    shmSize: 16Gi
    cacheSize: 40Gi
    gpuMemoryFraction: "0.52"
    # Per-model hardware profile override (leave empty to inherit nim.hardwareProfile).
    hardwareProfile: ""
    # Per-model context length override (leave empty to use profile-based default).
    # nemotron-nano-9b-v2 profile defaults: H100=32768, L40S=128000, RTXPRO6000BW=8192, AGX-THOR=4096
    # NOTE: L40S default is 128000 for Nemotron (vs 16384 for Cosmos — vision pre-processor limits Cosmos).
    maxModelLen: ""
    resources:
      requests:
        memory: "8Gi"
        cpu: "2"
      limits:
        memory: "20Gi"
        cpu: "8"
        nvidia.com/gpu: "1"

# ─────────────────────────────────────────────
# VSS Agent
# ─────────────────────────────────────────────
vssAgent:
  image: nvcr.io/nvidia/vss-core/vss-agent:3.1.0
  port: 8000
  nodePort: 30889    # NodePort — browser uses this for video upload + agent API calls
  # Blueprint profile — controls which Elasticsearch templates and NIM pipelines are active.
  # bp_developer_base: no dense_vector embedding fields (default, minimal resource usage)
  # bp_developer_search: enables 1536-dim RTVI CV + 768-dim Vision LLM dense_vector fields
  bpProfile: "bp_developer_base"
  templatePath: "/vss-agent/templates"
  templateName: "default"
  # Evaluation harness (optional — used when running built-in eval module)
  evalLlmJudgeName: ""   # defaults to LLM_NAME when empty
  evalLlmJudgeBaseUrl: ""  # defaults to LLM_BASE_URL when empty
  evalDir: "/vss-agent/eval"
  datasetDir: "/vss-agent/datasets"
  evalOutputDir: "/vss-agent/eval_output"
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2"

# ─────────────────────────────────────────────
# VSS Agent MCP Server (optional)
# Model Context Protocol server for video analysis
# Required for advanced agent workflows and tool integrations
# ─────────────────────────────────────────────
vssAgentMcp:
  enabled: false
  image: nvcr.io/nvidia/vss-core/vss-agent:3.1.0  # same image as vssAgent, different command
  port: 8001
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2"

# ─────────────────────────────────────────────
# VSS UI
# ─────────────────────────────────────────────
vssUi:
  image: nvcr.io/nvidia/vss-core/vss-agent-ui:3.1.0
  port: 3000
  nodePort: 30890        # NodePort for UI when ownGpu=true (direct browser access)
  mdxWebApiPort: 8081    # Placeholder for Kibana/MDX observability (unused in base profile)
  appTitle: "VSS Blueprint"
  appSubtitle: "Video Intelligence"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ─────────────────────────────────────────────
# Kafka — disabled by default (not needed for bp_developer_base profile)
# Enable only when using alerts/search tabs
# ─────────────────────────────────────────────
kafka:
  enabled: false
  image: registry.e2enetworks.net/marketplace-blueprint/confluentinc/cp-kafka:8.1.1
  port: 9092
  storageSize: 10Gi
  heapOpts: "-Xmx6G -Xms6G"
  resources:
    requests:
      memory: "6Gi"
      cpu: "500m"
    limits:
      memory: "8Gi"
      cpu: "2"

# ─────────────────────────────────────────────
# Redis
# ─────────────────────────────────────────────
redis:
  image: registry.e2enetworks.net/marketplace-blueprint/library/redis:8.2.2-alpine
  port: 6379
  storageSize: 5Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# ─────────────────────────────────────────────
# Elasticsearch
# ─────────────────────────────────────────────
elasticsearch:
  image: registry.e2enetworks.net/marketplace-blueprint/docker.elastic.co/elasticsearch/elasticsearch:9.3.0
  port: 9200
  storageSize: 20Gi
  javaOpts: "-Xmx1024m -Xms256m"
  # ILM delete policy min_age — NVIDIA default is 4h. Increase for longer event retention.
  ilmMinAge: "4h"
  # Embedding vector dimensions for dense_vector fields (bp_developer_search profile only).
  # RTVI CV model: 1536 dims; Vision LLM (Cosmos): 768 dims.
  rtviCvEmbeddingsDim: "1536"
  visionLlmEmbeddingsDim: "768"
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2"

# ─────────────────────────────────────────────
# VST (Video Storage Toolkit) — NVIDIA 5-service architecture
# ─────────────────────────────────────────────
vst:
  sensor:
    image: nvcr.io/nvidia/vss-core/vss-vios-sensor:3.1.0
    port: 30000
    adaptor: vst_rtsp
    dataSize: 50Gi
    requireGpu: false  # Set true on GPU nodes — adds runtimeClassName: nvidia
    resources:
      requests:
        memory: "2Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"

  streamprocessing:
    image: nvcr.io/nvidia/vss-core/vss-vios-streamprocessing:3.1.0
    port: 30001
    rtspPort: 30554
    dataSize: 50Gi
    requireGpu: false  # Set true on GPU nodes
    resources:
      requests:
        memory: "2Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"

  ingress:
    image: nvcr.io/nvidia/vss-core/vss-vios-ingress:3.1.0
    port: 30888
    nodePort: 30892  # NodePort — browser uses this for video list + upload
    logSize: 5Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"

  mcp:
    enabled: true
    image: nvcr.io/nvidia/vss-core/vss-vios-mcp:3.1.0
    port: 8001
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"

  postgres:
    image: registry.e2enetworks.net/marketplace-blueprint/library/postgres:17.6-alpine
    port: 5432
    dbSize: 50Gi
    user: vst
    database: nvcentralizedb
    password: ""   # Leave empty to auto-generate a random 32-char password on first install (recommended). Set explicitly to pin a specific password across upgrades.
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"

  sdr:
    enabled: true
    image: nvcr.io/nvidia/vss-core/sdr:3.1.0
    port: 4003
    resources:
      requests:
        memory: "300Mi"
        cpu: "100m"
      limits:
        memory: "300Mi"

  envoy:
    enabled: true
    image: nvcr.io/nvidia/vss-core/envoy-proxy:3.1.0
    port: 10000
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"

# ─────────────────────────────────────────────
# Phoenix (observability, optional)
# ─────────────────────────────────────────────
phoenix:
  enabled: true
  image: registry.e2enetworks.net/marketplace-blueprint/arizephoenix/phoenix:version-8.12.1
  port: 6006
  storageSize: 5Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# ─────────────────────────────────────────────
# Kibana (dashboard visualisation, optional)
# Disabled by default — enable when Elasticsearch analytics dashboards are needed
# ─────────────────────────────────────────────
kibana:
  enabled: false
  image: registry.e2enetworks.net/marketplace-blueprint/docker.elastic.co/kibana/kibana:9.3.0
  port: 5601
  resources:
    requests:
      memory: "1Gi"
      cpu: "200m"
    limits:
      memory: "2Gi"
      cpu: "1"

# ─────────────────────────────────────────────
# Logstash (event pipeline, optional)
# ─────────────────────────────────────────────
# Disabled by default — requires kafka.enabled=true
# Protobuf definitions (schema_pb.rb, ext_pb.rb, *.desc) are bundled in the chart.
# ─────────────────────────────────────────────
logstash:
  enabled: false
  image: registry.e2enetworks.net/marketplace-blueprint/docker.elastic.co/logstash/logstash:9.3.0
  beatsPort: 5044
  apiPort: 9600
  javaOpts: "-Xmx1g -Xms512m"

  # Protobuf class names — must match class names in schema_pb.rb / ext_pb.rb.
  # Defaults match NVIDIA MDX bundle (nv.* namespace).
  # Consumer threads per Kafka input — NVIDIA reference uses 4. Set to 1 for constrained clusters.
  consumerThreads: 4

  protobuf:
    classNames:
      frame: "nv.Frame"
      behavior: "nv.Behavior"
      incident: "nv.Incident"
      spaceUtilization: "nv.SpaceUtilization"
      vlm: "nv.VisionLLM"
      bev: "nv.Frame"   # mdx-bev topic not in compose ref; nv.Frame is safest default

  resources:
    requests:
      memory: "1Gi"
      cpu: "200m"
    limits:
      memory: "2Gi"
      cpu: "1"

# ─────────────────────────────────────────────
# Alert Bridge / VLM-as-Verifier (optional)
# Disabled by default — requires kafka.enabled=true and VLM to be reachable
# Consumes mdx-alerts, verifies via Cosmos VLM, publishes to mdx-alerts-verified
# ─────────────────────────────────────────────
alertBridge:
  enabled: false
  image: nvcr.io/nvidia/vss-core/vss-alert-verification:3.1.0
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1"

# ─────────────────────────────────────────────
# RTVI Embed (Real-Time Vision Inference Embed)
# Disabled by default — requires a GPU node and ~10GB HuggingFace model download.
# Enables semantic video search: index video frames as vector embeddings so
# users can search by text description ("find clips with red cars").
#
# When enabled: sets NEXT_PUBLIC_ENABLE_SEARCH_TAB=true in the UI automatically.
# Requires kafka.enabled=true for streaming ingest pipeline.
# ─────────────────────────────────────────────
rtviEmbed:
  enabled: false
  image: nvcr.io/nvidia/vss-core/vss-rt-embed:3.1.0
  port: 8017           # Service port the vss-agent calls; container internally listens on 8000
  gpuCount: 1

  # HuggingFace model download path. The service downloads ~10GB Cosmos-Embed1-448p
  # on first start and caches it in the rtvi-hf-cache PVC.
  modelPath: "git:https://huggingface.co/nvidia/Cosmos-Embed1-448p"
  # Short model ID used in the /v1/generate_video_embeddings API request body.
  embedModelName: "cosmos-embed1-448p"
  # Chunk duration in seconds for embedding generation (default: 5s per chunk).
  chunkDuration: 5

  # Optional HuggingFace token (only needed if the model is gated).
  # Cosmos-Embed1-448p is publicly accessible; leave empty unless NVIDIA gates it.
  hfToken: ""

  # Kafka topic for streaming video ingest (only used when kafka.enabled=true).
  kafkaTopic: "mdx-embed"
  kafkaErrorTopic: "vss-embed-errors"

  logLevel: "INFO"

  # Performance tuning
  batchSize: 1
  numVlmProcs: 1
  numGpus: 1
  enableRequestProfiling: false

  # Shared memory for Triton inference server.
  # Replaces Docker Compose ipc: host — must fit in the node's available memory.
  shmSize: "32Gi"

  resources:
    requests:
      memory: "8Gi"
      cpu: "2"
    limits:
      memory: "16Gi"
      cpu: "4"

  storage:
    # HuggingFace cache — Cosmos-Embed1-448p model weights (~10GB)
    hfCacheSize: "50Gi"
    # NGC model cache — compiled Triton model repository (~5GB after first build)
    ngcCacheSize: "20Gi"

# ─────────────────────────────────────────────
# RTVI VLM (Real-Time Vision Language Model)
# Disabled by default — requires rtviVlm.enabled=true and kafka.enabled=true.
# Enables real-time AI alert generation from live video streams:
#   "person entering restricted zone", "vehicle collision at junction"
#
# Architecture: Uses openai-compat mode to delegate inference to the
# in-cluster Cosmos NIM pod (no second model download). rtvi-vlm acts as a
# GStreamer streaming wrapper around the shared NIM.
#
# When enabled:
#   - NEXT_PUBLIC_ENABLE_ALERTS_TAB=true in the UI
#   - rtvi_vlm_alert + rtvi_prompt_gen tools added to the vss-agent workflow
#   - RTVI_VLM_BASE_URL env var set in vss-agent deployment
# ─────────────────────────────────────────────
rtviVlm:
  enabled: false
  image: nvcr.io/nvidia/vss-core/vss-rt-vlm:3.1.0
  port: 8018           # Service port the vss-agent calls; container internally listens on 8000
  gpuCount: 1

  # VLM model name — must match nim.cosmos.modelName.
  # rtvi-vlm uses openai-compat mode and forwards all inference to the Cosmos NIM pod.
  vlmModelName: "nvidia/cosmos-reason2-8b"

  # Context length used if the user switches VLM_MODEL_TO_USE away from openai-compat.
  # In openai-compat mode (default) this is unused — Cosmos NIM controls context length.
  vlmMaxModelLen: "32768"

  # Kafka topics (only used when kafka.enabled=true).
  # These match the MDX foundational topic names created by the kafka-init-job.
  kafkaTopic: "mdx-vlm"
  kafkaIncidentTopic: "mdx-vlm-incidents"
  kafkaErrorTopic: "vision-llm-errors"

  logLevel: "INFO"

  # Batch processing
  batchSize: 1
  numVlmProcs: 1
  numGpus: 1

  # Input dimensions — must match Cosmos model expected resolution
  inputWidth: 1312
  inputHeight: 736

  # GPU memory management (vLLM engine settings)
  gpuMemoryUtilization: "0.85"
  maxNumSeqs: 256
  maxNumBatchedTokens: 5120
  enablePrefixCaching: true

  # Video codec support (set to "1" to enable custom GStreamer parser modifications)
  enableCustomParserModifications: "1"
  installProprietaryCodecs: false

  # RTSP stream settings (leave empty to use RTVI defaults)
  rtspLatency: ""
  rtspTimeout: ""
  rtspReconnectionInterval: 5
  rtspReconnectionMaxAttempts: 10

  # System prompt override (empty = use built-in RTVI prompt)
  systemPrompt: ""

  # Shared memory for GStreamer pipeline buffers (replaces Docker Compose shm_size: 16gb).
  shmSize: "16Gi"

  resources:
    requests:
      memory: "8Gi"
      cpu: "2"
    limits:
      memory: "16Gi"
      cpu: "4"

# ─────────────────────────────────────────────
# LVS (Long Video Summarization)
# Disabled by default — requires Elasticsearch and Nemotron NIM to be running.
# Provides RAG-based analysis of extended video recordings (hours-long footage):
#   - Ingests video frames → chunks → LLM summarization → Elasticsearch index
#   - User queries answered against the indexed summaries (retrieval-augmented)
#
# Architecture:
#   - CPU-only service (GPU optional for embedding; disabled by default)
#   - Delegates VLM inference to in-cluster Cosmos NIM (openai-compat mode)
#   - Delegates LLM summarization to in-cluster Nemotron NIM
#   - Exposes its own standalone frontend UI on frontendNodePort (NOT a VSS UI tab)
#   - vss-agent routes video report requests through lvs_video_understanding tool
#     (report_agent → video_report_gen → lvs_video_understanding → LVS backend API)
# ─────────────────────────────────────────────
lvs:
  enabled: false
  image: nvcr.io/nvidia/vss-core/vss-long-video-summarization:3.1.0

  # Service ports — LVS listens on these directly (no port remapping like rtvi services)
  backendPort: 38111    # REST API — vss-agent lvs_video_understanding tool calls this
  mcpPort: 38112        # MCP gateway — external tool integrations
  frontendPort: 38113   # Standalone React/Gradio UI

  # NodePort for browser access to the LVS standalone UI.
  # Set to 0 or omit to skip the NodePort Service (ClusterIP-only install).
  # Access: http://<externalIp>:<frontendNodePort>
  frontendNodePort: 30893

  # Elasticsearch as the vector/document store for summarization results.
  # "milvus" is also supported when .Values.milvus.enabled=true.
  databaseBackend: "elasticsearch_db"

  # LLM context length for the summarization pass (max tokens in a single LLM call).
  llmMaxTokens: 10240

  # Embedding service — set true only when rtviEmbed.enabled=true and you want
  # LVS to use Cosmos-Embed1-448p for semantic frame indexing (higher recall).
  # When false, LVS uses the LLM summarization path only (default, simpler).
  embeddingEnabled: false
  embeddingModelName: "cosmos-embed1-448p"   # must match rtviEmbed.embedModelName

  resources:
    requests:
      memory: "4Gi"
      cpu: "2"
    limits:
      memory: "8Gi"
      cpu: "4"

  storage:
    # Temporary video processing artifacts (decoded frames, intermediate outputs).
    # LVS writes here during summarization; data is not permanently retained.
    dataSize: "100Gi"
