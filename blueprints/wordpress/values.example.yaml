# WordPress — example configuration
# Copy this file, fill in required values, and pass to helm install:
#   helm install wordpress blueprints/wordpress -f my-values.yaml

# ── Required ──────────────────────────────────────────────────────────────────

wordpressUsername: admin
wordpressPassword: "YOUR-STRONG-PASSWORD-HERE"
wordpressEmail: "admin@example.com"
wordpressBlogName: "My Blog"

# ── Networking ────────────────────────────────────────────────────────────────

service:
  type: LoadBalancer    # use NodePort if LoadBalancer is not available

# ── Storage ───────────────────────────────────────────────────────────────────

persistence:
  size: 10Gi
  storageClass: ""    # leave empty for cluster default

# ── Database (bundled MariaDB) ────────────────────────────────────────────────

mariadb:
  auth:
    rootPassword: "YOUR-DB-ROOT-PASSWORD-HERE"
  primary:
    persistence:
      size: 8Gi
      storageClass: ""
