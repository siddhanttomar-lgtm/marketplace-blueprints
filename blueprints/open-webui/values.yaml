replicaCount: 1

model: "qwen2.5:0.5b"

imagePullSecrets:
  - name: registry-pull-secret

# External LLM API keys — leave empty to use only local Ollama
openaiApiKey: ""
anthropicApiKey: ""
groqApiKey: ""
googleApiKey: ""
fireworksApiKey: ""
mistralApiKey: ""
perplexityApiKey: ""

ollama:
  image:
    repository: registry.e2enetworks.net/marketplace-blueprint/ollama
    tag: "0.6.5"
    pullPolicy: IfNotPresent
  storage:
    size: 20Gi
    storageClass: ""
  gpu:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

litellm:
  image:
    repository: ghcr.io/berriai/litellm
    tag: "main-stable"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

webui:
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: "v0.9.5"
    pullPolicy: IfNotPresent
  adminEmail: ""
  adminPassword: "OpenWebUI@12345"
  storage:
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

whisper:
  image:
    repository: registry.e2enetworks.net/marketplace-blueprint/fedirz/faster-whisper-server
    tag: "0.5.0-cpu"
    pullPolicy: IfNotPresent
  model: "tiny"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

persistence:
  accessMode: ReadWriteOnce
