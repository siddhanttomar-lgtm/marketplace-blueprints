# Open WebUI with Ollama — example values
# helm install open-webui blueprints/open-webui -f my-values.yaml

# Default model pulled on first startup
model: "qwen2.5:0.5b"

ollama:
  storage:
    size: 20Gi
    storageClass: ""
  gpu:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 2Gi

webui:
  adminEmail: "admin@example.com"
  adminPassword: "YOUR-ADMIN-PASSWORD"
  storage:
    size: 2Gi
    storageClass: ""
