apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-whisper
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
    app.kubernetes.io/component: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "open-webui.whisperSelectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "open-webui.whisperSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: whisper
          image: "{{ .Values.whisper.image.repository }}:{{ .Values.whisper.image.tag }}"
          imagePullPolicy: {{ .Values.whisper.image.pullPolicy }}
          env:
            - name: WHISPER__MODEL
              value: {{ .Values.whisper.model | quote }}
            - name: WHISPER__INFERENCE_DEVICE
              value: cpu
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.whisper.resources.requests.cpu }}
              memory: {{ .Values.whisper.resources.requests.memory }}
            limits:
              cpu: {{ .Values.whisper.resources.limits.cpu }}
              memory: {{ .Values.whisper.resources.limits.memory }}
