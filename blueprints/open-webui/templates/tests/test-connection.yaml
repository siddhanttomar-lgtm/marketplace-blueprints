apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-webui-test"
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget', '--spider', '-q', 'http://{{ include "open-webui.webuiHost" . }}:8080/']
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
  restartPolicy: Never
