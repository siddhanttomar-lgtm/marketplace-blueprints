apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-litellm
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "open-webui.litellmSelectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "open-webui.litellmSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: build-config
          image: registry.e2enetworks.net/marketplace-blueprint/busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              printf 'model_list:\n  - model_name: _placeholder\n    litellm_params:\n      model: "openai/_placeholder"\n      api_key: "none"\n' > /litellm-config/config.yaml

              if [ -n "${OPENAI_API_KEY}" ] && [ ${#OPENAI_API_KEY} -gt 10 ]; then
                printf '  - model_name: gpt-4o\n    litellm_params:\n      model: "openai/gpt-4o"\n      api_key: "os.environ/OPENAI_API_KEY"\n' >> /litellm-config/config.yaml
                printf '  - model_name: gpt-4o-mini\n    litellm_params:\n      model: "openai/gpt-4o-mini"\n      api_key: "os.environ/OPENAI_API_KEY"\n' >> /litellm-config/config.yaml
                echo "[init] OpenAI models added"
              fi

              if [ -n "${ANTHROPIC_API_KEY}" ] && [ ${#ANTHROPIC_API_KEY} -gt 10 ]; then
                printf '  - model_name: claude-3-5-sonnet\n    litellm_params:\n      model: "anthropic/claude-3-5-sonnet-20241022"\n      api_key: "os.environ/ANTHROPIC_API_KEY"\n' >> /litellm-config/config.yaml
                printf '  - model_name: claude-3-haiku\n    litellm_params:\n      model: "anthropic/claude-3-haiku-20240307"\n      api_key: "os.environ/ANTHROPIC_API_KEY"\n' >> /litellm-config/config.yaml
                echo "[init] Anthropic models added"
              fi

              if [ -n "${GROQ_API_KEY}" ] && [ ${#GROQ_API_KEY} -gt 10 ]; then
                printf '  - model_name: groq-llama3-70b\n    litellm_params:\n      model: "groq/llama3-70b-8192"\n      api_key: "os.environ/GROQ_API_KEY"\n' >> /litellm-config/config.yaml
                printf '  - model_name: groq-llama3-8b\n    litellm_params:\n      model: "groq/llama3-8b-8192"\n      api_key: "os.environ/GROQ_API_KEY"\n' >> /litellm-config/config.yaml
                echo "[init] Groq models added"
              fi

              if [ -n "${GOOGLE_API_KEY}" ] && [ ${#GOOGLE_API_KEY} -gt 10 ]; then
                printf '  - model_name: gemini-2.0-flash\n    litellm_params:\n      model: "gemini/gemini-2.0-flash"\n      api_key: "os.environ/GOOGLE_API_KEY"\n' >> /litellm-config/config.yaml
                printf '  - model_name: gemini-1.5-pro\n    litellm_params:\n      model: "gemini/gemini-1.5-pro"\n      api_key: "os.environ/GOOGLE_API_KEY"\n' >> /litellm-config/config.yaml
                echo "[init] Gemini models added"
              fi

              if [ -n "${FIREWORKS_API_KEY}" ] && [ ${#FIREWORKS_API_KEY} -gt 10 ]; then
                printf '  - model_name: fw-deepseek-v4-pro\n    litellm_params:\n      model: "fireworks_ai/accounts/fireworks/models/deepseek-v4-pro"\n      api_key: "os.environ/FIREWORKS_API_KEY"\n' >> /litellm-config/config.yaml
                printf '  - model_name: fw-kimi-k2\n    litellm_params:\n      model: "fireworks_ai/accounts/fireworks/models/kimi-k2p6"\n      api_key: "os.environ/FIREWORKS_API_KEY"\n' >> /litellm-config/config.yaml
                printf '  - model_name: fw-gpt-oss-120b\n    litellm_params:\n      model: "fireworks_ai/accounts/fireworks/models/gpt-oss-120b"\n      api_key: "os.environ/FIREWORKS_API_KEY"\n' >> /litellm-config/config.yaml
                echo "[init] Fireworks models added"
              fi

              if [ -n "${MISTRAL_API_KEY}" ] && [ ${#MISTRAL_API_KEY} -gt 10 ]; then
                printf '  - model_name: mistral-large\n    litellm_params:\n      model: "mistral/mistral-large-latest"\n      api_key: "os.environ/MISTRAL_API_KEY"\n' >> /litellm-config/config.yaml
                printf '  - model_name: mistral-small\n    litellm_params:\n      model: "mistral/mistral-small-latest"\n      api_key: "os.environ/MISTRAL_API_KEY"\n' >> /litellm-config/config.yaml
                echo "[init] Mistral models added"
              fi

              if [ -n "${PERPLEXITY_API_KEY}" ] && [ ${#PERPLEXITY_API_KEY} -gt 10 ]; then
                printf '  - model_name: perplexity-sonar-pro\n    litellm_params:\n      model: "perplexity/sonar-pro"\n      api_key: "os.environ/PERPLEXITY_API_KEY"\n' >> /litellm-config/config.yaml
                printf '  - model_name: perplexity-sonar\n    litellm_params:\n      model: "perplexity/sonar"\n      api_key: "os.environ/PERPLEXITY_API_KEY"\n' >> /litellm-config/config.yaml
                echo "[init] Perplexity models added"
              fi

              if [ -n "${E2E_BEARER_TOKEN}" ] && [ ${#E2E_BEARER_TOKEN} -gt 10 ] && [ -n "${E2E_PROJECT_NAMESPACE}" ]; then
                for M in gpt_oss_120b qwen3_32b llama3_1_8b_instruct; do
                  printf '  - model_name: %s\n    litellm_params:\n      model: "openai/%s"\n      api_base: "https://infer.e2enetworks.net/project/%s/genai/%s/v1"\n      api_key: "os.environ/E2E_BEARER_TOKEN"\n' \
                    "$M" "$M" "${E2E_PROJECT_NAMESPACE}" "$M" >> /litellm-config/config.yaml
                done
                echo "[init] E2E GenAI models added (3 free)"
              fi

              echo "[init] Final config:"
              cat /litellm-config/config.yaml
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: ANTHROPIC_API_KEY
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: GROQ_API_KEY
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: GOOGLE_API_KEY
            - name: FIREWORKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: FIREWORKS_API_KEY
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: MISTRAL_API_KEY
            - name: PERPLEXITY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: PERPLEXITY_API_KEY
            - name: E2E_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: E2E_BEARER_TOKEN
                  optional: true
            - name: E2E_PROJECT_NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: E2E_PROJECT_NAMESPACE
                  optional: true
          volumeMounts:
            - name: litellm-config
              mountPath: /litellm-config
          resources:
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: litellm
          image: "{{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}"
          imagePullPolicy: {{ .Values.litellm.image.pullPolicy }}
          command:
            - litellm
            - --config
            - /litellm-config/config.yaml
            - --port
            - "4000"
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: ANTHROPIC_API_KEY
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: GROQ_API_KEY
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: GOOGLE_API_KEY
            - name: FIREWORKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: FIREWORKS_API_KEY
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: MISTRAL_API_KEY
            - name: PERPLEXITY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: PERPLEXITY_API_KEY
            - name: E2E_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: E2E_BEARER_TOKEN
                  optional: true
            - name: E2E_PROJECT_NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: E2E_PROJECT_NAMESPACE
                  optional: true
            - name: LITELLM_MASTER_KEY
              value: "sk-litellm"
            - name: STORE_MODEL_IN_DB
              value: "False"
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 57
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.litellm.resources.requests.cpu }}
              memory: {{ .Values.litellm.resources.requests.memory }}
            limits:
              cpu: {{ .Values.litellm.resources.limits.cpu }}
              memory: {{ .Values.litellm.resources.limits.memory }}
          volumeMounts:
            - name: litellm-config
              mountPath: /litellm-config
      volumes:
        - name: litellm-config
          emptyDir: {}
