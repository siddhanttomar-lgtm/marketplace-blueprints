apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-webui.whisperHost" . }}
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    {{- include "open-webui.whisperSelectorLabels" . | nindent 4 }}
