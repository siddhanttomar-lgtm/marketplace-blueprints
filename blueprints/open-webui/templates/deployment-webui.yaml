apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-open-webui
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "open-webui.webuiSelectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "open-webui.webuiSelectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-ollama
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Ollama to be ready..."
              until nc -z {{ include "open-webui.ollamaHost" . }} 11434; do
                echo "Ollama not ready, sleeping 5s..."
                sleep 5
              done
              echo "Ollama is ready."
          resources:
            limits:
              cpu: 50m
              memory: 32Mi
        - name: pull-model
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          command:
            - ollama
            - pull
            - {{ .Values.model }}
          env:
            - name: OLLAMA_HOST
              value: "http://{{ include "open-webui.ollamaHost" . }}:11434"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: open-webui
          image: "{{ .Values.webui.image.repository }}:{{ .Values.webui.image.tag }}"
          imagePullPolicy: {{ .Values.webui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: OLLAMA_BASE_URL
              value: "http://{{ include "open-webui.ollamaHost" . }}:11434"
            - name: WEBUI_AUTH
              value: "true"
            - name: ENABLE_SIGNUP
              value: "true"
            - name: DEFAULT_MODELS
              value: {{ .Values.model | quote }}
            - name: PORT
              value: "8080"
            - name: WEBUI_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: webui-admin-email
            - name: WEBUI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: webui-admin-password
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: webui-secret-key
            - name: DATA_DIR
              value: /app/backend/data
            - name: DEFAULT_USER_ROLE
              value: "user"
            - name: RAG_EMBEDDING_ENGINE
              value: "ollama"
            - name: RAG_OLLAMA_BASE_URL
              value: "http://{{ include "open-webui.ollamaHost" . }}:11434"
            - name: SENTENCE_TRANSFORMERS_HOME
              value: /app/backend/data/sentence-transformers
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: {{ .Values.webui.resources.requests.cpu }}
              memory: {{ .Values.webui.resources.requests.memory }}
            limits:
              cpu: {{ .Values.webui.resources.limits.cpu }}
              memory: {{ .Values.webui.resources.limits.memory }}
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-webui-data
