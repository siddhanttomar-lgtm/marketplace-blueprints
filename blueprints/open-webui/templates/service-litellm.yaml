apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-webui.litellmHost" . }}
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    {{- include "open-webui.litellmSelectorLabels" . | nindent 4 }}
