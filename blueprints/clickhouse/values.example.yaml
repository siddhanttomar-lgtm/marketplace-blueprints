# ClickHouse — example values
# helm install clickhouse blueprints/clickhouse -f my-values.yaml

auth:
  username: default
  password: "YOUR-STRONG-PASSWORD"

service:
  type: NodePort

shards: 1
replicaCount: 1

persistence:
  size: 8Gi
  storageClass: ""

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    memory: 4Gi
