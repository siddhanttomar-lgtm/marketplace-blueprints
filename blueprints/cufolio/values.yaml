image: nvcr.io/nvidia/pytorch:25.10-py3

ngcApiKey: ""

ownGpu: false

streamlit:
  port: 8501
  nodePort: 30901

jupyter:
  port: 8888
  nodePort: 30902

ingress:
  enabled: false
  className: "haproxy"
  baseDomain: ""
  annotations:
    haproxy.org/timeout-connect: "5s"
    haproxy.org/timeout-client: "600s"
    haproxy.org/timeout-server: "600s"

resources:
  requests:
    cpu: "8"
    memory: "32Gi"
  limits:
    cpu: "24"
    memory: "200Gi"
    "nvidia.com/gpu": "1"

affinity: {}

storage:
  dataSize: "100Gi"
  cacheSize: "50Gi"

auth:
  username: ""
  password: ""
