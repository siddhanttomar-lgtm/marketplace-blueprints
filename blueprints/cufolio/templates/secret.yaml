apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cufolio.fullname" . }}-auth
  labels:
    {{- include "cufolio.labels" . | nindent 4 }}
type: Opaque
stringData:
  NGC_API_KEY: {{ .Values.ngcApiKey | quote }}
  JUPYTER_TOKEN: {{ include "cufolio.jupyterToken" . | quote }}
  AUTH_USERNAME: {{ .Values.auth.username | quote }}
  AUTH_PASSWORD: {{ .Values.auth.password | quote }}
---
# NGC image-pull secret (customer-supplied via .Values.ngcApiKey) used to pull
# nvcr.io container images. Added alongside the platform-injected registry-pull-secret
# (which continues to serve registry.e2enetworks.net images unchanged).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cufolio.fullname" . }}-nvcr-pull
  labels:
    {{- include "cufolio.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "cufolio.nvcrDockerConfigJson" . }}
