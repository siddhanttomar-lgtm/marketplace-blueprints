# Nginx — example values
# helm install nginx blueprints/nginx -f my-values.yaml

service:
  type: NodePort           # use NodePort on bare-metal / non-cloud clusters

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 128Mi

