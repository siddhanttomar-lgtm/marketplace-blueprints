# Admin API NodePort — exposes APISIX Admin API (port 9180) externally.
# Required because: dashboard 3.0.1 (archived) has a known bug where POST /consumers
# returns SPA HTML instead of proxying to admin API. Users who need consumer/key-auth
# management must hit the Admin API directly with X-API-KEY header.
# Usage: curl -H "X-API-KEY: <admin-key>" http://<node-ip>:<nodeport>/apisix/admin/consumers
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-admin-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: apisix
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: admin
      port: 9180
      targetPort: 9180
      protocol: TCP
