# Lightweight openresty sidecar that fixes two dashboard 3.0.1 bugs:
#   1. /apisix/admin/get_key — missing from binary, falls through to SPA HTML
#      → React JSON.parse() crash → blank plugin page
#   2. /apisix/admin/plugins/list — same fall-through problem
# Proxy mocks (1) and proxies (2) directly to APISIX admin API with wrap.
proxy:
  image:
    repository: registry.e2enetworks.net/marketplace-blueprint/openresty
    tag: "1.25.3.2-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
