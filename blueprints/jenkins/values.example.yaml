# Jenkins — example values
# helm install jenkins blueprints/jenkins -f my-values.yaml

jenkinsUsername: admin
jenkinsPassword: "YOUR-ADMIN-PASSWORD"

service:
  type: NodePort

persistence:
  size: 10Gi
  storageClass: ""

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 2Gi
