# RAG Knowledge Base — example values
# helm install rag-kb blueprints/rag-kb -f my-values.yaml

qdrant:
  storage:
    size: 10Gi

ollama:
  storage:
    size: 15Gi
  models:
    embedding: "nomic-embed-text"
    generation: "llama3.2:3b"

openwebui:
  storage:
    size: 5Gi
  adminEmail: "admin@example.com"
  adminPassword: "YOUR-ADMIN-PASSWORD"

n8n:
  # Generate a strong random key: openssl rand -base64 32
  encryptionKey: "YOUR-ENCRYPTION-KEY"
  storage:
    size: 2Gi
