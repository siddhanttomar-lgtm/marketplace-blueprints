apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-n8n
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rag-kb.labels" . | nindent 4 }}
    app.kubernetes.io/component: n8n
spec:
  type: NodePort
  selector:
    {{- include "rag-kb.selectorLabels" (dict "release" .Release.Name "component" "n8n") | nindent 4 }}
  ports:
    - name: http
      port: 5678
      targetPort: 5678
      protocol: TCP
