apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rag-kb.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENWEBUI_ADMIN_PASSWORD: {{ .Values.openwebui.adminPassword | quote }}
  N8N_ENCRYPTION_KEY: {{ .Values.n8n.encryptionKey | quote }}
