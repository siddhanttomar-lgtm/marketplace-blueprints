apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-n8n
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rag-kb.labels" . | nindent 4 }}
    app.kubernetes.io/component: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rag-kb.selectorLabels" (dict "release" .Release.Name "component" "n8n") | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "rag-kb.selectorLabels" (dict "release" .Release.Name "component" "n8n") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Import URL-ingestion workflow before n8n starts so it's ready on first login.
        # Uses n8n CLI directly against SQLite — no running process needed, no auth required.
        - name: import-workflow
          image: {{ .Values.n8n.image.repository }}:{{ .Values.n8n.image.tag }}
          imagePullPolicy: {{ .Values.n8n.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              echo "Importing RAG URL ingestion workflow..."
              n8n import:workflow --input=/tmp/workflows/url-ingestion.json || true
              echo "Workflow import done."
          env:
            - name: N8N_USER_FOLDER
              value: /home/node/.n8n
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: N8N_ENCRYPTION_KEY
            - name: OPENWEBUI_URL
              value: http://{{ .Release.Name }}:8080
            - name: DB_TYPE
              value: sqlite
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
            - name: workflows
              mountPath: /tmp/workflows
      containers:
        - name: n8n
          image: {{ .Values.n8n.image.repository }}:{{ .Values.n8n.image.tag }}
          imagePullPolicy: {{ .Values.n8n.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5678
              protocol: TCP
          env:
            - name: N8N_USER_FOLDER
              value: /home/node/.n8n
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: N8N_ENCRYPTION_KEY
            - name: DB_TYPE
              value: sqlite
            # Makes the webhook URL correct when accessed through NodePort/ingress
            - name: WEBHOOK_URL
              value: http://{{ .Release.Name }}-n8n:5678/
            # Open WebUI URL available as env var in n8n workflow expressions ($env.OPENWEBUI_URL)
            - name: OPENWEBUI_URL
              value: http://{{ .Release.Name }}:8080
            - name: N8N_LOG_LEVEL
              value: info
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
              value: "false"
          resources:
            {{- toYaml .Values.n8n.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
            - name: workflows
              mountPath: /tmp/workflows
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-n8n-data
        - name: workflows
          configMap:
            name: {{ .Release.Name }}-n8n-workflows
