apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ollama
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rag-kb.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  type: ClusterIP
  selector:
    {{- include "rag-kb.selectorLabels" (dict "release" .Release.Name "component" "ollama") | nindent 4 }}
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
