apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-n8n-workflows
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rag-kb.labels" . | nindent 4 }}
data:
  url-ingestion.json: |
    {
      "name": "RAG URL Ingestion",
      "nodes": [
        {
          "id": "node-webhook",
          "name": "Webhook",
          "type": "n8n-nodes-base.webhook",
          "typeVersion": 2,
          "position": [240, 300],
          "webhookId": "rag-kb-ingest",
          "parameters": {
            "path": "ingest",
            "responseMode": "responseNode",
            "options": {}
          }
        },
        {
          "id": "node-fetch",
          "name": "Fetch Web Page",
          "type": "n8n-nodes-base.httpRequest",
          "typeVersion": 4,
          "position": [460, 300],
          "parameters": {
            "method": "GET",
            "url": "={{ "{{" }} $json.body.url {{ "}}" }}",
            "options": {
              "response": {
                "response": {
                  "responseFormat": "text"
                }
              }
            }
          }
        },
        {
          "id": "node-openwebui",
          "name": "Add to Open WebUI Knowledge",
          "type": "n8n-nodes-base.httpRequest",
          "typeVersion": 4,
          "position": [680, 300],
          "parameters": {
            "method": "POST",
            "url": "={{ "{{" }} $env.OPENWEBUI_URL {{ "}}" }}/api/v1/retrieval/process/web",
            "sendHeaders": true,
            "headerParameters": {
              "parameters": [
                {
                  "name": "Content-Type",
                  "value": "application/json"
                },
                {
                  "name": "Authorization",
                  "value": "=Bearer {{ "{{" }} $env.OPENWEBUI_API_KEY {{ "}}" }}"
                }
              ]
            },
            "sendBody": true,
            "contentType": "json",
            "body": "={{ "{{" }} JSON.stringify({url: $('Webhook').item.json.body.url, collection_name: $('Webhook').item.json.body.collection || 'rag_kb'}) {{ "}}" }}",
            "options": {}
          }
        },
        {
          "id": "node-respond",
          "name": "Respond",
          "type": "n8n-nodes-base.respondToWebhook",
          "typeVersion": 1,
          "position": [900, 300],
          "parameters": {
            "respondWith": "json",
            "responseBody": "={{ "{{" }} JSON.stringify({status: 'ok', url: $('Webhook').item.json.body.url}) {{ "}}" }}",
            "options": {}
          }
        }
      ],
      "connections": {
        "Webhook": {
          "main": [
            [
              {"node": "Fetch Web Page", "type": "main", "index": 0}
            ]
          ]
        },
        "Fetch Web Page": {
          "main": [
            [
              {"node": "Add to Open WebUI Knowledge", "type": "main", "index": 0}
            ]
          ]
        },
        "Add to Open WebUI Knowledge": {
          "main": [
            [
              {"node": "Respond", "type": "main", "index": 0}
            ]
          ]
        }
      },
      "active": true,
      "settings": {
        "executionOrder": "v1"
      }
    }
