qdrant:
  image:
    repository: qdrant/qdrant
    tag: "v1.9.0"
    pullPolicy: IfNotPresent
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 300m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

ollama:
  image:
    repository: ollama/ollama
    tag: "0.3.14"
    pullPolicy: IfNotPresent
  storage:
    size: 15Gi
  models:
    embedding: "nomic-embed-text"
    generation: "llama3.2:3b"
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 8Gi

openwebui:
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: "v0.9.5"
    pullPolicy: IfNotPresent
  storage:
    size: 5Gi
  adminEmail: ""
  adminPassword: ""
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

n8n:
  image:
    repository: n8nio/n8n
    tag: "1.39.1"
    pullPolicy: IfNotPresent
  encryptionKey: ""
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

nodeSelector: {}
