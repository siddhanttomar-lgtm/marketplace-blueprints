    'use strict';
    const https = require('https');
    const {execSync} = require('child_process');
    const args = process.argv.slice(2);
    const cmd = args[0];
    function getToken() { return execSync('node /home/node/.openclaw/workspace/google-token.js', {env:process.env}).toString().trim(); }
    function apicall(method, path, body, token) {
      return new Promise((resolve,reject) => {
        const data = body ? JSON.stringify(body) : null;
        const opts = {hostname:'tasks.googleapis.com',path,method,
          headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(data?{'Content-Length':Buffer.byteLength(data)}:{})}};
        const req = https.request(opts, res => {
          let b=''; res.on('data',c=>b+=c);
          res.on('end',()=>{ try{resolve(JSON.parse(b))}catch(e){resolve({raw:b})} });
        });
        req.on('error',reject); if(data)req.write(data); req.end();
      });
    }
    async function main() {
      const token = getToken();
      if (cmd === 'lists') {
        const r=await apicall('GET','/tasks/v1/users/@me/lists?maxResults=20',null,token);
        if(r.error){console.error('[tasks] '+r.error.message+'\nNote: Make sure your OAuth token includes the tasks scope (https://www.googleapis.com/auth/tasks).');process.exit(1);}
        (r.items||[]).forEach(l=>console.log('ID:'+l.id+' | '+l.title));
      } else if (cmd === 'list') {
        const li=args.indexOf('--list'); const listId=li>=0?args[li+1]:'@default';
        const r=await apicall('GET','/tasks/v1/lists/'+encodeURIComponent(listId)+'/tasks?showCompleted=false&maxResults=50',null,token);
        if(r.error){console.error('[tasks] '+r.error.message);process.exit(1);}
        if(!r.items||!r.items.length){console.log('No pending tasks.');return;}
        r.items.forEach(t=>{
          const due=t.due?' [due: '+t.due.slice(0,10)+']':'';
          console.log('ID:'+t.id+due+' '+t.title+(t.notes?' — '+t.notes.slice(0,60):''));
        });
      } else if (cmd === 'add') {
        const ti=args.indexOf('--title'),di=args.indexOf('--due'),li=args.indexOf('--list'),ni=args.indexOf('--notes');
        if(ti<0){console.error('Usage: tasks.js add --title "Task" [--due 2026-05-30] [--notes "x"] [--list <listId>]');process.exit(1);}
        const listId=li>=0?args[li+1]:'@default';
        const body={title:args[ti+1]};
        if(di>=0) body.due=new Date(args[di+1]).toISOString();
        if(ni>=0) body.notes=args[ni+1];
        const r=await apicall('POST','/tasks/v1/lists/'+encodeURIComponent(listId)+'/tasks',body,token);
        if(r.id) console.log('Task created: '+r.id+' — '+r.title); else console.log(JSON.stringify(r));
      } else if (cmd === 'done') {
        const id=args[1],li=args.indexOf('--list'); const listId=li>=0?args[li+1]:'@default';
        if(!id){console.error('Usage: tasks.js done <taskId> [--list <listId>]');process.exit(1);}
        const r=await apicall('PATCH','/tasks/v1/lists/'+encodeURIComponent(listId)+'/tasks/'+encodeURIComponent(id),{status:'completed'},token);
        if(r.id) console.log('Completed: '+r.title); else console.log(JSON.stringify(r));
      } else if (cmd === 'delete') {
        const id=args[1],li=args.indexOf('--list'); const listId=li>=0?args[li+1]:'@default';
        if(!id){console.error('Usage: tasks.js delete <taskId> [--list <listId>]');process.exit(1);}
        await apicall('DELETE','/tasks/v1/lists/'+encodeURIComponent(listId)+'/tasks/'+encodeURIComponent(id),null,token);
        console.log('Deleted task: '+id);
      } else { console.error('Commands: lists, list [--list <id>], add --title "x" [--due date], done <id>, delete <id>'); process.exit(1); }
    }
    main().catch(e=>{console.error('[tasks] '+e.message);process.exit(1);});

  translate.js: |
    'use strict';
    const https = require('https');
    const args = process.argv.slice(2);
    const cmd = args[0];
    const API_KEY = process.env.GOOGLE_TRANSLATE_KEY;
    function apicall(method, path, body) {
      return new Promise((resolve,reject) => {
        const data = body ? JSON.stringify(body) : null;
        const opts = {hostname:'translation.googleapis.com',path:''+path+'&key='+API_KEY,method,
          headers:{'Content-Type':'application/json',...(data?{'Content-Length':Buffer.byteLength(data)}:{})}};
        const req = https.request(opts, res => {
          let b=''; res.on('data',c=>b+=c);
          res.on('end',()=>{ try{resolve(JSON.parse(b))}catch(e){resolve({raw:b})} });
        });
        req.on('error',reject); if(data)req.write(data); req.end();
      });
    }
    async function main() {
      if (!API_KEY) { console.error('GOOGLE_TRANSLATE_KEY not set.\nAdd it in deployment settings: enable "Cloud Translation API" at console.cloud.google.com and create an API key.'); process.exit(1); }
      if (cmd === 'translate') {
        const ti=args.indexOf('--text'),toi=args.indexOf('--to'),fri=args.indexOf('--from');
        if(ti<0||toi<0){console.error('Usage: translate.js translate --text "Hello" --to es [--from en]');process.exit(1);}
        const body={q:args[ti+1],target:args[toi+1],...(fri>=0?{source:args[fri+1]}:{})};
        const r=await apicall('POST','/language/translate/v2?',body);
        const t=r.data&&r.data.translations&&r.data.translations[0];
        if(t) console.log('Translated ('+t.detectedSourceLanguage||args[fri+1]||'?'+' → '+args[toi+1]+'): '+t.translatedText);
        else console.log(JSON.stringify(r));
      } else if (cmd === 'detect') {
        const ti=args.indexOf('--text'); if(ti<0){console.error('Usage: translate.js detect --text "Bonjour"');process.exit(1);}
        const r=await apicall('POST','/language/translate/v2/detect?',{q:args[ti+1]});
        const d=r.data&&r.data.detections&&r.data.detections[0]&&r.data.detections[0][0];
        if(d) console.log('Detected language: '+d.language+' (confidence: '+Math.round(d.confidence*100)+'%)');
        else console.log(JSON.stringify(r));
      } else if (cmd === 'languages') {
        const r=await apicall('GET','/language/translate/v2/languages?target=en',null);
        (r.data&&r.data.languages||[]).forEach(l=>console.log(l.language+' | '+l.name));
      } else { console.error('Commands: translate --text "x" --to <lang>, detect --text "x", languages'); process.exit(1); }
    }
    main().catch(e=>{console.error('[translate] '+e.message);process.exit(1);});
