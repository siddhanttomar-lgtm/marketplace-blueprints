    const args = process.argv.slice(2);
    const cmd = args[0];
    function getToken() { return execSync('node /home/node/.openclaw/workspace/google-token.js', {env:process.env}).toString().trim(); }
    function apicall(method, path, body, token) {
      return new Promise((resolve,reject) => {
        const data = body ? JSON.stringify(body) : null;
        const opts = {hostname:'sheets.googleapis.com',path,method,
          headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(data?{'Content-Length':Buffer.byteLength(data)}:{})}};
        const req = https.request(opts, res => {
          let b=''; res.on('data',c=>b+=c);
          res.on('end',()=>{ try{resolve(JSON.parse(b))}catch(e){resolve({raw:b})} });
        });
        req.on('error',reject); if(data)req.write(data); req.end();
      });
    }
    async function main() {
      const token = getToken();
      if (cmd === 'get') {
        const id=args[1],range=args[2];
        if(!id||!range){console.error('Usage: sheets.js get <id> "Sheet1!A1:D10"');process.exit(1);}
        const r=await apicall('GET','/v4/spreadsheets/'+id+'/values/'+encodeURIComponent(range),null,token);
        if(!r.values||!r.values.length){console.log('No data.');return;}
        r.values.forEach(row=>console.log(row.join(' | ')));
      } else if (cmd === 'append') {
        const id=args[1],range=args[2],ri=args.indexOf('--row');
        if(!id||!range||ri<0){console.error('Usage: sheets.js append <id> "Sheet1!A:C" --row "v1,v2,v3"');process.exit(1);}
        const row=args[ri+1].split(',');
        const r=await apicall('POST','/v4/spreadsheets/'+id+'/values/'+encodeURIComponent(range)+':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS',{values:[row]},token);
        console.log('Appended '+((r.updates&&r.updates.updatedCells)||0)+' cells.');
      } else if (cmd === 'update') {
        const id=args[1],range=args[2],vi=args.indexOf('--value');
        if(!id||!range||vi<0){console.error('Usage: sheets.js update <id> "Sheet1!A1" --value "new"');process.exit(1);}
        const r=await apicall('PUT','/v4/spreadsheets/'+id+'/values/'+encodeURIComponent(range)+'?valueInputOption=USER_ENTERED',{values:[[args[vi+1]]]},token);
        console.log('Updated '+((r.updatedCells)||0)+' cells.');
      } else if (cmd === 'clear') {
        const id=args[1],range=args[2];
        if(!id||!range){console.error('Usage: sheets.js clear <id> "Sheet1!A1:Z"');process.exit(1);}
        await apicall('POST','/v4/spreadsheets/'+id+'/values/'+encodeURIComponent(range)+':clear',{},token);
        console.log('Cleared: '+range);
      } else if (cmd === 'info') {
        const id=args[1]; if(!id){console.error('Usage: sheets.js info <id>');process.exit(1);}
        const r=await apicall('GET','/v4/spreadsheets/'+id+'?fields=properties,sheets.properties',null,token);
        console.log('Title: '+r.properties.title);
        (r.sheets||[]).forEach(s=>console.log('Sheet: '+s.properties.title+' ('+s.properties.gridProperties.rowCount+'r x '+s.properties.gridProperties.columnCount+'c)'));
      } else { console.error('Commands: get, append, update, clear, info'); process.exit(1); }
    }
    main().catch(e=>{console.error('[sheets] '+e.message);process.exit(1);});

  docs.js: |
    'use strict';
    const https = require('https');
    const {execSync} = require('child_process');
    const args = process.argv.slice(2);
    const cmd = args[0];
    function getToken() { return execSync('node /home/node/.openclaw/workspace/google-token.js', {env:process.env}).toString().trim(); }
    function apicall(method, path, body, token, host) {
      return new Promise((resolve,reject) => {
        const data = body ? JSON.stringify(body) : null;
        const opts = {hostname:host||'docs.googleapis.com',path,method,
          headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(data?{'Content-Length':Buffer.byteLength(data)}:{})}};
        const req = https.request(opts, res => {
          let b=''; res.on('data',c=>b+=c);
          res.on('end',()=>{ try{resolve(JSON.parse(b))}catch(e){resolve({raw:b})} });
        });
        req.on('error',reject); if(data)req.write(data); req.end();
      });
    }
    function extractText(body2) {
      let t='';
      for (const el of (body2&&body2.content||[])) {
        if (el.paragraph) for (const e of (el.paragraph.elements||[])) if (e.textRun) t+=e.textRun.content;
      }
      return t.slice(0,4000);
    }
    async function main() {
      const token = getToken();
      if (cmd === 'read') {
        const id=args[1]; if(!id){console.error('Usage: docs.js read <docId>');process.exit(1);}
        const r=await apicall('GET','/v1/documents/'+id,null,token);
        console.log('Title: '+r.title+'\n---\n'+extractText(r.body));
      } else if (cmd === 'create') {
        const ti=args.indexOf('--title'),ci=args.indexOf('--content');
        if(ti<0){console.error('Usage: docs.js create --title "..." [--content "..."]');process.exit(1);}
        const r=await apicall('POST','/v1/documents',{title:args[ti+1]},token);
        if(!r.documentId){console.log(JSON.stringify(r));return;}
        console.log('Created! ID:'+r.documentId+' | Title:'+r.title);
        console.log('URL: https://docs.google.com/document/d/'+r.documentId+'/edit');
        if(ci>=0){
          await apicall('POST','/v1/documents/'+r.documentId+':batchUpdate',{requests:[{insertText:{location:{index:1},text:args[ci+1]}}]},token);
          console.log('Content added.');
        }
      } else { console.error('Commands: read, create'); process.exit(1); }
    }
    main().catch(e=>{console.error('[docs] '+e.message);process.exit(1);});

