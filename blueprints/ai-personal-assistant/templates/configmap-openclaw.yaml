        console.log('URL: https://docs.google.com/presentation/d/'+r.presentationId+'/edit');
      } else if (cmd === 'read') {
        const id=args[1]; if(!id){console.error('Usage: slides.js read <presentationId>');process.exit(1);}
        const r=await apicall('GET','/v1/presentations/'+id,null,token);
        console.log('Title: '+r.title+' | Slides: '+(r.slides||[]).length);
        (r.slides||[]).forEach((s,i)=>{
          const texts=[];
          (s.pageElements||[]).forEach(el=>{
            if(el.shape&&el.shape.text) el.shape.text.textElements.forEach(te=>{ if(te.textRun) texts.push(te.textRun.content.trim()); });
          });
          if(texts.length) console.log('Slide '+(i+1)+': '+texts.join(' | ').slice(0,120));
        });
      } else if (cmd === 'addslide') {
        const id=args[1],ti=args.indexOf('--text'); if(!id){console.error('Usage: slides.js addslide <presentationId> [--text "content"]');process.exit(1);}
        const pres=await apicall('GET','/v1/presentations/'+id,null,token);
        const slideId='slide_'+Date.now();
        const requests=[{createSlide:{objectId:slideId,slideLayoutReference:{predefinedLayout:'BLANK'}}}];
        if(ti>=0){
          const boxId='box_'+Date.now();
          requests.push({createShape:{objectId:boxId,shapeType:'TEXT_BOX',elementProperties:{pageObjectId:slideId,size:{width:{magnitude:6000000,unit:'EMU'},height:{magnitude:3000000,unit:'EMU'}},transform:{scaleX:1,scaleY:1,translateX:1800000,translateY:1272000,unit:'EMU'}}}});
          requests.push({insertText:{objectId:boxId,text:args[ti+1]}});
        }
        const r=await apicall('POST','/v1/presentations/'+id+':batchUpdate',{requests},token);
        console.log('Slide added to presentation '+id);
      } else { console.error('Commands: create --title "x", read <id>, addslide <id> [--text "content"]'); process.exit(1); }
    }
    main().catch(e=>{console.error('[slides] '+e.message);process.exit(1);});

