apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apa.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: {{ .Values.openclaw.gatewayToken | default "" | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.openclaw.googleClientId | default "" | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.openclaw.googleClientSecret | default "" | quote }}
  GOOGLE_REFRESH_TOKEN: {{ .Values.openclaw.googleRefreshToken | default "" | quote }}
  GMAIL_ADDRESS: {{ .Values.openclaw.gmailAddress | default "" | quote }}
  GMAIL_SEND_NAME: {{ .Values.openclaw.gmailSendName | default "Assistant" | quote }}
  GOOGLE_TRANSLATE_KEY: {{ .Values.openclaw.googleTranslateKey | default "" | quote }}
  ANTHROPIC_API_KEY: {{ .Values.openclaw.anthropicApiKey | default "" | quote }}
  OPENAI_API_KEY: {{ .Values.openclaw.openaiApiKey | default "" | quote }}
  GOOGLE_API_KEY: {{ .Values.openclaw.googleApiKey | default "" | quote }}
  GROQ_API_KEY: {{ .Values.openclaw.groqApiKey | default "" | quote }}
  FIREWORKS_API_KEY: {{ .Values.openclaw.fireworksApiKey | default "" | quote }}
  TELEGRAM_BOT_TOKEN: {{ .Values.telegram.botToken | default "" | quote }}
