openclaw:
  image:
    repository: registry.e2enetworks.net/marketplace-blueprint/openclaw
    tag: "slim"
    pullPolicy: IfNotPresent
  storage:
    size: "5Gi"
  # REQUIRED: Gateway auth token — change before production
  gatewayToken: "Assistant@12345"
  # Google OAuth credentials — obtain once via Google OAuth Playground
  # See user guide: https://developers.google.com/oauthplayground
  googleClientId: ""
  googleClientSecret: ""
  googleRefreshToken: ""
  gmailAddress: ""
  gmailSendName: "Assistant"
  # Google Translate API key — separate from OAuth, get at console.cloud.google.com
  # Enable "Cloud Translation API" and create an API key
  googleTranslateKey: ""
  # AI API key — at least one required for agent responses
  anthropicApiKey: ""
  openaiApiKey: ""
  googleApiKey: ""
  groqApiKey: ""
  fireworksApiKey: ""
  # Optional: custom OpenAI-compatible endpoint
  openaiApiBase: ""
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

telegram:
  botToken: ""

persistence:
  accessMode: ReadWriteOnce

nodeSelector: {}
