# PostgreSQL — example values
# helm install postgresql blueprints/postgresql -f my-values.yaml

auth:
  postgresPassword: "YOUR-STRONG-PASSWORD"
  database: "mydb"         # optional: create a database on first start

service:
  type: NodePort           # NodePort = accessible from outside the cluster

primary:
  persistence:
    size: 8Gi
    storageClass: ""       # leave empty for cluster default
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
