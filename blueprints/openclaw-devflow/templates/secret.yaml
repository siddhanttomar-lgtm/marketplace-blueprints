{{- /*
  Resolve the gateway token (optional). Precedence:
    1. an explicit value the user/platform provided
    2. the token already stored in this release's secret (keeps it STABLE across upgrades)
    3. a freshly generated strong random token
*/ -}}
{{- $secretName := printf "%s-credentials" .Release.Name -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $prior := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "OPENCLAW_GATEWAY_TOKEN") -}}
{{-   $prior = (index $existing.data "OPENCLAW_GATEWAY_TOKEN" | b64dec) -}}
{{- end -}}
{{- $gatewayToken := (.Values.openclaw.gatewayToken | default $prior | default (randAlphaNum 32)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oca.labels" . | nindent 4 }}
type: Opaque
stringData:
  # All credentials are whitespace-stripped: the marketplace's value pipeline can inject
  # whitespace (e.g. line-wrap spaces) into long tokens, which corrupts them. None of these
  # credentials legitimately contain whitespace, so `regexReplaceAll "\s+" … ""` is safe and
  # repairs any such corruption for every consumer (env, build-config, gateway).
  # ── OpenClaw gateway + model providers ──────────────────────────────────────
  # Gateway token: provided value, else reused from prior secret, else auto-generated.
  OPENCLAW_GATEWAY_TOKEN: {{ regexReplaceAll "\\s+" $gatewayToken "" | quote }}
  E2E_BEARER_TOKEN: {{ regexReplaceAll "\\s+" (.Values.openclaw.e2eBearerToken | default "") "" | quote }}
  # Namespace injected by platform at deploy time via global.platform.tirProjectId;
  # e2e.projectNamespace is a manual override fallback for deploys outside the platform.
  E2E_PROJECT_NAMESPACE: {{ .Values.global.platform.tirProjectId | default (.Values.e2e.projectNamespace | default "") | quote }}
  E2E_MODEL_NAME: {{ .Values.e2e.modelName | default "gpt_oss_120b" | quote }}
  TELEGRAM_BOT_TOKEN: {{ regexReplaceAll "\\s+" (.Values.telegram.botToken | default "") "" | quote }}
  # ── Plugin credentials (only consumed when the matching plugin is enabled) ───
  GITHUB_PERSONAL_ACCESS_TOKEN: {{ regexReplaceAll "\\s+" (.Values.plugins.github.personalAccessToken | default "") "" | quote }}
  SLACK_BOT_TOKEN: {{ regexReplaceAll "\\s+" (.Values.plugins.slack.botToken | default "") "" | quote }}
  SLACK_TEAM_ID: {{ regexReplaceAll "\\s+" (.Values.plugins.slack.teamId | default "") "" | quote }}
  NOTION_INTEGRATION_TOKEN: {{ regexReplaceAll "\\s+" (.Values.plugins.notion.integrationToken | default "") "" | quote }}
  JIRA_HOST: {{ regexReplaceAll "\\s+" (.Values.plugins.jira.host | default "") "" | quote }}
  JIRA_EMAIL: {{ regexReplaceAll "\\s+" (.Values.plugins.jira.email | default "") "" | quote }}
  JIRA_API_TOKEN: {{ regexReplaceAll "\\s+" (.Values.plugins.jira.apiToken | default "") "" | quote }}
