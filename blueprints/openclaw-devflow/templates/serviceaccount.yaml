apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-ingress-patcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oca.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-ingress-patcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oca.labels" . | nindent 4 }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-ingress-patcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oca.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-ingress-patcher
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-ingress-patcher
  apiGroup: rbac.authorization.k8s.io
