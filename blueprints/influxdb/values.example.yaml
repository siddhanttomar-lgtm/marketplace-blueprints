# InfluxDB — example configuration
# Copy this file, fill in required values, and pass to helm install:
#   helm install influxdb blueprints/influxdb -f my-values.yaml

# ── Networking ────────────────────────────────────────────────────────────────

service:
  type: NodePort    # set NodePort for external access
  ports:
    http: 8086

# ── Authentication ────────────────────────────────────────────────────────────

auth:
  enabled: true     # bearer token auth — keep true for production

# ── Storage ───────────────────────────────────────────────────────────────────

persistence:
  size: 8Gi
  storageClass: ""    # leave empty for cluster default
