# Example values for n8n workflow automation
# Copy this file to my-values.yaml, fill in your settings, and deploy.

main:
  secret:
    n8n:
      encryption_key: "YOUR-RANDOM-32-CHAR-ENCRYPTION-KEY"
  config:
    n8n:
      hide_usage_page: true
  persistence:
    enabled: true
    type: dynamic
    size: 5Gi
  service:
    type: NodePort
    port: 5678
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi
