# Drupal — example values
# helm install drupal blueprints/drupal -f my-values.yaml

drupalUsername: admin
drupalPassword: "YOUR-DRUPAL-PASSWORD"
drupalEmail: "admin@example.com"

service:
  type: NodePort

persistence:
  drupal:
    size: 8Gi
    storageClass: ""

mariadb:
  auth:
    rootPassword: "YOUR-DB-ROOT-PASSWORD"
    password: "YOUR-DB-USER-PASSWORD"
  primary:
    persistence:
      size: 8Gi
      storageClass: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
