  docs.js: |
    'use strict';
    const https = require('https');
    const {execSync} = require('child_process');
    const args = process.argv.slice(2);
    const cmd = args[0];
    function getToken() { return execSync('node /home/node/.openclaw/workspace/google-token.js', {env:process.env}).toString().trim(); }
    function apicall(method, path, body, token, host) {
      return new Promise((resolve,reject) => {
        const data = body ? JSON.stringify(body) : null;
        const opts = {hostname:host||'docs.googleapis.com',path,method,
          headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(data?{'Content-Length':Buffer.byteLength(data)}:{})}};
        const req = https.request(opts, res => {
          let b=''; res.on('data',c=>b+=c);
          res.on('end',()=>{ try{resolve(JSON.parse(b))}catch(e){resolve({raw:b})} });
        });
        req.on('error',reject); if(data)req.write(data); req.end();
      });
    }
    function extractText(body2) {
      let t='';
      for (const el of (body2&&body2.content||[])) {
        if (el.paragraph) for (const e of (el.paragraph.elements||[])) if (e.textRun) t+=e.textRun.content;
      }
      return t.slice(0,4000);
    }
    async function main() {
      const token = getToken();
      if (cmd === 'read') {
        const id=args[1]; if(!id){console.error('Usage: docs.js read <docId>');process.exit(1);}
        const r=await apicall('GET','/v1/documents/'+id,null,token);
        console.log('Title: '+r.title+'\n---\n'+extractText(r.body));
      } else if (cmd === 'create') {
        const ti=args.indexOf('--title'),ci=args.indexOf('--content');
        if(ti<0){console.error('Usage: docs.js create --title "..." [--content "..."]');process.exit(1);}
        const r=await apicall('POST','/v1/documents',{title:args[ti+1]},token);
        if(!r.documentId){console.log(JSON.stringify(r));return;}
        console.log('Created! ID:'+r.documentId+' | Title:'+r.title);
        console.log('URL: https://docs.google.com/document/d/'+r.documentId+'/edit');
        if(ci>=0){
          await apicall('POST','/v1/documents/'+r.documentId+':batchUpdate',{requests:[{insertText:{location:{index:1},text:args[ci+1]}}]},token);
          console.log('Content added.');
        }
      } else { console.error('Commands: read, create'); process.exit(1); }
    }
    main().catch(e=>{console.error('[docs] '+e.message);process.exit(1);});

