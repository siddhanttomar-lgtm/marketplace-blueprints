apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apa.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: {{ .Values.openclaw.gatewayToken | required "openclaw.gatewayToken is required" | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.openclaw.googleClientId | default "" | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.openclaw.googleClientSecret | default "" | quote }}
  GOOGLE_REFRESH_TOKEN: {{ .Values.openclaw.googleRefreshToken | default "" | quote }}
  GMAIL_ADDRESS: {{ .Values.openclaw.gmailAddress | default "" | quote }}
  GMAIL_SEND_NAME: {{ .Values.openclaw.gmailSendName | default "Assistant" | quote }}
  GOOGLE_TRANSLATE_KEY: {{ .Values.openclaw.googleTranslateKey | default "" | quote }}
  E2E_BEARER_TOKEN: {{ .Values.openclaw.e2eBearerToken | default "" | quote }}
  # Namespace injected by platform at deploy time via global.platform.tirProjectId;
  # e2e.projectNamespace is a manual override fallback for deploys outside the platform.
  E2E_PROJECT_NAMESPACE: {{ .Values.global.platform.tirProjectId | default (.Values.e2e.projectNamespace | default "") | quote }}
  E2E_MODEL_NAME: {{ .Values.e2e.modelName | default "gpt_oss_120b" | quote }}
  TELEGRAM_BOT_TOKEN: {{ regexReplaceAll "\\s+" (.Values.telegram.botToken | default "") "" | quote }}
