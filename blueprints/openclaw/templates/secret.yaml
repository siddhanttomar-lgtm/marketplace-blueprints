apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: {{ .Values.gateway.token | quote }}
  ANTHROPIC_API_KEY: {{ .Values.gateway.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.gateway.openaiApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.gateway.geminiApiKey | quote }}
  OPENROUTER_API_KEY: {{ .Values.gateway.openrouterApiKey | quote }}
