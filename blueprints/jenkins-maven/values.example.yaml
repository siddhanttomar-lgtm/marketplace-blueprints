# Jenkins + Maven — example configuration
# Copy this file, fill in required values, and pass to helm install:
#   helm install jenkins-maven blueprints/jenkins-maven -f my-values.yaml

# ── Required ──────────────────────────────────────────────────────────────────

jenkins:
  jenkinsPassword: "YOUR-STRONG-PASSWORD-HERE"

  # ── Storage ─────────────────────────────────────────────────────────────────

  persistence:
    size: 10Gi

  # ── Resources ───────────────────────────────────────────────────────────────

  resources:
    requests:
      memory: 1Gi
      cpu: 200m
    limits:
      memory: 2Gi
      cpu: "2"
