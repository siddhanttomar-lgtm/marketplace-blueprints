# Mattermost — example values
# helm install mattermost blueprints/mattermost -f my-values.yaml

service:
  type: NodePort
  port: 8065

# Optional: set your Mattermost site URL (required for correct link generation)
siteUrl: "http://your-node-ip:NODE_PORT"

data:
  storageSize: "10Gi"

postgresql:
  auth:
    username: mattermost
    password: "YOUR-DB-PASSWORD"
    database: mattermost
  primary:
    persistence:
      size: "10Gi"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
