apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mattermost
  labels:
    {{- include "mattermost.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mattermost.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "mattermost.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 2000
        runAsUser: 2000
      {{- with ((.Values.global).imagePullSecrets) }}
      imagePullSecrets:
        {{- range . }}
        {{- if kindIs "map" . }}
        - {{ toYaml . | trim }}
        {{- else }}
        - name: {{ . }}
        {{- end }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Release.Name }}-postgresql 5432; do
                echo "Waiting for PostgreSQL..."; sleep 3
              done
              echo "PostgreSQL is ready"
      containers:
        - name: mattermost
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8065
          env:
            - name: MM_SQLSETTINGS_DRIVERNAME
              value: "postgres"
            - name: MM_SQLSETTINGS_DATASOURCE
              value: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
            - name: MM_FILESETTINGS_DRIVERNAME
              value: "local"
            - name: MM_FILESETTINGS_DIRECTORY
              value: "/mattermost/data"
            - name: MM_SERVICESETTINGS_SITEURL
              value: {{ .Values.siteUrl | quote }}
            - name: MM_SERVICESETTINGS_LISTENADDRESS
              value: ":8065"
            - name: MM_LOGSETTINGS_CONSOLELEVEL
              value: "INFO"
          volumeMounts:
            - name: mattermost-data
              mountPath: /mattermost/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: 8065
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: 8065
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: mattermost-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-mattermost-data
