agentName: "Analytics Agent"

openclaw:
  image:
    repository: registry.e2enetworks.net/marketplace-blueprint/openclaw
    tag: "slim"
    pullPolicy: Always
  storage:
    size: "5Gi"
  # REQUIRED: Gateway auth token — change before production
  gatewayToken: "Analytics@12345"
  # At least one AI API key required (Anthropic or OpenAI recommended)
  anthropicApiKey: ""
  openaiApiKey: ""
  googleApiKey: ""
  groqApiKey: ""
  # Fireworks AI key (OpenAI-compatible endpoint — useful for testing without a native key)
  # Get one at fireworks.ai — set this if you don't have an Anthropic/OpenAI key yet
  fireworksApiKey: ""
  # Optional: Gmail credentials for scheduled email reports
  # Use a Gmail App Password (myaccount.google.com/apppasswords) — NOT your regular password
  gmailUser: ""
  gmailAppPassword: ""
  # Optional: custom OpenAI-compatible endpoint (Fireworks, Together AI, etc.)
  # e.g. "https://api.fireworks.ai/inference/v1"
  openaiApiBase: ""
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

telegram:
  # Optional — if set, enables a Telegram bot that bridges to the analytics agent.
  # Create a bot via @BotFather on Telegram, paste the token here.
  botToken: ""

umami:
  image:
    repository: registry.e2enetworks.net/marketplace-blueprint/umami
    tag: "3.1.0"
    pullPolicy: Always
  adminPassword: "Umami@12345"
  appSecret: "umami-secret-change-in-production"
  websiteName: ""
  websiteDomain: ""
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

umamiMcp:
  image:
    repository: registry.e2enetworks.net/marketplace-blueprint/umami-mcp
    tag: "sha-ca8e900"
    pullPolicy: Always
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "128Mi"

postgresql:
  enabled: true
  global:
    imagePullSecrets:
      - registry-pull-secret
    security:
      allowInsecureImages: true
  image:
    registry: registry.e2enetworks.net
    repository: marketplace-blueprint/postgresql
    tag: latest
    pullPolicy: Always
  volumePermissions:
    image:
      registry: registry.e2enetworks.net
      repository: marketplace-blueprint/os-shell
      tag: latest
      pullPolicy: Always
  metrics:
    image:
      registry: quay.io
      repository: prometheuscommunity/postgres-exporter
      pullPolicy: Always
  auth:
    database: "umami"
    username: "umami"
    password: "Umami@DB12345"
    postgresPassword: "Postgres@Root123"
  architecture: standalone
  primary:
    initdb:
      scripts:
        00_create_extensions.sql: |
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
    persistence:
      enabled: true
      size: "8Gi"
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "512Mi"

persistence:
  accessMode: ReadWriteOnce

nodeSelector: {}
