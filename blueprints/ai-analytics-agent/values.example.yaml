# Claw Analytics Agent — example values
# helm install ai-analytics-agent blueprints/ai-analytics-agent -f my-values.yaml

openclaw:
  # REQUIRED: set a strong random gateway token
  gatewayToken: "YOUR-GATEWAY-TOKEN"
  # Provide at least one AI API key
  anthropicApiKey: ""
  openaiApiKey: ""
  groqApiKey: ""
  # Optional: Telegram bot token to query analytics via Telegram
  # telegram:
  #   botToken: "YOUR-BOT-TOKEN"

umami:
  adminPassword: "YOUR-UMAMI-ADMIN-PASSWORD"
  # Generate: openssl rand -base64 32
  appSecret: "YOUR-APP-SECRET"
  websiteName: "My Website"
  websiteDomain: "example.com"

postgresql:
  auth:
    password: "YOUR-DB-PASSWORD"
    postgresPassword: "YOUR-POSTGRES-ROOT-PASSWORD"
  primary:
    persistence:
      size: "8Gi"
