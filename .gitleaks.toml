title = "marketplace-blueprints gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Ignore placeholder values and vendored upstream charts"
paths = [
  '''values\.example\.yaml$''',
  '''blueprints/[^/]+/charts/''',
]
regexes = [
  '''YOUR-[A-Z0-9_-]+''',
  '''examplepass''',
  '''password:\s+password''',
]
